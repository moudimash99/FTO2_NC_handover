<title>FTO2 NC Vision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Layout: the dashboard read as one story, from the plant to a single aircraft. A hero sentence and the year against
   2025 on top; then five chapters, each with its number and name in a sticky rail on the left and the evidence on the
   right. Same type and colours as the FTO2 dashboard (Newsreader titles, Hanken Grotesk text and figures, FTO2 green,
   cable orange); red is kept for what reaches the customer and for alerts. Every title that states a finding is
   written by the page from the data, and can be switched back to plain chart names. */
:root {
  --page: #ffffff;
  --surface: #ffffff;
  --band: #f3f5f2;
  --ink: #15171a;
  --ink-2: #474c52;
  --muted: #6f767c;
  --rule: #dde3dd;
  --grid: #e7ebe6;
  --track: #edf0ec;
  --ring: rgba(21,23,26,0.12);
  --accent: #1d6b52;
  --accent-soft: rgba(29,107,82,0.10);
  --accent-mid: #93c2b1;
  --prior: #b9c3bc;
  --flow: rgba(29,107,82,0.20);
  --cable: #c2620c;
  --escape: #b3261e;
  --escape-soft: rgba(179,38,30,0.10);
  --warn: #a8660a;
  --good: #1d6b52;
  --on-accent: #ffffff;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #101312; --surface: #161a18; --band: #1a1f1c; --ink: #eef1ee; --ink-2: #b9c1bb; --muted: #8b948e;
    --rule: #2b322e; --grid: #252b28; --track: #222825; --ring: rgba(255,255,255,0.12);
    --accent: #5cc29b; --accent-soft: rgba(92,194,155,0.14); --accent-mid: #2f6b55; --prior: #4b5550; --flow: rgba(92,194,155,0.22);
    --cable: #f0a04b; --escape: #f07a6a; --escape-soft: rgba(240,122,106,0.14); --warn: #e8b04f; --good: #5cc29b; --on-accent: #101312;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #101312; --surface: #161a18; --band: #1a1f1c; --ink: #eef1ee; --ink-2: #b9c1bb; --muted: #8b948e;
  --rule: #2b322e; --grid: #252b28; --track: #222825; --ring: rgba(255,255,255,0.12);
  --accent: #5cc29b; --accent-soft: rgba(92,194,155,0.14); --accent-mid: #2f6b55; --prior: #4b5550; --flow: rgba(92,194,155,0.22);
  --cable: #f0a04b; --escape: #f07a6a; --escape-soft: rgba(240,122,106,0.14); --warn: #e8b04f; --good: #5cc29b; --on-accent: #101312;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.bar .row1 { padding-block: 10px 6px; }
.bar .row2 { padding-block: 4px 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 500; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
.ctl { display: inline-flex; align-items: center; gap: 8px; }
.ctl > i { font-style: normal; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font-size: 12.5px; padding: 5px 10px; border: 0; background: transparent; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); }
.btn { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ring); }
.btn:hover { filter: brightness(1.12); }
.focusbar { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-x { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--ring); }
.chip-x button { border: 0; background: transparent; cursor: pointer; padding: 0 6px; font-size: 14px; line-height: 1; color: var(--ink-2); }

/* ---------- hero ---------- */
.hero { padding-block: 34px 10px; display: grid; gap: 22px; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero h1 { font-family: var(--font-display); font-weight: 450; font-size: clamp(30px, 4vw, 50px); line-height: 1.1; letter-spacing: -0.015em; margin: 0; max-width: 31ch; text-wrap: balance; }
.hero h1 em { font-style: italic; }
.hero h1 .bad { color: var(--escape); } .hero h1 .good { color: var(--accent); }
.hero .lede { font-size: 15.5px; color: var(--ink-2); max-width: 70ch; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.tile { padding: 14px 16px 14px 0; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile + .tile { padding-left: 16px; border-left: 1px solid var(--rule); }
.tile .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.tile .v { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
.tile .s { font-size: 12.5px; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
.delta.up { color: var(--escape); } .delta.down { color: var(--good); } .delta.flat { color: var(--ink-2); }
.spark { display: block; width: 100%; height: 30px; margin-top: 2px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 28px; align-items: start; }

/* ---------- cards, chapters ---------- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 14px; display: grid; gap: 10px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card-h h3 { font-size: 14.5px; font-weight: 650; margin: 0; }
.card-h p, .note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 70ch; }
.chap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; padding-block: 44px; border-top: 1px solid var(--rule); scroll-margin-top: 104px; }
.rail { position: sticky; top: 112px; align-self: start; display: grid; gap: 6px; }
.rail .n { font-family: var(--font-display); font-size: 46px; line-height: 1; color: var(--accent); font-weight: 400; }
.rail .nm { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.rail .d { font-size: 12.5px; color: var(--muted); }
.chap-body { display: grid; gap: 18px; min-width: 0; }
.chap h2 { font-family: var(--font-display); font-weight: 450; font-size: clamp(24px, 2.6vw, 33px); line-height: 1.15; letter-spacing: -0.01em; margin: 0; max-width: 30ch; text-wrap: balance; }
.chap h2 em { font-style: italic; }
.chap h2 .bad { color: var(--escape); } .chap h2 .good { color: var(--accent); }
.chap h2 .cab { color: var(--cable); }
.sub2 { font-size: 14.5px; color: var(--ink-2); margin: 0; max-width: 72ch; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.chart { width: 100%; min-width: 0; position: relative; }
.chart svg { display: block; overflow: visible; }
.scroll-x { overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.line { height: 2px; width: 14px; border-radius: 1px; }
.sw.dot { width: 9px; height: 9px; border-radius: 50%; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.tag.new { color: var(--escape); } .tag.chronic { color: var(--warn); } .tag.rise { color: var(--ink-2); }
.datatoggle { justify-self: start; font-size: 12px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; }
.datatoggle::before { content: "▸ "; }
.datatoggle[aria-expanded="true"]::before { content: "▾ "; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
.tbl th, .tbl td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
svg text { font-family: var(--font-ui); fill: var(--ink-2); font-size: 11.5px; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lab { fill: var(--ink); font-size: 12px; }
svg .lab-b { fill: var(--ink); font-size: 12.5px; font-weight: 650; }
svg .val { fill: var(--ink-2); font-size: 11.5px; font-variant-numeric: tabular-nums; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .base { stroke: var(--rule); stroke-width: 1; }
.hit { cursor: pointer; }

/* signals */
.signals { display: grid; gap: 0; background: var(--band); border-radius: 10px; padding: 16px 16px 6px; align-self: stretch; align-content: start; }
.signals h3 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; margin: 0 0 6px; }
.sig { display: grid; grid-template-columns: auto minmax(0, 1fr) 84px 10px; gap: 4px 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--rule); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.sig:hover { background: var(--accent-soft); }
.sig { padding-inline: 4px; border-radius: 0; }
.sig .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 1.5px solid currentColor; }
.sig.crit .ic { color: var(--escape); } .sig.warn .ic { color: var(--warn); } .sig.good .ic { color: var(--good); } .sig.info .ic { color: var(--ink-2); }
.sig .tx { font-size: 13.5px; line-height: 1.35; }
.sig .tx b { font-weight: 650; }
.sig .tx small { display: block; color: var(--muted); font-size: 12px; }
.sig svg { width: 84px; height: 28px; }
.sig-none { font-size: 13px; color: var(--muted); padding: 10px 0; border-top: 1px solid var(--rule); }

/* anatomy */
.anat-big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.anat-big .v { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
.anat-big .s { color: var(--ink-2); font-size: 14px; }

/* passport */
.pass { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.pass-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pass-h b { font-family: var(--font-display); font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--band); border: 1px solid var(--rule); color: var(--ink-2); }
.pill.hot { background: var(--accent-soft); color: var(--ink); border-color: transparent; cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.stats > div { padding: 10px 12px 10px 0; display: grid; gap: 2px; }
.stats > div + div { padding-left: 12px; border-left: 1px solid var(--rule); }
.stats .k { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stats .v { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
.stats .s { font-size: 12px; color: var(--muted); }
.finlist { display: grid; gap: 6px; }
.finrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.finrow b { font-weight: 650; font-variant-numeric: tabular-nums; }

/* footer */
footer { border-top: 1px solid var(--rule); padding-block: 26px 60px; color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }
footer p { margin: 0; max-width: 110ch; }

/* tooltip */
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.35; max-width: 300px; box-shadow: 0 6px 24px rgba(0,0,0,.18); opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
#tip b { font-weight: 700; font-size: 14px; display: block; }
#tip .r { display: flex; gap: 8px; justify-content: space-between; }
#tip .m { opacity: .75; }

/* presentation mode: one chapter per screen */
.deck-nav { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: none; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 12.5px; }
.deck-nav button { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; width: 30px; height: 30px; cursor: pointer; }
.deck-nav .dots { display: flex; gap: 5px; }
.deck-nav .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--prior); }
.deck-nav .dots i.on { background: var(--accent); }
body.presenting .bar, body.presenting footer, body.presenting .datatoggle, body.presenting .tbl, body.presenting .card-h p, body.presenting .hero .lede { display: none !important; }
body.presenting .deck-nav { display: flex; }
body.presenting [data-slide] { display: none; }
body.presenting [data-slide].on { display: grid; align-content: start; padding-block: 28px 20px; border-top: 0; }
body.presenting .chap.on { grid-template-columns: 240px minmax(0, 1fr); }
body.presenting [data-slide].on.step1 [data-step="2"], body.presenting [data-slide].on.step2 [data-step="1"] { display: none; }
body.presenting .rail { position: static; }
body.presenting .wrap { max-width: 1440px; }
@media (prefers-reduced-motion: no-preference) {
  body.presenting [data-slide].on { animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
  .fade { transition: opacity .15s; }
}

@media (max-width: 1060px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile:nth-child(4) { padding-left: 0; border-left: 0; }
  .tile:nth-child(n+4) { border-top: 1px solid var(--rule); }
  .hero-grid, .grid2, .grid2.even, .pass { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .chap, body.presenting .chap.on { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail { position: static; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .rail .n { font-size: 32px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(3) { padding-left: 0; border-left: 0; }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:nth-child(n) { padding-left: 0; border-left: 0; }
  .tile:nth-child(2n) { padding-left: 14px; border-left: 1px solid var(--rule); }
  .tile:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .tile .v { font-size: 28px; }
  .brand span { display: none; }
}
</style>

<div class="bar" id="bar">
  <div class="wrap row1">
    <div class="brand"><b id="tTitle">Non-conformités FTO2</b><span id="tAsof"></span></div>
    <div class="seg" id="fFind" role="group"></div>
    <div class="seg" id="fLang" role="group"><button type="button" data-v="fr">FR</button><button type="button" data-v="en">EN</button></div>
    <button type="button" class="btn ghost" id="bCopy"></button>
    <button type="button" class="btn" id="bPresent"></button>
  </div>
  <div class="wrap row2">
    <div class="ctl"><i id="lLine">Ligne</i><div class="seg" id="fLine" role="group"></div></div>
    <div class="ctl"><i id="lPhase">Production</i><div class="seg" id="fPhase" role="group"></div></div>
    <div class="ctl"><i id="lNature">Défauts</i><div class="seg" id="fNature" role="group"></div></div>
    <div class="focusbar" id="focusbar" hidden></div>
  </div>
</div>

<main class="wrap" id="main">

        <div class="legend" id="ymLegend"></div>
        <button type="button" class="datatoggle" data-t="ym"></button><div class="tbl" id="tbl-ym" hidden></div>

  <section class="chap" id="s1" data-slide>

      <h2 id="h1t"></h2>
      <p class="sub2" id="h1s"></p>
      <div class="grid2">
        <div class="card"><div class="card-h"><div><h3 id="c1aT"></h3><p id="c1aN"></p></div></div><div class="chart" id="growChart"></div><div class="legend" id="growLegend"></div>
          <button type="button" class="datatoggle" data-t="grow"></button><div class="tbl" id="tbl-grow" hidden></div></div>
        <div class="card"><div class="card-h"><div><h3 id="c1bT"></h3><p id="c1bN"></p></div></div><div class="chart" id="cableChart"></div>
          <button type="button" class="datatoggle" data-t="cable"></button><div class="tbl" id="tbl-cable" hidden></div></div>
      </div>

  <section class="chap" id="s2" data-slide>
    <div class="rail"><div class="n">02</div><div class="nm" id="r2n"></div><div class="d" id="r2d"></div></div>
    <div class="chap-body">
      <h2 id="h2t"></h2>
      <p class="sub2" id="h2s"></p>
      <div class="card" data-step="1"><div class="card-h"><div><h3 id="c2aT"></h3><p id="c2aN"></p></div></div>
        <div class="scroll-x"><div class="chart" id="netChart" style="min-width:620px"></div></div>
        <div class="legend" id="netLegend"></div>
        <button type="button" class="datatoggle" data-t="net"></button><div class="tbl" id="tbl-net" hidden></div></div>
      <div class="card" data-step="2"><div class="card-h"><div><h3 id="c2bT"></h3><p id="c2bN"></p></div></div><div class="chart" id="escChart"></div>
        <button type="button" class="datatoggle" data-t="esc"></button><div class="tbl" id="tbl-esc" hidden></div></div>
    </div>
  </section>

  <section class="chap" id="s3" data-slide>
    <div class="rail"><div class="n">03</div><div class="nm" id="r3n"></div><div class="d" id="r3d"></div></div>
    <div class="chap-body">
      <h2 id="h3t"></h2>
      <div class="card">

    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showSlide(S.slide - 1); }
    if (e.key === 'Escape') present(false);
  });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && document.body.classList.contains('presenting')) present(false); });
  Array.prototype.forEach.call($('fLang').children, function (b) { b.addEventListener('click', function () { S.lang = b.getAttribute('data-v'); save(); render(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('.datatoggle'), function (b) {
    b.addEventListener('click', function () { var k = b.getAttribute('data-t'), box = $('tbl-' + k); box.hidden = !box.hidden; if (!box.hidden) drawTable(k); controls(); });
  });

  window.addEventListener('scroll', hideTip, { passive: true });
  if (location.hash === '#present') present(true);
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
