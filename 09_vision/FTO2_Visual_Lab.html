<style>
/* Layout: a lab bench of five full-width plates, each one way of drawing the same FTO2 defects, numbered in the order
   they were proposed, each closing on where it would live in the dashboard and a keep / later / no choice. Same type and
   colours as the FTO2 pages; red marks what reached the customer, orange the cable defects, green FTO2. */
:root {
  --page: #ffffff;
  --surface: #ffffff;
  --band: #f3f5f2;
  --ink: #15171a;
  --ink-2: #474c52;
  --muted: #6f767c;
  --rule: #dde3dd;
  --grid: #e7ebe6;
  --track: #edf0ec;
  --ring: rgba(21,23,26,0.12);
  --accent: #1d6b52;
  --accent-soft: rgba(29,107,82,0.10);
  --accent-mid: #93c2b1;
  --prior: #b9c3bc;
  --flow: rgba(29,107,82,0.22);
  --river-a: #cdd8d1;
  --river-b: #b3c4ba;
  --cable: #c2620c;
  --escape: #b3261e;
  --warn: #a8660a;
  --on-accent: #ffffff;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #101312; --surface: #161a18; --band: #1a1f1c; --ink: #eef1ee; --ink-2: #b9c1bb; --muted: #8b948e;
    --rule: #2b322e; --grid: #252b28; --track: #222825; --ring: rgba(255,255,255,0.12);
    --accent: #5cc29b; --accent-soft: rgba(92,194,155,0.14); --accent-mid: #2f6b55; --prior: #4b5550; --flow: rgba(92,194,155,0.20);
    --river-a: #2c3631; --river-b: #3a4a42; --cable: #f0a04b; --escape: #f07a6a; --warn: #e8b04f; --on-accent: #101312;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #101312; --surface: #161a18; --band: #1a1f1c; --ink: #eef1ee; --ink-2: #b9c1bb; --muted: #8b948e;
  --rule: #2b322e; --grid: #252b28; --track: #222825; --ring: rgba(255,255,255,0.12);
  --accent: #5cc29b; --accent-soft: rgba(92,194,155,0.14); --accent-mid: #2f6b55; --prior: #4b5550; --flow: rgba(92,194,155,0.20);
  --river-a: #2c3631; --river-b: #3a4a42; --cable: #f0a04b; --escape: #f07a6a; --warn: #e8b04f; --on-accent: #101312;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar .wrap { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 500; font-size: 19px; white-space: nowrap; }
.brand span { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
.ctl { display: inline-flex; align-items: center; gap: 8px; }
.ctl > i { font-style: normal; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font-size: 12.5px; padding: 5px 10px; border: 0; background: transparent; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); }
.btn { font-size: 13px; font-weight: 650; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.btn:hover { filter: brightness(1.12); }
.btn[disabled] { opacity: .5; cursor: default; }

.hero { padding-block: 40px 6px; display: grid; gap: 14px; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.hero h1 { font-family: var(--font-display); font-weight: 450; font-size: clamp(32px, 4.4vw, 54px); line-height: 1.06; letter-spacing: -0.015em; margin: 0; max-width: 22ch; text-wrap: balance; }
.lede { font-size: 16.5px; color: var(--ink-2); max-width: 70ch; margin: 0; }

.plate { display: grid; gap: 16px; padding-block: 44px 20px; border-top: 1px solid var(--rule); margin-top: 32px; scroll-margin-top: 70px; }
.plate-h { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 6px 20px; align-items: end; }
.plate-h .n { font-family: var(--font-display); font-size: 52px; line-height: .9; color: var(--accent); }
.plate-h h2 { font-family: var(--font-display); font-weight: 450; font-size: clamp(26px, 3vw, 38px); line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.plate-h p { margin: 4px 0 0; color: var(--ink-2); max-width: 78ch; font-size: 14.5px; }
.stage { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 12px; min-width: 0; position: relative; }
.chart { width: 100%; min-width: 0; position: relative; }
.chart svg, .chart canvas { display: block; }
.scroll-x { overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.dot { width: 9px; height: 9px; border-radius: 50%; }
.sw.line { width: 16px; height: 0; border-top: 2px solid; border-radius: 0; }
.sw.dash { width: 16px; height: 0; border-top: 1.5px dashed; border-radius: 0; }
.plate-f { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; align-items: center; }
.where { font-size: 13.5px; color: var(--ink-2); max-width: 80ch; }
.where b { color: var(--ink); }
.choice { display: inline-flex; border: 1px solid var(--ring); border-radius: 7px; overflow: hidden; background: var(--surface); }
.choice button { font-size: 12.5px; padding: 6px 11px; border: 0; background: transparent; cursor: pointer; white-space: nowrap; }
.choice button + button { border-left: 1px solid var(--ring); }
.choice button[aria-pressed="true"][data-v="keep"] { background: var(--accent); color: var(--on-accent); font-weight: 650; }
.choice button[aria-pressed="true"][data-v="later"] { background: var(--warn); color: var(--on-accent); font-weight: 650; }
.choice button[aria-pressed="true"][data-v="no"] { background: var(--ink-2); color: var(--surface); font-weight: 650; }
.save-state { font-size: 12.5px; color: var(--muted); }
.clock { position: absolute; right: 22px; top: 18px; font-family: var(--font-display); font-size: 26px; color: var(--ink-2); pointer-events: none; }
.tools { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
svg text { font-family: var(--font-ui); fill: var(--ink-2); font-size: 11.5px; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lab { fill: var(--ink); font-size: 12.5px; }
svg .lab-b { fill: var(--ink); font-size: 13px; font-weight: 650; }
svg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
.hit { cursor: pointer; }
footer { border-top: 1px solid var(--rule); margin-top: 40px; padding-block: 22px 60px; color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; }
footer p { margin: 0; max-width: 110ch; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.35; max-width: 320px; box-shadow: 0 6px 24px rgba(0,0,0,.18); opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
#tip b { font-weight: 700; font-size: 14px; display: block; }
#tip .r { display: flex; gap: 10px; justify-content: space-between; }
#tip .m { opacity: .75; }
@media (prefers-reduced-motion: no-preference) { .fade { transition: opacity .18s, fill .18s; } }
@media (max-width: 760px) {
  .plate-h { grid-template-columns: 44px minmax(0, 1fr); }
  .plate-h .n { font-size: 38px; }
  .plate-h .tools { grid-column: 1 / -1; }
  .brand span { display: none; }
}
</style>

    var hitR = el('rect', { x: m.l, y: m.t, width: w - m.l - m.r, height: H - m.t - m.b, fill: 'transparent', 'pointer-events': 'all' }, svg);
    hitR.style.pointerEvents = 'none';
    svg.addEventListener('pointermove', function (ev) {
      var rc = svg.getBoundingClientRect(), mxp = ev.clientX - rc.left, k = Math.round((mxp - m.l) / (w - m.l - m.r) * (NW - 1));
      if (k < 0 || k >= NW) { cross.setAttribute('opacity', 0); hideTip(); return; }
      cross.setAttribute('x1', xs(k)); cross.setAttribute('x2', xs(k)); cross.setAttribute('opacity', 0.5);
      var rows = RIVER.map(function (g) { return [num(val[g][k]), g < 5 ? nm(CAT[g]) : L().others]; }).reverse();
      rows.push([num(tot[k]), L().total]); if (hasBase) rows.push([num(ghost[k]), t('y0tot')]);
      showTip(ev, fill(L().week, { d: dateTxt(dayDate(Y, k * 7), true) }), rows);
    });
    svg.addEventListener('pointerleave', function () { cross.setAttribute('opacity', 0); hideTip(); });
    $('sLegend').innerHTML = (hasBase ? '<span><i class="sw dash" style="border-color:var(--ink-2)"></i>' + t('ghost') + '</span>' : '<span>' + t('noBase') + '</span>') + '<span>' + t('sWidth') + '</span>';
    window.__lab.river = { weeks: NW, total: tot.reduce(function (a, b) { return a + b; }, 0), ghost: Math.round(ghost.reduce(function (a, b) { return a + b; }, 0) * 10) / 10, hasBase: hasBase };
  }

  // ---------------------------------------------------------------- choices, saved with the page when it can
  var CH = { state: {}, db: null, queue: {} };
  function chStatus() { $('chState').textContent = CH.db ? L().savedAll : L().localAll; }
  function drawChoices() {
    Array.prototype.forEach.call(document.querySelectorAll('.choice'), function (box) {
      var id = box.getAttribute('data-id'); box.textContent = '';
      ['keep', 'later', 'no'].forEach(function (v) {
        var b = document.createElement('button'); b.type = 'button'; b.setAttribute('data-v', v); b.textContent = L()[v];
        b.setAttribute('aria-pressed', String((CH.state[id] || {}).choice === v));
        b.addEventListener('click', function () { var cur = (CH.state[id] || {}).choice; saveChoice(id, cur === v ? '' : v); });
        box.appendChild(b);
      });
    });
  }
  function saveLocal() { try { localStorage.setItem('fto2-lab-choices', JSON.stringify(CH.state)); } catch (e) {} }
  function saveChoice(id, v) {
    var doc = { choice: v, at: new Date().toISOString() }; CH.state[id] = doc; drawChoices();
    if (!CH.db) { saveLocal(); return; }
    // one write at a time per choice; a refused write (a viewer who cannot write) keeps the choices in this browser
    CH.queue[id] = (CH.queue[id] || Promise.resolve()).then(function () { return CH.db ? CH.db.collection('lab').doc(id).set(doc) : null; })
      .catch(function () { CH.db = null; saveLocal(); chStatus(); });
  }
  try { CH.state = JSON.parse(localStorage.getItem('fto2-lab-choices') || '{}') || {}; } catch (e) {}
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('db').then(function (db) {
      if (!db) return;
      CH.db = db;
      chStatus();
      db.collection('lab').onSnapshot(function (snap) { var next = {}; snap.docs.forEach(function (d) { if (d.exists) next[d.id] = d.data(); }); CH.state = next; drawChoices(); }, function () { CH.db = null; chStatus(); });
    }, function () {});
  }

  // ---------------------------------------------------------------- frame
  function seg(id, items, cur, onPick) {
    var box = $(id); box.textContent = '';
    items.forEach(function (it) { var b = document.createElement('button'); b.type = 'button'; b.textContent = it[1]; b.setAttribute('aria-pressed', String(it[0] === cur)); b.addEventListener('click', function () { onPick(it[0]); }); box.appendChild(b); });
  }
  function texts() {
    document.documentElement.lang = S.lang;
    $('tTitle').textContent = L().title; $('tAsof').textContent = fill(L().asof, { d: dateTxt(ASOF) });
    $('lLine').textContent = L().line;
    $('hEye').textContent = L().eye; $('hTitle').textContent = L().h1; $('hLede').textContent = fill(L().lede, { d: dateTxt(ASOF) });
    ['v1', 'v2', 'v3', 'v4', 'v5'].forEach(function (v) { $(v + 'T').textContent = t(v + 'T'); $(v + 'P').textContent = t(v + 'P'); $(v + 'W').innerHTML = L()[v + 'W']; });
    $('v1HlL').textContent = L().v1Hl; chStatus();
    if (!$('rPlay').disabled) $('rPlay').textContent = RAIN.t < 1 ? L().playing : L().play;
    Array.prototype.forEach.call($('fLang').children, function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === S.lang)); });
    seg('fLine', [[-1, L().all], [0, 'A350'], [1, 'A330'], [2, 'A320'], [3, 'A400M']], S.line, function (v) { S.line = v; S.jPin = null; render(); });
    seg('v1Hl', [['client', L().hlClient], ['cable', L().hlCable]], S.hl, function (v) { S.hl = v; render(); });
    var ft = $('foot'); ft.textContent = '';
    L().foot.forEach(function (s) { var p = document.createElement('p'); p.textContent = fill(s, { d: dateTxt(ASOF), y: Y, y0: Y0 }); ft.appendChild(p); });
    drawChoices();
  }
  window.__lab = { rainObj: RAIN };
  function render() {
    hideTip(); texts();
    var V = select();
    journey(V); rain(V); lifelines(V); faces(V); river(V);
  }
  Array.prototype.forEach.call($('fLang').children, function (b) { b.addEventListener('click', function () { S.lang = b.getAttribute('data-v'); try { localStorage.setItem('fto2-lab', JSON.stringify({ lang: S.lang })); } catch (e) {} render(); }); });
  $('rPlay').addEventListener('click', playRain);
  var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(render, 150); });
  window.addEventListener('scroll', hideTip, { passive: true });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } catch (e) {}
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
