<title>FTO2 NC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the FTO2 quality pages' system, for presentation. Header (unit, title, period, one switch for minor
   defects, language), five tabs: Pareto, weekly Pareto, cost of non-quality, customer returns, root causes.
   Each tab: headline figures, clickable breakdowns that filter each other, the detail kept folded below. */
:root {
  --page: #f6f6f3;
  --surface: #fdfdfb;
  --ink: #101418;
  --ink-2: #4c5157;
  --muted: #7d8187;
  --grid: #e3e3dd;
  --track: #ecece6;
  --ring: rgba(16,20,24,0.10);
  --s1: #1f5fae;
  --s1-soft: rgba(31,95,174,0.10);
  --s2: #c2620c;
  --dim: #b9bab3;
  --ref: #101418;
  --up: #a33b2b;
  --down: #2c7a4b;
  --focus: #1f5fae;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
    --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
    --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --s2: #f0a04b; --dim: #4e5359; --ref: #f2f3f4;
    --up: #e07a68; --down: #5cbf86; --focus: #4d8fdc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
  --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
  --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --s2: #f0a04b; --dim: #4e5359; --ref: #f2f3f4;
  --up: #e07a68; --down: #5cbf86; --focus: #4d8fdc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
header { display: grid; gap: 12px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.unit { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.titles { display: grid; gap: 4px; }
h1 { font-weight: 700; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.12; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-weight: 600; font-size: 14.5px; margin: 0; }
p { margin: 0; max-width: 78ch; }
.period, .sub { color: var(--ink-2); }
.sub { font-size: 13.5px; }
.controls { display: flex; gap: 10px 20px; align-items: center; flex-wrap: wrap; }
.ctl { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.label { font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg.lang button { padding: 4px 11px; font-size: 12px; letter-spacing: .05em; font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, [role="tab"]:focus-visible, summary:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select { font: inherit; font-size: 13.5px; padding: 5px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); overflow-x: auto; align-items: end; }
.tabs [role="tab"] { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; white-space: nowrap; }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); }
.tabs [role="tab"]:hover { color: var(--ink); }
.tabs .gap { width: 1px; align-self: stretch; margin: 10px 8px; background: var(--grid); flex: none; }
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.lead { display: grid; gap: 2px; }
.lead h2 { font-size: 22px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.fig b { font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig b.word { font-size: 20px; line-height: 1.25; }
.fig span { font-size: 13px; color: var(--ink-2); }
.fig small { font-size: 12px; color: var(--muted); }
.delta.up { color: var(--up); } .delta.down { color: var(--down); }
.strip { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 16px; }
.strip b { color: var(--ink); font-weight: 600; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.section-head > div { display: grid; gap: 2px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.clear-one { font: inherit; font-size: 12px; color: var(--s1); background: none; border: 0; padding: 0; cursor: pointer; }
.bars { display: grid; gap: 2px; }
.bar { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4.2em; align-items: center; gap: 10px; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; border-radius: 4px; padding: 3px 4px; text-align: left; cursor: pointer; }
.bars.money .bar { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 6.4em; }
.bars.pareto .bar { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4.2em 3.6em; }
.bars.money.pareto .bar { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 6.4em 3.6em; }
.bars.longname .bar { grid-template-columns: minmax(0, 40em) minmax(0, 1fr) 4.2em; }
.bar:hover { background: var(--track); }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { position: relative; height: 13px; background: var(--track); border-radius: 2px; }
.bar .fill { display: block; position: relative; overflow: hidden; height: 100%; background: var(--s1); border-radius: 2px; }
.bar .fill .cab { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s2); }
.bars.active .bar:not([aria-pressed="true"]) .fill .cab { opacity: .45; }
.key i.c { background: var(--s2); }
.bar.aside .fill { background: var(--dim); }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ref); border-radius: 1px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .cum { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.bars.active .bar .fill { background: var(--dim); }
.bars.active .bar[aria-pressed="true"] .fill { background: var(--s1); }
.bar[aria-pressed="true"] { background: var(--s1-soft); }
.bar[aria-pressed="true"] .name { font-weight: 600; }
.bar.zero { color: var(--muted); }
.sep { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 4px 2px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--s1); }
.key i.t { width: 2px; height: 14px; background: var(--ref); }
.cols-wrap { overflow-x: auto; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(22px, 1fr); gap: 4px; align-items: end; height: 170px; min-width: 100%; }
.col { font: inherit; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 3px; height: 100%; background: none; border: 0; border-radius: 4px; padding: 2px 0; cursor: pointer; color: var(--ink); min-width: 0; }
.col:hover { background: var(--track); }
.col .v { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.col .stick { width: 72%; align-self: end; background: var(--s1); border-radius: 2px 2px 0 0; min-height: 1px; }
.col.partial .stick { background: repeating-linear-gradient(135deg, var(--s1) 0 3px, transparent 3px 6px); border: 1px solid var(--s1); }
.col .m { font-size: 10.5px; color: var(--ink-2); white-space: nowrap; }
.cols.active .col .stick { background: var(--dim); border-color: var(--dim); }
.cols.active .col[aria-pressed="true"] .stick { background: var(--s1); border-color: var(--s1); }
.col[aria-pressed="true"] { background: var(--s1-soft); }
.empty { font-size: 13px; color: var(--muted); padding: 6px 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 28px; }
.chip { font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ring); background: var(--s1-soft); color: var(--ink); cursor: pointer; }
.chip i { font-style: normal; color: var(--ink-2); }
.chip.reset { background: transparent; color: var(--s1); }
.chips .hint { font-size: 12.5px; color: var(--muted); }
details.detail { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; }
details.detail > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14.5px; list-style-position: inside; }
details.detail > summary .count { font-weight: 400; margin-left: 6px; }
details.detail[open] > summary { border-bottom: 1px solid var(--grid); }
details.detail .inner { padding: 12px 16px 16px; display: grid; gap: 12px; min-width: 0; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
input[type="search"] { font: inherit; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); width: min(100%, 320px); }
.count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; background: var(--surface); }
th.r, td.r { text-align: right; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.nc { font-family: var(--font-data); font-size: 12.5px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.txt { min-width: 16em; color: var(--ink-2); }
tr.open-row { cursor: pointer; }
tr.open-row:hover td { background: var(--track); }
tr.open-row[aria-expanded="true"] td { background: var(--s1-soft); border-bottom-color: transparent; }
tr.more-row td { padding: 4px 10px 16px; }
.more-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 14px; }
.more-grid h4, .rcacard h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.long { font-family: var(--font-data); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px 10px; margin: 0; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 12.5px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ring); color: var(--ink-2); white-space: nowrap; }
.more { font: inherit; font-size: 13px; color: var(--s1); background: none; border: 1px solid var(--ring); border-radius: 6px; padding: 6px 12px; cursor: pointer; justify-self: start; }
.weekbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.weekbar button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.weekbar button:disabled { color: var(--muted); cursor: default; }
.levels { display: grid; gap: 8px; }
.level { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr) 7em; gap: 10px; align-items: center; font-size: 13px; }
.level .track { height: 13px; background: var(--track); border-radius: 2px; }
.level .fill { display: block; height: 100%; background: var(--dim); border-radius: 2px; }
.level.main .fill { background: var(--s1); }
.level.main .name { font-weight: 600; }
.level .val { text-align: right; font-variant-numeric: tabular-nums; }
.big { font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.chain { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.chain .step { flex: 1 1 150px; background: var(--page); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.chain .step b { font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chain .step span { font-size: 13px; color: var(--ink-2); }
.chain .step.base { border-color: var(--s1); background: var(--s1-soft); }
.chain .arrow { align-self: center; color: var(--muted); font-size: 18px; }
table.rcatab { min-width: 720px; }
table.rcatab tbody tr { cursor: pointer; }
table.rcatab tbody tr:hover td { background: var(--track); }
.rcagroup { display: grid; gap: 10px; }
.rcagroup > h2 { font-size: 18px; }
.rcacard { scroll-margin-top: 16px; }
.rcacard .stats { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rcacard .stats b { color: var(--ink); font-size: 15px; }
.rcacard .en { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.subs { display: grid; gap: 6px; font-size: 13px; }
.subs summary { cursor: pointer; }
.subs ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
.subs code { font-family: var(--font-data); font-size: 12px; color: var(--ink); }
.ex { display: grid; gap: 4px; font-size: 13px; }
.ex q { color: var(--ink-2); }
.ex .nc { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
table.matrix { min-width: 0; width: 100%; font-variant-numeric: tabular-nums; }
table.matrix th, table.matrix td { text-align: right; padding: 6px 8px; white-space: nowrap; }
table.matrix th:first-child, table.matrix td:first-child { text-align: left; white-space: normal; min-width: 12em; }
table.matrix th.cur { color: var(--ink); }
table.matrix td.cell { position: relative; }
table.matrix td.tot { font-weight: 600; border-left: 1px solid var(--grid); }
table.matrix tbody tr { cursor: pointer; }
table.matrix tbody tr:hover td { background: var(--track); }
table.matrix tbody tr[aria-pressed="true"] td { background: var(--s1-soft); }
table.matrix tbody tr[aria-pressed="true"] td:first-child { font-weight: 600; }
table.matrix tbody tr.aside td { color: var(--ink-2); }
table.matrix .heat { display: inline-block; min-width: 2.2em; padding: 1px 6px; border-radius: 4px; }
table.matrix .z { color: var(--muted); }
.col.out .stick { background: var(--dim); }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 14px; display: grid; gap: 4px; }
footer p { max-width: none; }
@media (max-width: 560px) {
  .bar, .bars.pareto .bar { grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 3.6em; }
  .bars.pareto .bar .cum { display: none; }
  .bars.longname .bar { grid-template-columns: minmax(0, 1fr) 4em 3.4em; }
  .bars.money .bar, .bars.money.pareto .bar { grid-template-columns: minmax(0, 8em) minmax(0, 1fr) 5.8em; }
  .level { grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 6.4em; }
}
@media (prefers-reduced-motion: no-preference) { .fill, .stick { transition: width .15s ease, height .15s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="topbar">
      <div class="unit">FTO2 · <span data-t="unit"></span></div>
      <div class="seg lang" role="group" aria-label="Langue / Language">
        <button type="button" id="lFr" aria-pressed="true">FR</button>
        <button type="button" id="lEn" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="titles">
      <h1 data-t="title"></h1>
      <p class="period" id="period"></p>
    </div>
    <div class="controls" id="minorCtl">
      <div class="ctl"><span class="label" id="miLab" data-t="minorLabel"></span>
        <div class="seg" role="group" aria-labelledby="miLab"><button type="button" id="miIn" data-t="minorIn"></button><button type="button" id="miOut" data-t="minorOut"></button></div></div>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" id="tab-pareto" aria-controls="p-pareto" data-tab="pareto" data-t="tabPareto"></button>
    <button type="button" role="tab" id="tab-hebdo" aria-controls="p-hebdo" data-tab="hebdo" data-t="tabWeek"></button>
    <button type="button" role="tab" id="tab-cnq" aria-controls="p-cnq" data-tab="cnq" data-t="tabCnq"></button>
    <span class="gap" aria-hidden="true"></span>
    <button type="button" role="tab" id="tab-client" aria-controls="p-client" data-tab="client" data-t="tabClient"></button>
    <span class="gap" aria-hidden="true"></span>
    <button type="button" role="tab" id="tab-rca" aria-controls="p-rca" data-tab="rca" data-t="tabRca"></button>
  </div>

  <!-- 1. Pareto (series) -->
  <div class="panel" role="tabpanel" id="p-pareto" aria-labelledby="tab-pareto">
    <div class="lead"><h2 data-t="paretoTitle"></h2><p class="sub" data-t="serieSub"></p></div>
    <div class="figs">
      <div class="fig"><b id="pf1"></b><span data-t="figDefects"></span></div>
      <div class="fig"><b id="pf2"></b><span data-t="figNcs"></span></div>
      <div class="fig"><b id="pf3"></b><span data-t="figPerNc"></span></div>
      <div class="fig"><b id="pf4" class="word"></b><span data-t="figTopRca"></span><small id="pf4s"></small></div>
    </div>
    <div class="chips" id="pc"></div>
    <div class="grid" id="pg"></div>
    <details class="detail" id="pd"><summary><span data-t="tblDefects"></span><span class="count" id="pn"></span></summary>
      <div class="inner">
        <input type="search" id="pq" autocomplete="off">
        <div class="table-wrap"><table><thead><tr id="pth"></tr></thead><tbody id="ptb"></tbody></table></div>
        <button type="button" class="more" id="pm" hidden></button>
      </div></details>
  </div>

  <!-- 2. Weekly Pareto (series) -->
  <div class="panel" role="tabpanel" id="p-hebdo" aria-labelledby="tab-hebdo" hidden>
    <div class="lead"><h2 data-t="weekTitle"></h2><p class="sub" data-t="serieSub"></p></div>
    <div class="controls">
      <div class="weekbar">
        <button type="button" id="wPrev" data-ta="prevWeek">←</button>
        <select id="wSel" data-ta="weekLabel"></select>
        <button type="button" id="wNext" data-ta="nextWeek">→</button>
      </div>
      <div class="ctl"><span class="label" id="wwLab" data-t="winLabel"></span>
        <div class="seg" role="group" aria-labelledby="wwLab" id="wWin"></div></div>
      <div class="ctl"><span class="label" id="wlLab" data-t="lineLabel"></span>
        <div class="seg" role="group" aria-labelledby="wlLab" id="wLines"></div></div>
    </div>
    <p class="sub" id="wRange"></p>
    <div class="figs">
      <div class="fig"><b id="wf1"></b><span data-t="wDefects"></span></div>

  // ---------------------------------------------------------------- weeks
  function isoMonday(wk) { var y = +wk.slice(0, 4), w = +wk.slice(6), j4 = new Date(Date.UTC(y, 0, 4)), dow = (j4.getUTCDay() + 6) % 7, mon = new Date(j4); mon.setUTCDate(j4.getUTCDate() - dow + (w - 1) * 7); return mon; }

  // ---------------------------------------------------------------- generic board: breakdown cards that filter each other + a table
  function Board(o) {
    var b = { o: o, f: {}, q: '', limit: 100, open: {} };
    var grid = document.getElementById(o.grid);

      var c = document.createElement('div'); c.className = 'card' + (d.wide ? ' wide' : '');
      c.innerHTML = '<div class="card-head"><h3 data-t="' + d.t + '"></h3><button type="button" class="clear-one" data-dim="' + d.k + '" hidden></button></div>' +

    function measure(r) { return o.measure ? o.measure(r) : 1; }
    function fmt(n) { return o.money ? eurK(n) : num(n); }
    b.renderDim = function (d) {
      var all = b.base(), rs = b.filtered(d.k), m = {}, base = {};
      all.forEach(function (r) { var v = d.get(r); if (v != null && v !== '') base[v] = 1; });
      var m2 = {};

            '<span class="name">' + lab + '</span><span class="track"><span class="fill" style="width:' + (n / max * 100) + '%">' + cab + '</span>' + tick + '</span><span class="val">' + fmt(n) + '</span>' +

  function defectHead() { return ['cNc', 'cDate', 'cLine', 'cCat', 'cRca', 'cSub', 'cCode', 'cCab', 'cText'].map(function (k) { return '<th scope="col">' + esc(S(k)) + '</th>'; }).join(''); }
  function defectRow(r) {

  }
  function defectText(r) { return r[0] + ' ' + r[18] + ' ' + dCode(r) + ' ' + (D.codes[dCode(r)] || '') + ' ' + dSub(r) + ' ' + dRca(r) + ' ' + L(dRca(r)) + ' ' + dCat(r) + ' ' + L(dCat(r)); }

  function topOf(m) { return Object.keys(m).sort(function (x, y) { return m[y] - m[x]; })[0]; }

  // ---------------------------------------------------------------- 1. Pareto (series)

  // ---------------------------------------------------------------- 2. Weekly Pareto (series): running window of 1, 5 or 10 weeks
  var defaultWeek = (function () { for (var i = WEEKS.length - 1; i >= 0; i--) { if (!isPartial(WEEKS[i])) return WEEKS[i]; } return WEEKS[WEEKS.length - 1]; })();
  var W = { week: defaultWeek, line: '', win: 5, lvl: 'cat', prob: null };
  function wBase() { return D.defects.filter(function (r) { return r[20] === 'serie' && keepMinor(r) && (!W.line || r[4] === W.line); }); }
  function wNcs() { return SERIE_NC.filter(function (n) { return !W.line || n[3] === W.line; }); }
  function winWeeks() { var i = WEEKS.indexOf(W.week); return WEEKS.slice(Math.max(0, i - W.win + 1), i + 1); }
  function toSet(a) { var s = {}; a.forEach(function (x) { s[x] = 1; }); return s; }

    dims: [

      { k: 'cable', t: 'dCable', sub: 'cableSub', split: dCable, nokey: true, get: function (r) { return dCable(r) ? 'c' : 'n'; }, show: function (v) { return v === 'c' ? S('cable') : S('notCable'); }, order: function () { return ['c', 'n']; } },
      { k: 'line', t: 'dLine', get: function (r) { return r[4]; }, show: function (v) { return v; }, order: lineOrder },

  function segHtml(items, cur, attr) { return items.map(function (p) { return '<button type="button" ' + attr + '="' + p[0] + '" aria-pressed="' + (String(cur) === String(p[0])) + '">' + esc(p[1]) + '</button>'; }).join(''); }
  function renderWeekly(b) {
    var sel = document.getElementById('wSel');

    document.getElementById('wRange').textContent = ws.length === 1 ? S('rangeOne', { w: +ws[0].slice(6), a: dA, b: dB }) : S('rangeMany', { w1: +ws[0].slice(6), w2: +ws[ws.length - 1].slice(6), a: dA, b: dB });
    // figures for the period
    var rs = b.base(), rca = {}, ncD = {};
    rs.forEach(function (r) { var a = dRca(r); rca[a] = (rca[a] || 0) + 1; ncD[r[0]] = 1; });
    var nN = wNcs().filter(function (n) { return set[n[2]]; }).length, tr = topOf(rca);
    document.getElementById('wf1').textContent = num(rs.length);
    document.getElementById('wf2').textContent = num(nN);
    var perW = {}; rs.forEach(function (r) { perW[r[3]] = (perW[r[3]] || 0) + 1; });
    var open = ws.filter(function (w) { return (WEEK_ALL[w] || 0) >= 10; }), nOpen = open.reduce(function (s, w) { return s + (perW[w] || 0); }, 0);
    if (ws.length > 1) { document.getElementById('wf3').textContent = open.length ? num(Math.round(nOpen / open.length)) : '—'; document.getElementById('wf3l').textContent = S('wPerWeek'); }
    else { var nd = Object.keys(ncD).length; document.getElementById('wf3').textContent = nd ? (Math.round(rs.length / nd * 10) / 10).toLocaleString(loc()) : '—'; document.getElementById('wf3l').textContent = S('wPerNc'); }
    document.getElementById('wf4').textContent = tr ? L(tr) : '—';
    document.getElementById('wf4s').textContent = tr ? S('topSub', { n: num(rca[tr]), p: pct(rca[tr] / rs.length * 100) }) : '';
    // week-by-week table: problems side by side
    var cell = {}, tot = {}, maxCell = 1;
    rs.forEach(function (r) { var k = lvlGet(r), c = cell[k] || (cell[k] = {}); c[r[3]] = (c[r[3]] || 0) + 1; tot[k] = (tot[k] || 0) + 1; });
    Object.keys(cell).forEach(function (k) { ws.forEach(function (w) { maxCell = Math.max(maxCell, cell[k][w] || 0); }); });
    var keys = Object.keys(tot).sort(function (x, y) { return tot[y] - tot[x]; });
    if (W.lvl === 'cat') keys = keys.filter(function (k) { return !ASIDE[k]; }).concat(keys.filter(function (k) { return ASIDE[k]; }));
    else keys = keys.slice(0, 15);
    var head = '<thead><tr><th scope="col">' + esc(S('problem')) + '</th>' + ws.map(function (w, j) { return '<th scope="col"' + (j === ws.length - 1 ? ' class="cur"' : '') + '>' + weekShort(w) + '</th>'; }).join('') + (ws.length > 1 ? '<th scope="col">' + esc(S('total')) + '</th>' : '') + '</tr></thead>';
    var body = keys.map(function (k) {
      var on = W.prob && W.prob.lvl === W.lvl && W.prob.v === k;
      return '<tr tabindex="0" data-prob="' + esc(k) + '" aria-pressed="' + !!on + '"' + (W.lvl === 'cat' && ASIDE[k] ? ' class="aside"' : '') + '><td>' + esc(lvlName(W.lvl, k)) + '</td>' + ws.map(function (w) {
        var n = (cell[k] || {})[w] || 0;
        return '<td class="cell">' + (n ? '<span class="heat" style="background:color-mix(in srgb, var(--s1) ' + Math.round(8 + 52 * n / maxCell) + '%, transparent)">' + num(n) + '</span>' : '<span class="z">·</span>') + '</td>';
      }).join('') + (ws.length > 1 ? '<td class="tot">' + num(tot[k]) + '</td>' : '') + '</tr>';
    }).join('');
    document.getElementById('wMatrix').innerHTML = head + '<tbody>' + (body || '<tr><td class="empty">—</td></tr>') + '</tbody>';
    // trend for the chosen problem (or every defect) over all weeks
    var per = {}, p = W.prob;
    wBase().forEach(function (r) { if (!p || lvlOf(p.lvl, r) === p.v) per[r[3]] = (per[r[3]] || 0) + 1; });
    var max = Math.max.apply(null, WEEKS.map(function (w) { return per[w] || 0; }).concat([1]));
    document.getElementById('wTrendTitle').textContent = p ? S('wTrendProb', { p: lvlName(p.lvl, p.v) }) : S('wTrendAll');
    var pc = document.getElementById('wProbClear'); pc.hidden = !p; pc.textContent = S('probClear');
    var tc = document.getElementById('wTrendCols');
    tc.innerHTML = WEEKS.map(function (w) { var n = per[w] || 0;
      return '<button type="button" class="col' + (set[w] ? '' : ' out') + (isPartial(w) ? ' partial' : '') + '" data-week="' + w + '" aria-pressed="' + (w === W.week) + '" aria-label="' + esc(weekLong(w)) + ': ' + n + '"><span class="v">' + (n ? num(n) : '') + '</span><span class="stick" style="height:' + (n / max * 100) + '%"></span><span class="m">' + weekShort(w) + '</span></button>'; }).join('');
    var cur = tc.querySelector('[aria-pressed="true"]'); if (cur && G.tab === 'hebdo') { var wrap = tc.parentNode, x = cur.offsetLeft - wrap.clientWidth * 0.7; if (x > 0) wrap.scrollLeft = x; }
  }
  function setWeek(w) { if (WEEKS.indexOf(w) < 0) return; W.week = w; weekly.f = {}; weekly.render(); }
  document.getElementById('wSel').addEventListener('change', function (e) { setWeek(e.target.value); });
  document.getElementById('wPrev').addEventListener('click', function () { setWeek(WEEKS[WEEKS.indexOf(W.week) - 1]); });
  document.getElementById('wNext').addEventListener('click', function () { setWeek(WEEKS[WEEKS.indexOf(W.week) + 1]); });
  document.getElementById('wTrendCols').addEventListener('click', function (e) { var c = e.target.closest('[data-week]'); if (c) setWeek(c.getAttribute('data-week')); });
  document.getElementById('wLines').addEventListener('click', function (e) { var c = e.target.closest('[data-line]'); if (c) { W.line = c.getAttribute('data-line'); weekly.f = {}; weekly.render(); } });
  document.getElementById('wWin').addEventListener('click', function (e) { var c = e.target.closest('[data-win]'); if (c) { W.win = +c.getAttribute('data-win'); weekly.f = {}; weekly.render(); } });
  document.getElementById('wLvl').addEventListener('click', function (e) { var c = e.target.closest('[data-lvl]'); if (c) { W.lvl = c.getAttribute('data-lvl'); weekly.render(); } });
  function pickProb(tr) { var v = tr.getAttribute('data-prob'); W.prob = W.prob && W.prob.lvl === W.lvl && W.prob.v === v ? null : { lvl: W.lvl, v: v }; weekly.render(); }
  document.getElementById('wMatrix').addEventListener('click', function (e) { var tr = e.target.closest('[data-prob]'); if (tr) pickProb(tr); });
  document.getElementById('wMatrix').addEventListener('keydown', function (e) { var tr = e.target.closest('[data-prob]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickProb(tr); } });
  document.getElementById('wProbClear').addEventListener('click', function () { W.prob = null; weekly.render(); });

  // ---------------------------------------------------------------- 3. Cost of non-quality (series)
  // cost units: each defect line of a series NC (its share of the NC cost), plus each series NC with no defect line
  var UNITS = (function () {
    var out = [], has = {};
    D.defects.forEach(function (r) { var n = NC[r[0]]; if (n && n[23] === 'serie') { has[r[0]] = 1; out.push({ d: r, n: n }); } });
    SERIE_NC.forEach(function (n) { if (!has[n[0]]) out.push({ d: null, n: n }); });
    return out;
  })();
  function uCost(u) { return u.d ? dAlloc(u.d) : u.n[12]; }
  function uCat(u) { return u.d ? dCat(u.d) : '__none'; }
  function sum(arr, f) { return arr.reduce(function (s, x) { return s + f(x); }, 0); }
  var cnq = Board({
    grid: 'cg', chips: 'cc', search: 'cq', count: 'cn', thead: 'cth', tbody: 'ctb', more: 'cm', money: true,
    rows: function () { return UNITS; }, measure: uCost,
    dims: [
      { k: 'cat', t: 'cByCat', sub: 'cByCatSub', wide: true, pareto: true, get: uCat, show: function (v) { return v === '__none' ? S('noLine') : L(v); } },
      { k: 'cable', t: 'dCable', get: function (u) { return u.d && dCable(u.d) ? 'c' : 'n'; }, show: function (v) { return v === 'c' ? S('cable') : S('notCable'); }, order: function () { return ['c', 'n']; } },
      { k: 'where', t: 'dWhere', get: function (u) { return u.n[8]; }, show: whereName },
      { k: 'rule', t: 'dRule', get: function (u) { return u.n[7]; }, show: ruleName },
      { k: 'line', t: 'dLine', get: function (u) { return u.n[3]; }, show: function (v) { return v; }, order: lineOrder },
      { k: 'month', t: 'dMonth', cols: true, get: function (u) { return u.n[1].slice(0, 7); }, show: monthName, order: function (v) { return v.sort(); } }
    ],
    text: function (u) { return u.n[0] + ' ' + u.n[22] + ' ' + (u.d ? defectText(u.d) : ''); },
    tableRows: function (units) { var seen = {}, out = []; units.forEach(function (u) { if (!seen[u.n[0]]) { seen[u.n[0]] = 1; out.push(u.n); } }); out.sort(function (a, b2) { return b2[12] - a[12]; }); return out; },
    head: function () { return [['kNc'], ['kDate'], ['kLine'], ['kWhere'], ['kRule'], ['kLines', 'r'], ['kCable'], ['kC3', 'r'], ['kTitle']].map(function (p) { return '<th scope="col"' + (p[1] ? ' class="r"' : '') + '>' + esc(S(p[0])) + '</th>'; }).join(''); },
    row: function (n) {
      return '<tr><td class="nc">' + esc(n[0]) + '</td><td class="num">' + esc(shortDay(n[1])) + '</td><td>' + esc(n[3]) + '</td><td>' + esc(whereName(n[8])) + '</td><td>' + esc(ruleName(n[7])) + '</td><td class="num r">' + num(n[21]) + '</td><td>' + (n[20] ? '<span class="tag">' + esc(S('yes')) + '</span>' : '') + '</td><td class="num r">' + eur(n[12]) + '</td><td class="txt">' + esc(n[22]) + '</td></tr>';
    },
    after: function () {
      var t3 = sum(SERIE_NC, function (n) { return n[12]; }), t1 = sum(SERIE_NC, function (n) { return n[9]; }), t2 = sum(SERIE_NC, function (n) { return n[10]; });
      var tc = sum(CLIENT_NC, function (n) { return n[12]; });
      var cabAlloc = 0; UNITS.forEach(function (u) { if (u.d && dCable(u.d)) cabAlloc += dAlloc(u.d); });
      document.getElementById('cStrip').innerHTML = '<span>' + esc(S('stripTotal')) + ' <b>' + eur(t3 + tc) + '</b></span><span>' + esc(S('stripSerie')) + ' <b>' + eur(t3) + '</b> · ' + num(SERIE_NC.length) + ' NC</span><span>' + esc(S('stripClient')) + ' <b>' + eur(tc) + '</b> · ' + num(CLIENT_NC.length) + ' NC</span>';
      document.getElementById('cf1').textContent = eur(t3);
      document.getElementById('cf2').textContent = num(SERIE_NC.length);
      document.getElementById('cf3').textContent = eur(t3 / SERIE_NC.length);
      document.getElementById('cf4').textContent = eur(cabAlloc);
      document.getElementById('cf4s').textContent = S('cCableSub', { p: pct(cabAlloc / t3 * 100) });
      var lv = [[S('lvl1'), t1, false], [S('lvl2'), t2, false], [S('lvl3'), t3, true]], mx = Math.max(t1, t2, t3);
      document.getElementById('cLevels').innerHTML = lv.map(function (l) { return '<div class="level' + (l[2] ? ' main' : '') + '"><span class="name">' + esc(l[0]) + '</span><span class="track"><span class="fill" style="width:' + (l[1] / mx * 100) + '%"></span></span><span class="val">' + eur(l[1]) + '</span></div>'; }).join('');
    }
  });

  // ---------------------------------------------------------------- 4. Customer returns
  function cx(r) { return D.client[r[0] + '|' + r[1]] || ['', '', '', '', '', '']; }
  var client = Board({
    grid: 'rg', chips: 'rc', search: 'rq', count: 'rn', thead: 'rth2', tbody: 'rtb2', more: 'rm', expand: true,
    rows: function () { return D.defects.filter(function (r) { return r[20] === 'client' && keepMinor(r); }); },
    dims: [
      { k: 'cat', t: 'dCat', wide: true, pareto: true, get: dCat, show: L },
      { k: 'rca', t: 'dRca', get: dRca, show: L },
      { k: 'nat', t: 'dNat', sub: 'natOnly', get: function (r) { return cx(r)[0] || null; }, show: function (v) { return S('nat_' + v); }, order: function (v) { return ['phys', 'hs', 'recu', 'nc'].filter(function (c) { return v.indexOf(c) >= 0; }); } },
      { k: 'line', t: 'dLine', get: function (r) { return r[4]; }, show: function (v) { return v; }, order: lineOrder },
      { k: 'month', t: 'dMonth', cols: true, get: function (r) { return r[2].slice(0, 7); }, show: monthName, order: function (v) { return v.sort(); } }
    ],
    text: function (r) { return defectText(r) + ' ' + (D.lt[r[0]] || '') + ' ' + cx(r).join(' '); },
    sort: byDate,
    head: function () { return ['cNc', 'cDate', 'cLine', 'cCat', 'cRca', 'cText'].map(function (k) { return '<th scope="col">' + esc(S(k)) + '</th>'; }).join(''); },
    row: function (r, b) {
      var key = r[0] + '-' + r[1], open = !!b.open[key], x = cx(r), n = NC[r[0]] || [];
      var main = '<tr class="open-row" tabindex="0" data-key="' + key + '" aria-expanded="' + open + '"><td class="nc">' + esc(r[0]) + (r[1] > 1 ? ' · ' + r[1] : '') + '</td><td class="num">' + esc(shortDay(r[2])) + '</td><td>' + esc(r[4]) + '</td><td>' + esc(L(dCat(r))) + '</td><td>' + esc(L(dRca(r))) + (x[0] ? '<br><span class="sub">' + esc(S('nat_' + x[0])) + '</span>' : '') + '</td><td class="txt">' + esc(tidy(r[18]) || n[22] || '') + '</td></tr>';
      if (!open) return main;
      var info = [['iTitle', n[22]], ['iPlant', x[4]], ['iLiab', x[5]], ['iDet', x[1]], ['iSym', x[2]]].map(function (p) { return '<dt>' + esc(S(p[0])) + '</dt><dd>' + esc(p[1] || S('iNone')) + '</dd>'; }).join('');
      return main + '<tr class="more-row"><td colspan="6"><div class="more-grid"><div><h4>' + esc(S('cSub')) + '</h4><p>' + esc(dSub(r)) + '</p><h4 style="margin-top:12px">' + esc(S('hInfo')) + '</h4><dl class="kv">' + info + '</dl></div><div><h4>' + esc(S('hLong')) + '</h4><pre class="long">' + esc(D.lt[r[0]] || '') + '</pre></div></div></td></tr>';
    },
    after: function (b) {
      var rs = b.base(), dmg = 0, phys = 0;
      rs.forEach(function (r) { if (dCat(r) === 'Élément Endommagé') dmg++; if (cx(r)[0] === 'phys') phys++; });
      document.getElementById('rf1').textContent = num(CLIENT_NC.length);
      document.getElementById('rf2').textContent = rs.length ? pct0(dmg / rs.length * 100) : '—';
      document.getElementById('rf3').textContent = rs.length ? pct0(phys / rs.length * 100) : '—';
      document.getElementById('rf4').textContent = eur(sum(CLIENT_NC, function (n) { return n[12]; }));
    }
  });

  // ---------------------------------------------------------------- 5. Root causes
  function rcaStats(scope) {
    var tot = 0, m = {};
    D.defects.forEach(function (r) { if (r[20] !== scope || !keepMinor(r)) return; tot++; var k = dRca(r), s = m[k] || (m[k] = { d: 0, nc: {}, c: 0 }); s.d++; s.nc[r[0]] = 1; s.c += dAlloc(r); });
    return { tot: tot, m: m };
  }
  function rcaId(name) { return 'rca-' + name.normalize('NFD').replace(/[^A-Za-z0-9]+/g, '-').toLowerCase(); }
  function renderRca() {
    var st = rcaStats('serie'), sc = rcaStats('client'), cnt = function (s, k) { return s.m[k] || { d: 0, nc: {}, c: 0 }; };
    var nSub = 0, nCode = 0, cats = {}; D.rca.forEach(function (r) { cats[r.cat] = 1; nSub += r.subs.length; r.subs.forEach(function (s) { nCode += s.codes.length; }); });
    document.getElementById('rcaChain').innerHTML = [[nCode, 'stepCode'], [nSub, 'stepSub'], [D.rca.length, 'stepRca', 1], [Object.keys(cats).length, 'stepCat']].map(function (p, i) {
      return (i ? '<span class="arrow" aria-hidden="true">→</span>' : '') + '<div class="step' + (p[2] ? ' base' : '') + '"><b>' + num(p[0]) + '</b><span>' + esc(S(p[1])) + '</span></div>'; }).join('');
    document.getElementById('rth').innerHTML = [['rRca'], ['rCat'], ['rDef', 'r'], ['rShare', 'r'], ['rNc', 'r'], ['rCostS', 'r'], ['rCli', 'r']].map(function (p) { return '<th scope="col"' + (p[1] ? ' class="r"' : '') + '>' + esc(S(p[0])) + '</th>'; }).join('');
    var list = D.rca.slice().sort(function (a, b) { return cnt(st, b.rca).d - cnt(st, a.rca).d || cnt(sc, b.rca).d - cnt(sc, a.rca).d; });
    document.getElementById('rtb').innerHTML = list.map(function (r) { var c = cnt(st, r.rca);
      return '<tr tabindex="0" data-go="' + rcaId(r.rca) + '"><td>' + esc(L(r.rca)) + '</td><td>' + esc(L(r.cat)) + '</td><td class="num r">' + num(c.d) + '</td><td class="num r">' + (st.tot ? pct(c.d / st.tot * 100) : '—') + '</td><td class="num r">' + num(Object.keys(c.nc).length) + '</td><td class="num r">' + eur(c.c) + '</td><td class="num r">' + num(cnt(sc, r.rca).d) + '</td></tr>'; }).join('');
    var html = '';
    catOrder(Object.keys(cats)).forEach(function (cat) {
      html += '<section class="rcagroup"><h2>' + esc(L(cat)) + '</h2>';
      D.rca.filter(function (r) { return r.cat === cat; }).forEach(function (r) {
        var c = cnt(st, r.rca), k = cnt(sc, r.rca), other = G.lang === 'fr' ? (EN[r.rca] || '') : r.rca;
        html += '<article class="card rcacard" id="' + rcaId(r.rca) + '"><h3>' + esc(L(r.rca)) + (other && other !== L(r.rca) ? ' <span class="en">· ' + esc(other) + '</span>' : '') + '</h3>' +
          '<p>' + esc(G.lang === 'fr' ? r.fr : r.en) + '</p>' +
          '<div class="stats"><span><b>' + num(c.d) + '</b> ' + esc(S('rDef').toLowerCase()) + '</span><span><b>' + (st.tot ? pct(c.d / st.tot * 100) : '—') + '</b></span><span><b>' + num(Object.keys(c.nc).length) + '</b> NC</span><span><b>' + eur(c.c) + '</b></span><span><b>' + num(k.d) + '</b> ' + esc(S('rCli').toLowerCase()) + '</span></div>' +
          '<div class="subs"><h4>' + esc(S('subsTitle')) + '</h4>' + r.subs.map(function (s) {
            return '<details><summary>' + esc(s.name) + (s.minor ? ' <span class="tag">' + esc(S('minorTag')) + '</span>' : '') + (s.codes.length ? ' · <code>' + s.codes.map(function (x) { return esc(x[0]); }).join(' ') + '</code>' : '') + '</summary>' +
              (s.codes.length ? '<ul>' + s.codes.map(function (x) { return '<li><code>' + esc(x[0]) + '</code> ' + esc(x[1]) + '</li>'; }).join('') + '</ul>' : '') + '</details>'; }).join('') + '</div>' +
          '<div class="ex"><h4>' + esc(S('exTitle')) + '</h4>' + (r.ex.length ? r.ex.map(function (e) { return '<div><q>' + esc(tidy(e[1])) + '</q> <span class="nc">NC ' + esc(e[0]) + '</span></div>'; }).join('') : '<p class="empty">' + esc(S('noEx')) + '</p>') + '</div></article>';
      });
      html += '</section>';
    });
    document.getElementById('rcaCards').innerHTML = html;
  }
  function goRca(tr) { var el = document.getElementById(tr.getAttribute('data-go')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  document.getElementById('rtb').addEventListener('click', function (e) { var tr = e.target.closest('[data-go]'); if (tr) goRca(tr); });
  document.getElementById('rtb').addEventListener('keydown', function (e) { var tr = e.target.closest('[data-go]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); goRca(tr); } });

  // ---------------------------------------------------------------- language, tabs, minor switch
  function applyText() {
    document.documentElement.lang = G.lang;
    document.title = S('title');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = S(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-ta]').forEach(function (el) { el.setAttribute('aria-label', S(el.getAttribute('data-ta'))); });
    var dates = { from: day(D.meta.from), to: day(D.meta.to) }, A = D.meta.aside;
    document.getElementById('period').textContent = S('period', dates);
    document.getElementById('foot1').textContent = S('foot1', dates);
    document.getElementById('foot3').textContent = S('foot3', { n: num(D.meta.noLine), d: num(A.deleted[0]), de: eur(A.deleted[1]), o: num(A.other[0]), oe: eur(A.other[1]) });
    ['pq', 'wq', 'cq', 'rq'].forEach(function (id) { var q = document.getElementById(id); q.placeholder = S('search'); q.setAttribute('aria-label', S('search')); });
    document.getElementById('lFr').setAttribute('aria-pressed', String(G.lang === 'fr'));
    document.getElementById('lEn').setAttribute('aria-pressed', String(G.lang === 'en'));
    document.getElementById('miIn').setAttribute('aria-pressed', String(G.minor));
    document.getElementById('miOut').setAttribute('aria-pressed', String(!G.minor));
    document.getElementById('minorCtl').hidden = G.tab === 'cnq';
  }
  function showTab() {
    TABS.forEach(function (t) {
      var b = document.getElementById('tab-' + t);
      b.setAttribute('aria-selected', String(G.tab === t)); b.tabIndex = G.tab === t ? 0 : -1;
      document.getElementById('p-' + t).hidden = G.tab !== t;
    });
  }
  function renderAll() { applyText(); showTab(); pareto.render(); weekly.render(); cnq.render(); client.render(); renderRca(); }
  function setTab(t) { G.tab = t; try { history.replaceState(null, '', '#' + t); } catch (x) {} applyText(); showTab(); if (t === 'hebdo') weekly.render(); }
  document.getElementById('tabs').addEventListener('click', function (e) { var t = e.target.closest('[data-tab]'); if (t) setTab(t.getAttribute('data-tab')); });
  document.getElementById('tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var i = TABS.indexOf(G.tab) + (e.key === 'ArrowRight' ? 1 : -1);
    setTab(TABS[(i + TABS.length) % TABS.length]); document.getElementById('tab-' + G.tab).focus();
  });
  function setLang(l) { G.lang = l; try { localStorage.setItem('fto2-dash-lang', l); } catch (e) {} renderAll(); }
  document.getElementById('lFr').addEventListener('click', function () { setLang('fr'); });
  document.getElementById('lEn').addEventListener('click', function () { setLang('en'); });
  function setMinor(v) { G.minor = v; pareto.f = {}; weekly.f = {}; client.f = {}; renderAll(); }
  document.getElementById('miIn').addEventListener('click', function () { setMinor(true); });
  document.getElementById('miOut').addEventListener('click', function () { setMinor(false); });
  renderAll();
})();
</script>
