<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coût de non-qualité - Airbus Electric Center</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --navy: #0c2340; --on-navy: #ffffff; --on-navy-muted: #b9c6d6;
  --bg: #ffffff; --tint: #f4f6f9; --ink: #132238; --muted: #5d6d7e; --line: #e1e6ec; --track: #e9edf2;
  --l1: #8a98a8; --l2: #1b8a94; --l3: #1d5fb0; --cr: #c2571a;
  --s1: #1d5fb0; --s2: #123f7a; --s3: #c9a227; --s4: #7a5fb0; --s5: #c2571a;
  --flag-bg: #fff4cc; --flag-ink: #6b4e00; --flag-line: #e6c24d; --changed: #fde9d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #0a1a30; --on-navy: #f2f5f9; --on-navy-muted: #a3b2c4;
    --bg: #101820; --tint: #18222d; --ink: #e8edf3; --muted: #9aa9b8; --line: #2c3946; --track: #24303c;
    --l1: #95a3b3; --l2: #3db4be; --l3: #6ea6ea; --cr: #e58a4e;
    --s1: #6ea6ea; --s2: #2f6fc0; --s3: #d9b94a; --s4: #a08ad6; --s5: #e58a4e;
    --flag-bg: #3d3210; --flag-ink: #f3d77a; --flag-line: #7a651d; --changed: #4a3320;
  }
}
:root[data-theme="dark"] {
  --navy: #0a1a30; --on-navy: #f2f5f9; --on-navy-muted: #a3b2c4;
  --bg: #101820; --tint: #18222d; --ink: #e8edf3; --muted: #9aa9b8; --line: #2c3946; --track: #24303c;
  --l1: #95a3b3; --l2: #3db4be; --l3: #6ea6ea; --cr: #e58a4e;
  --s1: #6ea6ea; --s2: #2f6fc0; --s3: #d9b94a; --s4: #a08ad6; --s5: #e58a4e;
  --flag-bg: #3d3210; --flag-ink: #f3d77a; --flag-line: #7a651d; --changed: #4a3320;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  font-size: 16px; line-height: 1.55; font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

/* header and jump bar */
.top { background: var(--navy); color: var(--on-navy); }
.top .wrap { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-top: 26px; padding-bottom: 24px; flex-wrap: wrap; }
.org { font-size: 14px; color: var(--on-navy-muted); margin-bottom: 2px; }
h1 { font-size: 30px; line-height: 1.2; font-weight: 600; margin: 0; }
.top .sub { color: var(--on-navy-muted); margin-top: 4px; font-size: 15px; }
.lang { display: inline-flex; border: 1px solid rgba(255, 255, 255, .35); border-radius: 6px; overflow: hidden; }
.lang button { background: transparent; color: var(--on-navy-muted); border: 0; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--on-navy); color: var(--navy); }
.tabsbar { background: var(--bg); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs { display: flex; gap: 6px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 14px 11px; font: inherit; font-size: 15px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--l3); }
.tabs button:hover { color: var(--ink); }

/* page rhythm */
main { padding-bottom: 72px; }
main > section { padding: 56px 0 8px; scroll-margin-top: 52px; }
main > section + section { border-top: 1px solid var(--line); margin-top: 48px; }
h2 { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 600; margin: 44px 0 14px; }
p { margin: 0 0 10px; max-width: 70ch; }
.lead { color: var(--muted); font-size: 18px; max-width: 62ch; margin-bottom: 0; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.num { text-align: right; white-space: nowrap; }
.soft { background: var(--tint); border-radius: 12px; padding: 24px 26px; margin-top: 18px; }
.soft > h3:first-child { margin-top: 0; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 56px; }
@media (max-width: 860px) { .cols2 { grid-template-columns: minmax(0, 1fr); } }
.scroll { overflow-x: auto; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px 64px; align-items: start; }
@media (max-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-k { font-size: 16px; color: var(--muted); font-weight: 600; }
.hero-v { font-size: 64px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; margin: 6px 0 10px; white-space: nowrap; }
.hero-s { font-size: 18px; }
.hero-n { margin-top: 18px; font-size: 14px; color: var(--flag-ink); background: var(--flag-bg); border-left: 3px solid var(--flag-line); padding: 8px 12px; border-radius: 0 6px 6px 0; max-width: 46ch; }
@media (max-width: 480px) { .hero-v { font-size: 46px; } }
.level { padding: 14px 0; border-top: 1px solid var(--line); }
.level:first-of-type { border-top: 0; padding-top: 0; }
.level .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.level .name { font-weight: 600; } .level .name i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 9px; }
.level .total { font-size: 22px; font-weight: 600; white-space: nowrap; }
.level .how { color: var(--muted); font-size: 14px; margin: 1px 0 9px 19px; }
.track { background: var(--track); border-radius: 4px; height: 10px; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; }
.c1 { background: var(--l1); } .c2 { background: var(--l2); } .c3 { background: var(--l3); } .ccr { background: var(--cr); }

/* composition */
.stack { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: var(--track); }
.stack div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 36px; margin-top: 16px; }
.legend .it { display: grid; grid-template-columns: 12px auto; gap: 0 9px; align-items: baseline; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: block; align-self: center; }
.legend .v { grid-column: 2; font-weight: 600; font-size: 18px; } .legend .v span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
.legend .l { font-size: 14px; color: var(--muted); }

/* the calculation chain: a real sequence, so it is numbered */
.chain { list-style: none; margin: 26px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; counter-reset: st; }
.chain li { counter-increment: st; border-top: 3px solid var(--l3); padding-top: 12px; }
.chain li.var { border-top-color: var(--s2); }
.chain li::before { content: counter(st); font-size: 13px; font-weight: 600; color: var(--muted); }
.chain .cn { font-weight: 600; font-size: 15px; line-height: 1.3; min-height: 2.6em; }
.chain .cv { font-size: 26px; font-weight: 600; white-space: nowrap; }
.chain .cs { font-size: 13px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
@media (max-width: 900px) { .chain { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 480px) { .chain { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.formula { font-size: 18px; font-weight: 600; margin: 30px 0 6px; max-width: 64ch; }

/* disclosure */
details { border-top: 1px solid var(--line); margin-top: 26px; }
details + details { margin-top: 0; }
details:last-of-type { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; padding: 14px 0; color: var(--l3); list-style-position: inside; }
details[open] > summary { color: var(--ink); }
details > .in { padding: 4px 0 22px; }
.soft details, .soft details:last-of-type { border-color: var(--line); }

/* tables and bars */
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
tr.total td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }
tr.off td { color: var(--muted); }
td.txt { min-width: 240px; } td.c, th.c { text-align: center; }
.yes { font-weight: 700; color: var(--l3); } .no { color: var(--muted); }
.bars { display: grid; grid-template-columns: minmax(110px, 200px) minmax(60px, 1fr) 88px; gap: 14px 14px; align-items: center; }
.bars .v { text-align: right; white-space: nowrap; font-weight: 600; }
.bars .sub { color: var(--muted); font-size: 13px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg.chart text.val { fill: var(--ink); font-weight: 600; font-size: 13px; }
svg.chart line { stroke: var(--line); stroke-width: 1; }
svg.chart rect.b3 { fill: var(--l3); } svg.chart rect.bcr { fill: var(--cr); }

/* figures in a row */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 0; margin-top: 30px; }
.stats > div { padding: 0 22px; border-left: 1px solid var(--line); }
.stats > div:first-child { padding-left: 0; border-left: 0; }
.stats .v { font-size: 30px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
.stats .k { font-size: 14px; color: var(--muted); }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats > div:nth-child(odd) { padding-left: 0; border-left: 0; } }

/* forms */
input, select, button { font: inherit; color: inherit; }
input[type="number"], input[type="text"] { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
input.p { width: 92px; text-align: right; }
input.changed { background: var(--changed); }
button.btn { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.btn:hover { border-color: var(--muted); }
button.primary { background: var(--l3); border-color: var(--l3); color: #fff; }
button.link { background: none; border: 0; padding: 0; color: var(--l3); cursor: pointer; text-decoration: underline; font-weight: 600; }
:focus-visible { outline: 2px solid var(--l3); outline-offset: 2px; }
.top :focus-visible { outline-color: #fff; }
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 26px; margin: 22px 0 10px; font-size: 15px; }
.tag { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.flag { background: var(--flag-bg); color: var(--flag-ink); border-color: var(--flag-line); }
.others { margin-top: 18px; display: grid; gap: 6px; }
.others div { padding-left: 12px; border-left: 3px solid var(--l2); } .others div.k1 { border-left-color: var(--l1); }
.params { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 0 48px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto 62px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.prow .u { color: var(--muted); font-size: 14px; }
ul.plain { margin: 0; padding-left: 20px; } ul.plain li { margin-bottom: 12px; max-width: 70ch; }
.rowhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .fill, .stack div { transition: width .25s ease; } }
@media print {
  .tabsbar, .lang, .picker button, #reset, #clearamt { display: none !important; }
  main > section { break-before: page; } main > section:first-of-type { break-before: auto; }
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div>
      <div class="org">Airbus Electric Center</div>

      <div class="sub" id="sub"></div>

      <button type="button" data-lang="en" aria-pressed="false">EN</button>

  </div>
</header>
<div class="tabsbar"><div class="wrap"><nav class="tabs" id="tabs" aria-label="Sections"></nav></div></div>

<main class="wrap">
  <section id="tab-summary">
    <div class="hero">
      <div id="hero"></div>
      <div><h3 style="margin-top:0" data-t="lv_title"></h3><div id="levels"></div></div>

    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section id="tab-method">
    <h2 data-t="m_title"></h2>
    <p class="lead" data-t="m_lead"></p>
    <ol class="chain" id="chain"></ol>
    <p class="formula" id="chformula"></p>
    <p class="muted" id="chexample"></p>
    <details><summary data-t="d_rules"></summary><div class="in"><p class="small muted" data-t="mx_note"></p><div class="scroll" id="matrix"></div></div></details>
    <div class="soft" style="margin-top:36px">
      <h3 data-t="nc_title"></h3>
      <div class="picker">
        <label for="ncpick" data-t="nc_number"></label>
        <input type="text" id="ncpick" list="nclist" inputmode="numeric" autocomplete="off" style="width:140px">
        <datalist id="nclist"></datalist>

        <span id="examples" class="picker"></span>

      <div id="ncout"></div>

  </section>

  <section id="tab-breakdown">

      <div><h3 data-t="cls_title"></h3><div class="bars" id="classes"></div></div>
    </div>
    <details><summary data-t="d_more"></summary><div class="in"><div class="scroll" id="decision"></div><p class="small muted" style="margin-top:22px" data-t="liab_note"></p><div class="scroll" id="liab"></div></div></details>
  </section>

  <section id="tab-returns">
    <h2 data-t="cr_title"></h2>
    <p class="lead" data-t="cr_lead"></p>
    <div class="stats" id="crkpis"></div>
    <div class="soft" style="margin-top:32px"><div class="prow" id="crparam" style="border-bottom:0;padding:0;grid-template-columns:minmax(0,1fr) auto auto"></div></div>
    <details><summary id="crsum"></summary><div class="in">
      <div class="rowhead"><p class="small muted" data-t="cr_store" style="margin:0"></p><button type="button" class="btn" id="clearamt" data-t="cr_clear"></button></div>
      <div class="scroll" id="crtable" style="margin-top:12px"></div>
    </div></details>
  </section>

  <section id="tab-params">
    <h2 data-t="as_title"></h2>
    <p class="lead" data-t="as_lead"></p>

    <div class="params" id="params" style="margin-top:10px"></div>
    <details><summary id="clssum"></summary><div class="in"><p class="small muted" data-t="pm_classes_note"></p><div class="scroll" id="classtable"></div></div></details>
    <details><summary data-t="pm_airbus"></summary><div class="in"><p class="small muted" data-t="pm_airbus_note"></p><div class="params" id="airbus"></div></div></details>
    <h3 data-t="gp_title"></h3>
    <ul class="plain" id="gaps"></ul>
  </section>

  <footer id="foot"></footer>
</main>

    setup: x.order ? t("n_order_setup", { o: x.order[2] }) : (x.steps.setup > P.setup * wf ? t("n_floor", { a: P.setup, f: P.floor }) : t("n_once", { x: P.setup })) + wnote,

  };
  var tb = '<div class="scroll"><table><thead><tr><th>' + t("h_step") + "</th><th>" + t("h_how") + '</th><th class="num">' + t("h_min") + '</th><th class="num">' + t("h_cost_at") + "</th></tr></thead><tbody>";
  STEPS.forEach(function (s) {
    var noAlert = s[0] === "alert" && f.alert === 1 && !r[NC.alertOn];
    var on = f[s[1]] === 1 && !noAlert, m = x.steps[s[0]];
    tb += '<tr class="' + (on ? "" : "off") + '"><td>' + t("cs_" + s[0]) + "</td><td>" + (on ? notes[s[0]] : noAlert ? t("n_noalert") : t("n_off")) + '</td><td class="num">' + (on ? mn(m) : "-") + '</td><td class="num">' + (on ? eur2(m / 60 * stepRate(P, s[0])) : "-") + "</td></tr>";
  });
  if (x.engH) tb += "<tr><td>" + t("r_eng") + "</td><td>" + t("r_eng_how", { h: dec(x.engH), r: dec(P.rateEng) }) + '</td><td class="num">-</td><td class="num">' + eur2(x.eng) + "</td></tr>";
  if (f.work) tb += "<tr><td>" + t("r_mat") + "</td><td>" + t("r_mat_how") + '</td><td class="num">-</td><td class="num">' + eur2(x.material) + "</td></tr>";
  if (f.part) tb += "<tr><td>" + t("r_part") + "</td><td>" + tag(t("r_part_tag"), true) + " " + t("r_part_how") + '</td><td class="num">-</td><td class="num">' + eur2(0) + "</td></tr>";
  if (x.isReturn && (x.real != null || P.crExtra)) {
    tb += "<tr><td>" + t("r_model") + '</td><td></td><td class="num">' + mn(x.minutes3) + '</td><td class="num">' + eur2(x.model) + "</td></tr>";
    tb += x.real != null ? "<tr><td>" + t("r_real") + "</td><td>" + t("r_real_how") + '</td><td class="num">-</td><td class="num">' + eur2(x.real) + "</td></tr>"
                         : "<tr><td>" + t("r_extra") + "</td><td>" + t("r_extra_how") + '</td><td class="num">-</td><td class="num">' + eur2(P.crExtra) + "</td></tr>";
  }
  tb += '<tr class="total"><td>' + t("r_total3") + '</td><td></td><td class="num">' + (x.real != null ? "-" : mn(x.minutes3)) + '</td><td class="num">' + eur2(x.l3) + "</td></tr></tbody></table></div>";
  var others = '<div class="others"><div>' + t("x2_line", { m: mn(x.minutes2), c: "<b>" + eur2(x.l2) + "</b>" }) + '</div><div class="k1">' + t("x1_line", { c: "<b>" + eur2(x.l1) + "</b>", l: esc(label) }) + "</div></div>";
  var d = "";
  if (x.lines > 0) {
    d = '<details id="nclines"' + (linesOpen ? " open" : "") + "><summary>" + t("d_lines", { n: int(x.lines) }) + '</summary><div class="in"><div class="scroll"><table><thead><tr><th>#</th><th>' + t("h_text") + "</th><th>" + t("h_class") + '</th><th class="num">' + t("h_min") + '</th><th class="num">' + t("h_material") + "</th></tr></thead><tbody>";
    var k = 0, sm = 0, sa = 0;
    DATA.lines.forEach(function (l, j) {
      if (l[0] !== i) return; k++;
      var c = DATA.classes[l[1]], ln = RES.lines[j], m = ln.min, a = P.classes[l[1]].mat * l[2]; sm += m; sa += a;
      var cn = ln.next ? ' <span class="small muted">' + t("n_conn_next", { n: int(ln.next), x: P.connNext }) + "</span>" : "";
      d += "<tr><td>" + k + '</td><td class="txt">' + esc(l[3]) + "</td><td>" + esc(classL(c)) + cn + '</td><td class="num">' + mn(m) + '</td><td class="num">' + eur2(a) + "</td></tr>";
    });
    d += '<tr class="total"><td></td><td>' + (f.work ? t("dl_sum_on") : t("dl_sum_off")) + '</td><td></td><td class="num">' + mn(sm) + '</td><td class="num">' + eur2(sa) + "</td></tr></tbody></table></div></div></details>";
  }
  $("ncout").innerHTML = h + tb + others + d;
}

var PARAM_DEFS = [["rateProd", "€/h", "b_aec", 1, 0.01], ["rateQuality", "€/h", "b_aec", 1, 0.01], ["rateMe", "€/h", "b_aec", 1, 0.01], ["rateEng", "€/h", "b_official", 0, 0.01], ["alert", "min", "b_mes", 1, 1], ["write", "min", "b_local", 0, 1], ["writeFinal", "min", "b_local", 0, 1],
  ["support", "min", "b_local", 0, 1], ["setup", "min", "b_local", 0, 1], ["floor", "min", "b_local", 0, 1], ["recheck", "min", "b_local", 0, 1], ["noDefect", "min", "b_local", 0, 1],
  ["connNext", "min", "b_wo", 1, 1], ["internalFactor", "×", "b_wo", 1, 0.1], ["writeGlobal", "min", "b_local", 0, 1], ["workGlobal", "min", "b_local", 0, 1]];
function inputHTML(path, val, def, step) {
  return '<input class="p' + (val !== def ? " changed" : "") + '" type="number" min="0" step="' + (step || 1) + '" value="' + val + '" data-path="' + path + '" aria-label="' + path + '">';
}
function renderParams() {
  $("params").innerHTML = PARAM_DEFS.map(function (d) {
    return '<div class="prow"><div>' + t("p_" + d[0]) + (d[3] ? "<div>" + tag(t(d[2]), 1) + "</div>" : "") + "</div>" + inputHTML(d[0], P[d[0]], DEFAULT_P[d[0]], d[4]) + '<div class="u">' + d[1] + "</div></div>";
  }).join("");
  $("clssum").textContent = t("d_classes", { n: DATA.classes.length });
  var h = "<table><thead><tr><th>" + t("h_class") + '</th><th class="num">' + t("h_costed") + '</th><th class="num">' + t("h_min") + '</th><th class="num">' + t("h_mat_eur") + '</th><th class="num">' + t("h_direct") + "</th><th>" + t("h_origin") + "</th></tr></thead><tbody>";
  DATA.classes.map(function (c, j) { return j; }).sort(function (p, q) { return (CLS[q] ? CLS[q].n : 0) - (CLS[p] ? CLS[p].n : 0); }).forEach(function (j) {
    var c = DATA.classes[j], q = P.classes[j], dq = DEFAULT_P.classes[j];
    h += "<tr><td>" + esc(classL(c)) + '</td><td class="num">' + int(CLS[j] ? CLS[j].n : 0) + '</td><td class="num">' +
      (q.of == null ? inputHTML("classes." + j + ".min", q.min, dq.min) : dec(RES.classMin[j])) + '</td><td class="num">' + inputHTML("classes." + j + ".mat", q.mat, dq.mat, 0.01) + '</td><td class="num">' + eur(CLS[j] ? CLS[j].cost : 0) + "</td><td>" +
      (q.of == null ? tag(lab(c.basis), c.basis.flag) : tag(t("team_rule"), 0) + ' <span class="small muted">' + q.factor + " × " + esc(classL(DATA.classes[q.of])) + "</span>") + "</td></tr>";
  });
  $("classtable").innerHTML = h + "</tbody></table>";
  $("airbus").innerHTML = Object.keys(DATA.airbusBasis).map(function (k) {
    return '<div class="prow"><div>' + esc(ruleL(k)) + (DATA.airbusBasis[k].flag ? "<div>" + tag(lab(DATA.airbusBasis[k]), 1) + "</div>" : "") + "</div>" + inputHTML("airbus." + k, P.airbus[k], DEFAULT_P.airbus[k], 0.01) + '<div class="u">' + t("u_per_nc") + "</div></div>";
  }).join("");
}
function renderGaps() {
  var a = aecRows(), part = 0, borrowed = 0, costed = 0;
  a.forEach(function (x) { if (x.f.part) part++; });
  CLS.forEach(function (k) { costed += k.n; if (/^T0/.test(DATA.classes[k.j].ref)) borrowed += k.n; });
  $("gaps").innerHTML = [t("g1", { n: int(part) }), t("g9"), t("g2", { a: int(borrowed), b: int(costed) }), t("g7"), t("g34"), t("g8")].map(function (s) { return "<li>" + s + "</li>"; }).join("");
}

function renderAll() {
  var act = document.activeElement, key = act && act.dataset ? (act.dataset.path ? '[data-path="' + act.dataset.path + '"]' : act.dataset.amt ? '[data-amt="' + act.dataset.amt + '"]' : null) : null;
  RES = computeAll(DATA, P, AMT);
  renderSummary(); renderMethod(); renderBreakdown(); renderReturns(); renderParams(); renderGaps();
  if (currentNC != null) renderNC(currentNC);
  if (key) { var el = document.querySelector(key); if (el) el.focus(); }
}

/* ------------------------------------------------------------------ events */
document.addEventListener("change", function (e) {
  var ds = e.target && e.target.dataset ? e.target.dataset : {};
  if (ds.path) {
    var v = parseFloat(e.target.value); if (!isFinite(v) || v < 0) v = 0;
    var path = ds.path.split("."), o = P; for (var i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = v; later();
  } else if (ds.amt) {
    var a = parseFloat(e.target.value);
    if (e.target.value === "" || !isFinite(a) || a < 0) delete AMT[ds.amt]; else AMT[ds.amt] = a;
    store("cnq.amounts.v1", AMT); later();
  }
});
// re-render after the event has finished, so an input is never replaced while it is still handling its own change
var pending = false;
function later() { if (pending) return; pending = true; setTimeout(function () { pending = false; renderAll(); }, 0); }
document.addEventListener("click", function (e) {
  var ds = e.target && e.target.dataset ? e.target.dataset : {};
  if (ds.lang) { LANG = ds.lang; store("cnq.lang", LANG); applyStatic(); renderAll(); }
  else if (ds.tab) showTab(ds.tab);
  else if (ds.ex != null) { $("ncpick").value = DATA.nc[+ds.ex][NC.num]; renderNC(+ds.ex); }
  else if (ds.open != null) { $("ncpick").value = DATA.nc[+ds.open][NC.num]; renderNC(+ds.open); $("ncpick").scrollIntoView({ block: "center" }); markTab("method"); }
});
// remember whether the defect lines of the checked NC are unfolded, so a recalculation does not fold them back
document.addEventListener("toggle", function (e) { if (e.target && e.target.id === "nclines") linesOpen = e.target.open; }, true);
document.addEventListener("click", function (e) {
});
$("reset").addEventListener("click", function () { P = JSON.parse(JSON.stringify(DEFAULT_P)); renderAll(); });
$("clearamt").addEventListener("click", function () { AMT = {}; store("cnq.amounts.v1", AMT); renderAll(); });
function pick() {
  var v = $("ncpick").value.trim(), i = DATA.nc.findIndex(function (r) { return String(r[NC.num]) === v; });
  if (i < 0) { $("ncout").innerHTML = '<p class="muted" style="margin-top:14px">' + t("nc_none") + "</p>"; currentNC = null; return; }
  renderNC(i);
}
$("ncgo").addEventListener("click", pick);
$("ncpick").addEventListener("keydown", function (e) { if (e.key === "Enter") pick(); });
$("nclist").innerHTML = DATA.nc.filter(function (r) { return r[NC.group] !== "No master data"; }).map(function (r) { return '<option value="' + r[NC.num] + '">'; }).join("");

/* ------------------------------------------------------------------ start */
LANG = load("cnq.lang", "fr") === "en" ? "en" : "fr";
AMT = load("cnq.amounts.v1", {}) || {};
applyStatic();
currentNC = DATA.examples[1].i; $("ncpick").value = DATA.nc[currentNC][NC.num];
renderAll();
// keep the jump bar in step with the section on screen
if ("IntersectionObserver" in window) {
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) markTab(e.target.id.replace("tab-", "")); }); }, { rootMargin: "-20% 0px -70% 0px" });
  TABS.forEach(function (k) { io.observe($("tab-" + k)); });
}
</script>
