<title>FTO2 Retours clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same system as the FTO2 Pareto page. Header (unit, language, scope), four headline figures,
   six clickable breakdowns that filter each other, then the defect table that follows every filter. */
:root {
  --page: #f6f6f3;
  --surface: #fdfdfb;
  --ink: #101418;
  --ink-2: #4c5157;
  --muted: #868a8f;
  --grid: #e3e3dd;
  --track: #ecece6;
  --ring: rgba(16,20,24,0.10);
  --s1: #1f5fae;
  --s1-soft: rgba(31,95,174,0.10);
  --dim: #b9bab3;
  --warn: #9a5b00;
  --warn-soft: rgba(154,91,0,0.10);
  --focus: #1f5fae;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
    --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
    --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --dim: #4e5359;
    --warn: #e0a54a; --warn-soft: rgba(224,165,74,0.14); --focus: #4d8fdc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
  --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
  --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --dim: #4e5359;
  --warn: #e0a54a; --warn-soft: rgba(224,165,74,0.14); --focus: #4d8fdc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
header { display: grid; gap: 14px; border-bottom: 1px solid var(--grid); padding-bottom: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.unit { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.titles { display: grid; gap: 4px; }
h1 { font-weight: 700; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.12; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-weight: 600; font-size: 14.5px; margin: 0; }
p { margin: 0; max-width: 75ch; }
.period, .sub { color: var(--ink-2); }
.sub { font-size: 13.5px; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.label { font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 6px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; padding: 5px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg.lang button { padding: 4px 11px; font-size: 12px; letter-spacing: .05em; font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.note { font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 14px; max-width: none; }
.note.warn { color: var(--ink); background: var(--warn-soft); border-color: transparent; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.fig b { font-weight: 700; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig span { font-size: 13px; color: var(--ink-2); }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.section-head > div { display: grid; gap: 2px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.clear-one { font: inherit; font-size: 12px; color: var(--s1); background: none; border: 0; padding: 0; cursor: pointer; }
.bars { display: grid; gap: 2px; }
.bar { display: grid; grid-template-columns: minmax(0, 11.5em) minmax(0, 1fr) 2.6em; align-items: center; gap: 10px; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; border-radius: 4px; padding: 3px 4px; text-align: left; cursor: pointer; }
.bar:hover { background: var(--track); }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 12px; background: var(--track); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--s1); border-radius: 2px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars.active .bar .fill { background: var(--dim); }
.bars.active .bar[aria-pressed="true"] .fill { background: var(--s1); }
.bar[aria-pressed="true"] { background: var(--s1-soft); }
.bar[aria-pressed="true"] .name { font-weight: 600; }
.bar.zero { color: var(--muted); }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; align-items: end; height: 150px; }
.col { font: inherit; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 3px; height: 100%; background: none; border: 0; border-radius: 4px; padding: 2px 0; cursor: pointer; color: var(--ink); min-width: 0; }
.col:hover { background: var(--track); }
.col .v { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.col .stick { width: 70%; align-self: end; background: var(--s1); border-radius: 2px 2px 0 0; min-height: 1px; }
.col .m { font-size: 11.5px; color: var(--ink-2); }
.cols.active .col .stick { background: var(--dim); }
.cols.active .col[aria-pressed="true"] .stick { background: var(--s1); }
.col[aria-pressed="true"] { background: var(--s1-soft); }
.empty { font-size: 13px; color: var(--muted); padding: 6px 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 30px; }
.chip { font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ring); background: var(--s1-soft); color: var(--ink); cursor: pointer; }
.chip i { font-style: normal; color: var(--ink-2); }
.chip.reset { background: transparent; color: var(--s1); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
input[type="search"] { font: inherit; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); width: min(100%, 320px); }
.count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 0; border-bottom: 1px solid var(--grid); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 9px 10px; cursor: pointer; width: 100%; text-align: left; }
th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; color: var(--s1); }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td { background: var(--track); }
tbody tr.row[aria-expanded="true"] td { background: var(--s1-soft); border-bottom-color: transparent; }
td.nc { font-family: var(--font-data); font-size: 12.5px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.why { min-width: 18em; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ring); color: var(--ink-2); white-space: nowrap; }
.tag.medium { border-style: dashed; }
.tag.low { color: var(--warn); border-color: var(--warn); }
.tag.out { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.sym { color: var(--ink-2); font-size: 12.5px; }
tr.detail td { padding: 4px 10px 16px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.detail-grid h4 { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px; letter-spacing: .04em; text-transform: uppercase; }
.long { font-family: var(--font-data); font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 8px 10px; margin: 0; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 12.5px; }
dt { color: var(--ink-2); }
dd { margin: 0; overflow-wrap: anywhere; }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 14px; display: grid; gap: 4px; }
@media (max-width: 520px) { .bar { grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 2.4em; } }
@media (prefers-reduced-motion: no-preference) { .fill, .stick { transition: width .15s ease, height .15s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="topbar">
      <div class="unit">FTO2 · <span data-t="unit"></span></div>
      <div class="seg lang" role="group" aria-label="Langue / Language">
        <button type="button" id="lFr" aria-pressed="true">FR</button>
        <button type="button" id="lEn" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="titles">
      <h1 data-t="title"></h1>
      <p class="period" id="period"></p>
    </div>
    <div class="controls">
      <span class="label" id="scLabel" data-t="scopeLabel"></span>
      <div class="seg" role="group" aria-labelledby="scLabel">
        <button type="button" id="scIn" aria-pressed="true" data-t="scopeIn"></button>
        <button type="button" id="scAll" aria-pressed="false" data-t="scopeAll"></button>
      </div>
    </div>
    <p class="note" id="scopeNote"></p>
  </header>

  <div class="figs">
    <div class="fig"><b id="f1"></b><span data-t="fig1"></span></div>
    <div class="fig"><b id="f2"></b><span data-t="fig2"></span></div>
    <div class="fig"><b id="f3"></b><span data-t="fig3"></span></div>
    <div class="fig"><b id="f4"></b><span data-t="fig4"></span></div>
  </div>

  <section>
    <div class="section-head">
      <div><h2 data-t="bTitle"></h2><p class="sub" data-t="bSub"></p></div>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="grid" id="cards"></div>
  </section>

  <section>
    <div class="section-head">
      <div><h2 data-t="tTitle"></h2><p class="sub" data-t="tSub"></p></div>
    </div>
    <div class="toolbar">
      <input type="search" id="q" autocomplete="off">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer><p data-t="foot1"></p><p data-t="foot2"></p><p data-t="foot3"></p></footer>
</div>

    { k: 'month', t: 'dMonth', cols: true, get: function (r) { return r.date.slice(0, 7); }, show: monthName, order: function (vals) { return vals.slice().sort(); } },
    { k: 'nat', t: 'dNat', note: 'natOnly', get: function (r) { return r.nat || null; }, show: function (v) { return S('nat_' + v); }, order: function (vals) { return ['phys', 'hs', 'recu', 'nc'].filter(function (c) { return vals.indexOf(c) >= 0; }); } },
    { k: 'conf', t: 'dConf', get: function (r) { return r.conf; }, show: function (v) { return S(v); }, order: function (vals) { return ['high', 'medium', 'low'].filter(function (c) { return vals.indexOf(c) >= 0; }); } }
  ];
  var DIM = {}; DIMS.forEach(function (d) { DIM[d.k] = d; });

  function scoped() { return ALL.filter(function (r) { return state.scope === 'all' || r.scope; }); }
  function matchQ(r) {
    if (!state.q) return true;
    var h = (r.nc + ' ' + r.title + ' ' + r.snip + ' ' + r.lt + ' ' + r.why + ' ' + r.sym + ' ' + r.sub + ' ' + r.rca + ' ' + L(r.rca) + ' ' + r.cat + ' ' + L(r.cat)).toLowerCase();
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(function (w) { return h.indexOf(w) >= 0; });
  }
  function filtered(except) {
    return scoped().filter(function (r) {
      for (var k in state.f) { if (k !== except && DIM[k].get(r) !== state.f[k]) return false; }
      return matchQ(r);
    });
  }

  var cardsEl = document.getElementById('cards');
  DIMS.forEach(function (d) {
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="card-head"><h3 data-t="' + d.t + '"></h3><button type="button" class="clear-one" data-dim="' + d.k + '" hidden></button></div>' +
      (d.note ? '<p class="sub" data-t="' + d.note + '"></p>' : '') +
      '<div class="' + (d.cols ? 'cols' : 'bars') + '" id="b-' + d.k + '"></div>';
    cardsEl.appendChild(c);
  });
  cardsEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-v]'), cl = e.target.closest('.clear-one');
    if (cl) { delete state.f[cl.getAttribute('data-dim')]; render(); return; }
    if (!b) return;
    var k = b.getAttribute('data-dim'), v = b.getAttribute('data-v');
    if (state.f[k] === v) delete state.f[k]; else state.f[k] = v;
    render();
  });

  function renderDim(d) {
    var rs = filtered(d.k), m = {};
    rs.forEach(function (r) { var v = d.get(r); if (v != null && v !== '') m[v] = (m[v] || 0) + 1; });
    // keep every value of the scope visible (as 0) so the bars do not jump around
    var base = {}; scoped().forEach(function (r) { var v = d.get(r); if (v != null && v !== '') base[v] = 1; });
    var vals = Object.keys(base);
    vals = d.order ? d.order(vals) : vals.sort(function (a, b) { return (m[b] || 0) - (m[a] || 0) || (a < b ? -1 : 1); });
    var max = Math.max.apply(null, vals.map(function (v) { return m[v] || 0; }).concat([1]));
    var el = document.getElementById('b-' + d.k), act = d.k in state.f;
    el.classList.toggle('active', act);
    if (!vals.length) { el.innerHTML = '<p class="empty">' + esc(S('empty')) + '</p>'; return; }
    el.innerHTML = vals.map(function (v) {
      var n = m[v] || 0, on = state.f[d.k] === v, lab = esc(d.show(v));
      if (d.cols) {
        return '<button type="button" class="col" data-dim="' + d.k + '" data-v="' + esc(v) + '" aria-pressed="' + on + '" aria-label="' + lab + ': ' + n + '">' +
          '<span class="v">' + num(n) + '</span><span class="stick" style="height:' + (n / max * 100) + '%"></span><span class="m">' + lab + '</span></button>';
      }
      return '<button type="button" class="bar' + (n ? '' : ' zero') + '" data-dim="' + d.k + '" data-v="' + esc(v) + '" aria-pressed="' + on + '" title="' + lab + '">' +
        '<span class="name">' + lab + '</span><span class="track"><span class="fill" style="display:block;width:' + (n / max * 100) + '%"></span></span><span class="val">' + num(n) + '</span></button>';
    }).join('');
    var cl = el.parentNode.querySelector('.clear-one'); cl.hidden = !act; cl.textContent = S('clear');
  }

  var COLS = [
    { k: 'nc', t: 'cNc' }, { k: 'date', t: 'cDate' }, { k: 'line', t: 'cLine' }, { k: 'cat', t: 'cCat' },
    { k: 'rca', t: 'cRca' }, { k: 'sub', t: 'cSub' }, { k: 'why', t: 'cWhy' }, { k: 'conf', t: 'cConf' }
  ];
  var CONF_RANK = { high: 0, medium: 1, low: 2 };
  function renderHead() {
    document.getElementById('thead').innerHTML = COLS.map(function (c) {
      var dir = state.sort.k === c.k ? (state.sort.dir > 0 ? '↑' : '↓') : null;
      return '<th scope="col" aria-sort="' + (dir ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-sort="' + c.k + '"' + (dir ? ' data-dir="' + dir + '"' : '') + '>' + esc(S(c.t)) + '</button></th>';
    }).join('');
  }
  document.getElementById('thead').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sort]'); if (!b) return;
    var k = b.getAttribute('data-sort');
    state.sort = state.sort.k === k ? { k: k, dir: -state.sort.dir } : { k: k, dir: k === 'date' ? -1 : 1 };
    renderTable();
  });
  function sortVal(r, k) {
    if (k === 'conf') return CONF_RANK[r.conf];
    if (k === 'cat' || k === 'rca') return L(r[k]).toLowerCase();
    if (k === 'date') return r.date + r.nc + String(100 - r.seq).padStart(3, '0');
    return String(r[k]).toLowerCase();
  }
  function rowKey(r) { return r.nc + '-' + r.seq; }
  function renderTable() {
    renderHead();
    var rs = filtered(null), k = state.sort.k, dir = state.sort.dir;
    rs.sort(function (a, b) { var x = sortVal(a, k), y = sortVal(b, k); return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.date < b.date ? 1 : -1); });
    document.getElementById('count').textContent = S('shown', { n: num(rs.length), t: num(scoped().length) });
    var tb = document.getElementById('tbody');
    if (!rs.length) { tb.innerHTML = '<tr><td colspan="' + COLS.length + '" class="empty">' + esc(S('empty')) + '</td></tr>'; return; }
    tb.innerHTML = rs.map(function (r) {
      var key = rowKey(r), open = !!state.open[key];
      var main = '<tr class="row" tabindex="0" data-key="' + key + '" aria-expanded="' + open + '">' +
        '<td class="nc">' + esc(r.nc) + (r.seq > 1 ? ' · ' + r.seq : '') + (r.scope ? '' : '<br><span class="tag out">' + esc(S('out')) + '</span>') + '</td>' +
        '<td class="num">' + esc(shortDay(r.date)) + '</td><td>' + esc(r.line) + '</td><td>' + esc(L(r.cat)) + '</td><td>' + esc(L(r.rca)) + '</td>' +
        '<td>' + esc(r.sub) + (r.nat ? '<br><span class="sym">' + esc(S('nat_' + r.nat)) + '</span>' : '') + '</td>' +
        '<td class="why">' + esc(r.why) + (r.sym ? '<br><span class="sym">' + esc(S('iSym')) + ' : ' + esc(r.sym) + '</span>' : '') + '</td>' +
        '<td><span class="tag ' + r.conf + '">' + esc(S(r.conf)) + '</span></td></tr>';
      if (!open) return main;
      var info = [['iTitle', r.title], ['iPlant', r.plant], ['iLiab', r.liab], ['iGps', r.gps], ['iDet', r.det], ['iSym', r.sym], ['iCode', r.code], ['iParser', L(r.pcat)]]
        .map(function (p) { return '<dt>' + esc(S(p[0])) + '</dt><dd>' + esc(p[1] || S('iNone')) + '</dd>'; }).join('');
      return main + '<tr class="detail"><td colspan="' + COLS.length + '"><div class="detail-grid">' +
        '<div><h4>' + esc(S('hSnip')) + '</h4><p>' + esc(r.snip || S('iNone')) + '</p><h4 style="margin-top:12px">' + esc(S('hInfo')) + '</h4><dl>' + info + '</dl></div>' +
        '<div><h4>' + esc(S('hLong')) + '</h4><pre class="long">' + esc(r.lt) + '</pre></div></div></td></tr>';
    }).join('');
  }
  var tbody = document.getElementById('tbody');
  function toggleRow(tr) { var k = tr.getAttribute('data-key'); if (state.open[k]) delete state.open[k]; else state.open[k] = 1; renderTable(); var again = tbody.querySelector('[data-key="' + k + '"]'); if (again) again.focus(); }
  tbody.addEventListener('click', function (e) { var tr = e.target.closest('tr.row'); if (tr) toggleRow(tr); });
  tbody.addEventListener('keydown', function (e) { var tr = e.target.closest('tr.row'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRow(tr); } });

  function renderChips() {
    var el = document.getElementById('chips'), keys = Object.keys(state.f);
    el.innerHTML = keys.map(function (k) {
      return '<button type="button" class="chip" data-k="' + k + '"><i>' + esc(S(DIM[k].t)) + '</i>' + esc(DIM[k].show(state.f[k])) + ' <span aria-hidden="true">×</span></button>';
    }).join('') + (keys.length ? '<button type="button" class="chip reset" id="clearAll">' + esc(S('clearAll')) + '</button>' : '');
  }
  document.getElementById('chips').addEventListener('click', function (e) {
    if (e.target.closest('#clearAll')) { state.f = {}; render(); return; }
    var c = e.target.closest('[data-k]'); if (c) { delete state.f[c.getAttribute('data-k')]; render(); }
  });

  function renderFigs() {
    var rs = scoped(), ncs = {}, dmg = 0, phys = 0;
    rs.forEach(function (r) { ncs[r.nc] = 1; if (r.cat === 'Élément Endommagé') dmg++; if (r.nat === 'phys') phys++; });
    document.getElementById('f1').textContent = num(Object.keys(ncs).length);
    document.getElementById('f2').textContent = num(rs.length);
    document.getElementById('f3').textContent = pct(dmg / rs.length * 100);
    document.getElementById('f4').textContent = pct(phys / rs.length * 100);
  }
  function applyText() {
    document.documentElement.lang = state.lang;
    document.title = S('title');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = S(el.getAttribute('data-t')); });
    document.getElementById('period').textContent = S('period', { from: day(D.meta.from), to: day(D.meta.to) });
    var outN = {}; ALL.forEach(function (r) { if (!r.scope) outN[r.nc] = 1; });
    var note = document.getElementById('scopeNote');
    note.textContent = state.scope === 'in' ? S('noteIn') : S('noteAll', { n: num(Object.keys(outN).length) });
    note.classList.toggle('warn', state.scope === 'all');
    document.getElementById('q').placeholder = S('search');
    document.getElementById('q').setAttribute('aria-label', S('search'));
    document.getElementById('lFr').setAttribute('aria-pressed', String(state.lang === 'fr'));
    document.getElementById('lEn').setAttribute('aria-pressed', String(state.lang === 'en'));
    document.getElementById('scIn').setAttribute('aria-pressed', String(state.scope === 'in'));
    document.getElementById('scAll').setAttribute('aria-pressed', String(state.scope === 'all'));
  }
  function render() { applyText(); renderFigs(); renderChips(); DIMS.forEach(renderDim); renderTable(); }

  document.getElementById('lFr').addEventListener('click', function () { state.lang = 'fr'; try { localStorage.setItem('fto2-rc-lang', 'fr'); } catch (e) {} render(); });
  document.getElementById('lEn').addEventListener('click', function () { state.lang = 'en'; try { localStorage.setItem('fto2-rc-lang', 'en'); } catch (e) {} render(); });
  document.getElementById('scIn').addEventListener('click', function () { state.scope = 'in'; state.f = {}; render(); });
  document.getElementById('scAll').addEventListener('click', function () { state.scope = 'all'; state.f = {}; render(); });
  var qt; document.getElementById('q').addEventListener('input', function (e) { clearTimeout(qt); qt = setTimeout(function () { state.q = e.target.value.trim(); renderFigs(); renderChips(); DIMS.forEach(renderDim); renderTable(); }, 120); });
  render();
})();
</script>
