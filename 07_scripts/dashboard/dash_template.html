<title>FTO2 NC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the FTO2 quality pages' system. Header with the global switches (language, classification, minor
   defects), three tabs (Pareto, weekly Pareto, CNQ). Each tab: headline figures, clickable breakdowns that
   filter each other, then the matching table. */
:root {
  --page: #f6f6f3;
  --surface: #fdfdfb;
  --ink: #101418;
  --ink-2: #4c5157;
  --muted: #868a8f;
  --grid: #e3e3dd;
  --track: #ecece6;
  --ring: rgba(16,20,24,0.10);
  --s1: #1f5fae;
  --s1-soft: rgba(31,95,174,0.10);
  --dim: #b9bab3;
  --ref: #101418;
  --up: #a33b2b;
  --down: #2c7a4b;
  --warn: #9a5b00;
  --warn-soft: rgba(154,91,0,0.10);
  --focus: #1f5fae;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
    --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
    --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --dim: #4e5359; --ref: #f2f3f4;
    --up: #e07a68; --down: #5cbf86; --warn: #e0a54a; --warn-soft: rgba(224,165,74,0.14); --focus: #4d8fdc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1012; --surface: #171a1d; --ink: #f2f3f4; --ink-2: #b9bdc2; --muted: #80858b;
  --grid: #2a2e32; --track: #23272b; --ring: rgba(255,255,255,0.10);
  --s1: #4d8fdc; --s1-soft: rgba(77,143,220,0.16); --dim: #4e5359; --ref: #f2f3f4;
  --up: #e07a68; --down: #5cbf86; --warn: #e0a54a; --warn-soft: rgba(224,165,74,0.14); --focus: #4d8fdc;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
header { display: grid; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.unit { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.titles { display: grid; gap: 4px; }
h1 { font-weight: 700; font-size: clamp(26px, 4.2vw, 34px); line-height: 1.12; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-weight: 600; font-size: 20px; line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-weight: 600; font-size: 14.5px; margin: 0; }
p { margin: 0; max-width: 78ch; }
.period, .sub { color: var(--ink-2); }
.sub { font-size: 13.5px; }
.controls { display: flex; gap: 10px 20px; align-items: center; flex-wrap: wrap; }
.ctl { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.label { font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--ring); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.seg.lang button { padding: 4px 11px; font-size: 12px; letter-spacing: .05em; font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, [role="tab"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
select { font: inherit; font-size: 13.5px; padding: 5px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); overflow-x: auto; }
.tabs [role="tab"] { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px 9px; cursor: pointer; white-space: nowrap; }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--s1); }
.tabs [role="tab"]:hover { color: var(--ink); }
.panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.note { font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 14px; max-width: none; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.fig { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.fig b { font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig span { font-size: 13px; color: var(--ink-2); }
.fig small { font-size: 12px; color: var(--muted); }
.delta.up { color: var(--up); } .delta.down { color: var(--down); }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.section-head > div { display: grid; gap: 2px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.clear-one { font: inherit; font-size: 12px; color: var(--s1); background: none; border: 0; padding: 0; cursor: pointer; }
.bars { display: grid; gap: 2px; }
.bar { display: grid; grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4.2em; align-items: center; gap: 10px; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; border-radius: 4px; padding: 3px 4px; text-align: left; cursor: pointer; }
.bars.money .bar { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 6.4em; }
.bars.pareto .bar { grid-template-columns: minmax(0, 13em) minmax(0, 1fr) 4.2em 3.6em; }
.bar:hover { background: var(--track); }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { position: relative; height: 13px; background: var(--track); border-radius: 2px; }
.bar .fill { display: block; height: 100%; background: var(--s1); border-radius: 2px; }
.bar.aside .fill { background: var(--dim); }
.bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ref); border-radius: 1px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar .cum { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.bars.active .bar .fill { background: var(--dim); }
.bars.active .bar[aria-pressed="true"] .fill { background: var(--s1); }
.bar[aria-pressed="true"] { background: var(--s1-soft); }
.bar[aria-pressed="true"] .name { font-weight: 600; }
.bar.zero { color: var(--muted); }
.sep { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 4px 2px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; background: var(--s1); }
.key i.t { width: 2px; height: 14px; background: var(--ref); }
.key i.d { background: var(--dim); }
.cols-wrap { overflow-x: auto; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(22px, 1fr); gap: 4px; align-items: end; height: 170px; min-width: 100%; }
.col { font: inherit; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 3px; height: 100%; background: none; border: 0; border-radius: 4px; padding: 2px 0; cursor: pointer; color: var(--ink); min-width: 0; }
.col:hover { background: var(--track); }
.col .v { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.col .stick { width: 72%; align-self: end; background: var(--s1); border-radius: 2px 2px 0 0; min-height: 1px; }
.col.partial .stick { background: repeating-linear-gradient(135deg, var(--s1) 0 3px, transparent 3px 6px); border: 1px solid var(--s1); }
.col .m { font-size: 10.5px; color: var(--ink-2); white-space: nowrap; }
.cols.active .col .stick { background: var(--dim); border-color: var(--dim); }
.cols.active .col[aria-pressed="true"] .stick { background: var(--s1); border-color: var(--s1); }
.col[aria-pressed="true"] { background: var(--s1-soft); }
.empty { font-size: 13px; color: var(--muted); padding: 6px 4px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 28px; }
.chip { font: inherit; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--ring); background: var(--s1-soft); color: var(--ink); cursor: pointer; }
.chip i { font-style: normal; color: var(--ink-2); }
.chip.reset { background: transparent; color: var(--s1); }
.chips .hint { font-size: 12.5px; color: var(--muted); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
input[type="search"] { font: inherit; font-size: 13.5px; padding: 6px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); width: min(100%, 320px); }
.count { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 940px; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; background: var(--surface); }
th.r, td.r { text-align: right; }
td { padding: 7px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.nc { font-family: var(--font-data); font-size: 12.5px; white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.txt { min-width: 16em; color: var(--ink-2); }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ring); color: var(--ink-2); white-space: nowrap; }
.more { font: inherit; font-size: 13px; color: var(--s1); background: none; border: 1px solid var(--ring); border-radius: 6px; padding: 6px 12px; cursor: pointer; justify-self: start; }
.weekbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.weekbar button { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--ring); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.weekbar button:disabled { color: var(--muted); cursor: default; }
.levels { display: grid; gap: 8px; }
.level { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr) 7em; gap: 10px; align-items: center; font-size: 13px; }
.level .track { height: 13px; background: var(--track); border-radius: 2px; }
.level .fill { display: block; height: 100%; background: var(--dim); border-radius: 2px; }
.level.main .fill { background: var(--s1); }
.level.main .name { font-weight: 600; }
.level .val { text-align: right; font-variant-numeric: tabular-nums; }
.split { display: grid; gap: 6px; }
.split .big { font-size: 34px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; }
.range dt { color: var(--ink-2); }
.range dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--grid); padding-top: 14px; display: grid; gap: 4px; }
@media (max-width: 560px) {
  .bar, .bars.pareto .bar { grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 3.6em; }
  .bars.pareto .bar .cum { display: none; }
  .bars.money .bar { grid-template-columns: minmax(0, 8em) minmax(0, 1fr) 5.8em; }
  .level { grid-template-columns: minmax(0, 9em) minmax(0, 1fr) 6.4em; }
}
@media (prefers-reduced-motion: no-preference) { .fill, .stick { transition: width .15s ease, height .15s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="topbar">
      <div class="unit">FTO2 · <span data-t="unit"></span></div>
      <div class="seg lang" role="group" aria-label="Langue / Language">
        <button type="button" id="lFr" aria-pressed="true">FR</button>
        <button type="button" id="lEn" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="titles">
      <h1 data-t="title"></h1>
      <p class="period" id="period"></p>
    </div>
    <div class="controls">
      <div class="ctl"><span class="label" id="clLab" data-t="classLabel"></span>
        <div class="seg" role="group" aria-labelledby="clLab"><button type="button" id="clL" data-t="classLlm"></button><button type="button" id="clP" data-t="classParser"></button></div></div>
      <div class="ctl"><span class="label" id="miLab" data-t="minorLabel"></span>
        <div class="seg" role="group" aria-labelledby="miLab"><button type="button" id="miIn" data-t="minorIn"></button><button type="button" id="miOut" data-t="minorOut"></button></div></div>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" id="tab-pareto" aria-controls="p-pareto" data-tab="pareto" data-t="tabPareto"></button>
    <button type="button" role="tab" id="tab-hebdo" aria-controls="p-hebdo" data-tab="hebdo" data-t="tabWeek"></button>
    <button type="button" role="tab" id="tab-cnq" aria-controls="p-cnq" data-tab="cnq" data-t="tabCnq"></button>
  </div>

  <!-- 1. Pareto -->
  <div class="panel" role="tabpanel" id="p-pareto" aria-labelledby="tab-pareto">
    <div class="controls">
      <div class="ctl"><span class="label" id="scLab" data-t="scopeLabel"></span>
        <div class="seg" role="group" aria-labelledby="scLab"><button type="button" id="scF" data-t="scopeFto2"></button><button type="button" id="scC" data-t="scopeClient"></button></div></div>
    </div>
    <div class="figs">
      <div class="fig"><b id="pf1"></b><span data-t="figDefects"></span></div>
      <div class="fig"><b id="pf2"></b><span data-t="figNcs"></span></div>
      <div class="fig"><b id="pf3"></b><span id="pf3l"></span></div>
      <div class="fig"><b id="pf4"></b><span data-t="figCable"></span></div>
    </div>
    <div class="chips" id="pc"></div>
    <div class="grid" id="pg"></div>
    <section class="panel" style="gap:12px">
      <div class="section-head"><div><h2 data-t="tblDefects"></h2><p class="sub" data-t="tblDefectsSub"></p></div></div>
      <div class="toolbar"><input type="search" id="pq" autocomplete="off"><span class="count" id="pn"></span></div>
      <div class="table-wrap"><table><thead><tr id="pth"></tr></thead><tbody id="ptb"></tbody></table></div>
      <button type="button" class="more" id="pm" hidden></button>
    </section>
  </div>

  <!-- 2. Weekly Pareto -->
  <div class="panel" role="tabpanel" id="p-hebdo" aria-labelledby="tab-hebdo" hidden>
    <div class="controls">
      <div class="weekbar">
        <button type="button" id="wPrev" data-ta="prevWeek">←</button>
        <select id="wSel" data-ta="weekLabel"></select>
        <button type="button" id="wNext" data-ta="nextWeek">→</button>
        <span class="label" id="wRange"></span>
      </div>
      <div class="ctl"><span class="label" id="wlLab" data-t="lineLabel"></span>
        <div class="seg" role="group" aria-labelledby="wlLab" id="wLines"></div></div>
    </div>
    <div class="figs">
      <div class="fig"><b id="wf1"></b><span data-t="wDefects"></span><small id="wf1s"></small></div>
      <div class="fig"><b id="wf2"></b><span data-t="wNcs"></span><small id="wf2s"></small></div>
      <div class="fig"><b id="wf3"></b><span id="wf3l"></span></div>
      <div class="fig"><b id="wf4"></b><span data-t="wTopRca"></span></div>
    </div>
    <div class="card wide">
      <div class="card-head"><h3 data-t="wTrend"></h3><span class="sub" data-t="wTrendSub"></span></div>
      <div class="cols-wrap"><div class="cols" id="wTrendCols"></div></div>
    </div>
    <div class="chips" id="wc"></div>
    <div class="grid" id="wg"></div>
    <section class="panel" style="gap:12px">
      <div class="section-head"><div><h2 data-t="tblWeek"></h2></div></div>
      <div class="toolbar"><input type="search" id="wq" autocomplete="off"><span class="count" id="wn"></span></div>
      <div class="table-wrap"><table><thead><tr id="wth"></tr></thead><tbody id="wtb"></tbody></table></div>
      <button type="button" class="more" id="wm" hidden></button>
    </section>
  </div>

  <!-- 3. CNQ -->
  <div class="panel" role="tabpanel" id="p-cnq" aria-labelledby="tab-cnq" hidden>
    <p class="note" data-t="cnqNote"></p>
    <div class="figs">
      <div class="fig"><b id="cf1"></b><span data-t="cTotal"></span><small data-t="cTotalSub"></small></div>
      <div class="fig"><b id="cf2"></b><span data-t="cNcs"></span></div>
      <div class="fig"><b id="cf3"></b><span data-t="cPerNc"></span></div>
      <div class="fig"><b id="cf4"></b><span data-t="cCable"></span><small id="cf4s"></small></div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="card-head"><h3 data-t="cLevels"></h3></div>
        <div class="levels" id="cLevels"></div>
        <p class="sub" data-t="cLevelsSub"></p>
      </div>
      <div class="card">
        <div class="card-head"><h3 data-t="cCableTitle"></h3></div>
        <div class="split"><div class="big" id="cCableBig"></div><p class="sub" id="cCableTxt"></p>
          <dl class="range" id="cCableRange"></dl></div>
      </div>
    </div>
    <div class="chips" id="cc"></div>
    <div class="grid" id="cg"></div>
    <section class="panel" style="gap:12px">
      <div class="section-head"><div><h2 data-t="tblNc"></h2><p class="sub" data-t="tblNcSub"></p></div></div>
      <div class="toolbar"><input type="search" id="cq" autocomplete="off"><span class="count" id="cn"></span></div>
      <div class="table-wrap"><table><thead><tr id="cth"></tr></thead><tbody id="ctb"></tbody></table></div>
      <button type="button" class="more" id="cm" hidden></button>
    </section>
  </div>

  <footer><p id="foot1"></p><p data-t="foot2"></p><p data-t="foot3"></p></footer>
</div>

  function defectText(r) { return r[0] + ' ' + r[18] + ' ' + r[19] + ' ' + dSub(r) + ' ' + dRca(r) + ' ' + L(dRca(r)) + ' ' + dCat(r) + ' ' + L(dCat(r)); }
  function byDate(a, b2) { return a[2] < b2[2] ? 1 : a[2] > b2[2] ? -1 : (a[0] < b2[0] ? 1 : a[0] > b2[0] ? -1 : a[1] - b2[1]); }
  var pareto = Board({
    grid: 'pg', chips: 'pc', search: 'pq', count: 'pn', thead: 'pth', tbody: 'ptb', more: 'pm',
    rows: function () { return D.defects.filter(function (r) { return r[5] === P.scope && keepMinor(r); }); },
    dims: [
      { k: 'cat', t: 'dCat', sub: 'paretoSub', wide: true, pareto: true, get: dCat, show: L },
      { k: 'rca', t: 'dRca', top: 15, get: dRca, show: L },
      { k: 'line', t: 'dLine', get: function (r) { return r[4]; }, show: function (v) { return v; }, order: lineOrder },
      { k: 'month', t: 'dMonth', cols: true, get: function (r) { return r[2].slice(0, 7); }, show: monthName, order: function (v) { return v.sort(); } }
    ],
    text: defectText, head: defectHead, row: defectRow, sort: byDate,
    after: function (b) {
      var rs = b.filtered(null), ncs = {}, cab = 0, m = {};
      rs.forEach(function (r) { ncs[r[0]] = 1; if (dCable(r)) cab++; var c = dCat(r); if (!ASIDE[c]) m[c] = (m[c] || 0) + 1; });
      var top = Object.keys(m).sort(function (x, y) { return m[y] - m[x]; })[0];
      document.getElementById('pf1').textContent = num(rs.length);
      document.getElementById('pf2').textContent = num(Object.keys(ncs).length);
      document.getElementById('pf3').textContent = top ? pct0(m[top] / rs.length * 100) : '—';
      document.getElementById('pf3l').textContent = top ? S('figTop', { c: L(top) }) : '';
      document.getElementById('pf4').textContent = rs.length ? num(cab) + ' · ' + pct0(cab / rs.length * 100) : '—';
      document.getElementById('scF').setAttribute('aria-pressed', String(P.scope === 'FTO2'));
      document.getElementById('scC').setAttribute('aria-pressed', String(P.scope === 'Retour client'));
    }
  });
  document.getElementById('scF').addEventListener('click', function () { P.scope = 'FTO2'; pareto.f = {}; pareto.render(); });
  document.getElementById('scC').addEventListener('click', function () { P.scope = 'Retour client'; pareto.f = {}; pareto.render(); });

  // ---------------------------------------------------------------- tab 2: weekly Pareto
  var defaultWeek = (function () { for (var i = WEEKS.length - 1; i >= 0; i--) { if (!isPartial(WEEKS[i])) return WEEKS[i]; } return WEEKS[WEEKS.length - 1]; })();
  var W = { week: defaultWeek, line: '' };
  function wBase() { return D.defects.filter(function (r) { return r[5] === 'FTO2' && keepMinor(r) && (!W.line || r[4] === W.line); }); }
  // reference weeks: the 8 weeks before, skipping shutdown weeks (fewer than 10 FTO2 defects in total)
  var WEEK_ALL = {}; D.defects.forEach(function (r) { if (r[5] === 'FTO2') WEEK_ALL[r[3]] = (WEEK_ALL[r[3]] || 0) + 1; });
  function prevWeeks(wk, n) { var i = WEEKS.indexOf(wk), out = []; for (var j = i - 1; j >= 0 && out.length < n; j--) { if ((WEEK_ALL[WEEKS[j]] || 0) >= 10) out.push(WEEKS[j]); } return out; }
  function avgRef(getKey) {
    var pw = prevWeeks(W.week, 8), set = {}, m = {};
    pw.forEach(function (w) { set[w] = 1; });
    if (!pw.length) return null;
    wBase().forEach(function (r) { if (set[r[3]]) { var k = getKey(r); m[k] = (m[k] || 0) + 1; } });
    Object.keys(m).forEach(function (k) { m[k] = m[k] / pw.length; });
    return m;
  }
  var weekly = Board({
    grid: 'wg', chips: 'wc', search: 'wq', count: 'wn', thead: 'wth', tbody: 'wtb', more: 'wm',
    rows: function () { return wBase().filter(function (r) { return r[3] === W.week; }); },
    dims: [
      { k: 'cat', t: 'dCat', sub: 'paretoSub', key: true, wide: true, pareto: true, get: dCat, show: L, ref: function () { return avgRef(dCat); } },
      { k: 'rca', t: 'dRca', top: 12, key: true, get: dRca, show: L, ref: function () { return avgRef(dRca); } },
      { k: 'line', t: 'dLine', get: function (r) { return r[4]; }, show: function (v) { return v; }, order: lineOrder }
    ],
    text: defectText, head: defectHead, row: defectRow, sort: byDate,
    after: renderWeekExtras
  });
  function renderWeekExtras(b) {
    var sel = document.getElementById('wSel');
    sel.innerHTML = WEEKS.slice().reverse().map(function (w) { return '<option value="' + w + '"' + (w === W.week ? ' selected' : '') + '>' + esc(weekLong(w) + (isPartial(w) ? ' (' + S('partial') + ')' : '')) + '</option>'; }).join('');
    var i = WEEKS.indexOf(W.week);
    document.getElementById('wPrev').disabled = i <= 0; document.getElementById('wNext').disabled = i >= WEEKS.length - 1;
    var mon = isoMonday(W.week), sun = new Date(mon); sun.setUTCDate(sun.getUTCDate() + 6);
    document.getElementById('wRange').textContent = S('weekRange', { a: day(isoDay(mon), { day: 'numeric', month: 'short' }), b: day(isoDay(sun), { day: 'numeric', month: 'short', year: 'numeric' }) }) + (isPartial(W.week) ? ' · ' + S('partial') : '');
    document.getElementById('wLines').innerHTML = [['', S('allLines')], ['A350', 'A350'], ['A330', 'A330'], ['A320', 'A320'], ['A400M', 'A400M']].map(function (p) {
      return '<button type="button" data-line="' + p[0] + '" aria-pressed="' + (W.line === p[0]) + '">' + esc(p[1]) + '</button>'; }).join('');
    // figures
    var rs = b.base(), ncs = {}, cat = {}, rca = {};
    rs.forEach(function (r) { ncs[r[0]] = 1; var c = dCat(r); if (!ASIDE[c]) cat[c] = (cat[c] || 0) + 1; var a = dRca(r); rca[a] = (rca[a] || 0) + 1; });
    var pw = prevWeeks(W.week, 8), pd = 0, pn = {};
    var set = {}; pw.forEach(function (w) { set[w] = 1; });
    wBase().forEach(function (r) { if (set[r[3]]) { pd++; pn[r[3] + '|' + r[0]] = 1; } });
    var avgD = pw.length ? pd / pw.length : null, avgN = pw.length ? Object.keys(pn).length / pw.length : null;
    function delta(v, a) { if (a == null || !a) return ''; var d = (v - a) / a * 100; return S('vsAvg', { d: (d > 0 ? '+' : '') + pct0(d), a: num(Math.round(a * 10) / 10) }); }
    document.getElementById('wf1').textContent = num(rs.length);
    var s1 = document.getElementById('wf1s'); s1.textContent = delta(rs.length, avgD); s1.className = 'delta ' + (avgD && rs.length > avgD ? 'up' : 'down');
    var nN = Object.keys(ncs).length;
    document.getElementById('wf2').textContent = num(nN);
    var s2 = document.getElementById('wf2s'); s2.textContent = delta(nN, avgN); s2.className = 'delta ' + (avgN && nN > avgN ? 'up' : 'down');
    var tc = Object.keys(cat).sort(function (x, y) { return cat[y] - cat[x]; })[0], tr = Object.keys(rca).sort(function (x, y) { return rca[y] - rca[x]; })[0];
    document.getElementById('wf3').textContent = tc ? num(cat[tc]) : '—';
    document.getElementById('wf3l').textContent = tc ? S('wTop', { c: L(tc) }) : S('wTop', { c: '—' });
    document.getElementById('wf4').textContent = tr ? L(tr) : '—';
    document.getElementById('wf4').style.fontSize = '20px';
    // trend
    var per = {}; wBase().forEach(function (r) { per[r[3]] = (per[r[3]] || 0) + 1; });
    var max = Math.max.apply(null, WEEKS.map(function (w) { return per[w] || 0; }).concat([1]));
    var tc2 = document.getElementById('wTrendCols'); tc2.classList.add('active');
    tc2.innerHTML = WEEKS.map(function (w) { var n = per[w] || 0;
      return '<button type="button" class="col' + (isPartial(w) ? ' partial' : '') + '" data-week="' + w + '" aria-pressed="' + (w === W.week) + '" aria-label="' + esc(weekLong(w)) + ': ' + n + '"><span class="v">' + num(n) + '</span><span class="stick" style="height:' + (n / max * 100) + '%"></span><span class="m">' + weekShort(w) + '</span></button>'; }).join('');
    var cur = tc2.querySelector('[aria-pressed="true"]'); if (cur && G.tab === 'hebdo') { var wrap = tc2.parentNode; var x = cur.offsetLeft - wrap.clientWidth / 2; if (x > 0) wrap.scrollLeft = x; }
  }
  function setWeek(w) { if (WEEKS.indexOf(w) < 0) return; W.week = w; weekly.f = {}; weekly.limit = 150; weekly.render(); }
  document.getElementById('wSel').addEventListener('change', function (e) { setWeek(e.target.value); });
  document.getElementById('wPrev').addEventListener('click', function () { setWeek(WEEKS[WEEKS.indexOf(W.week) - 1]); });
  document.getElementById('wNext').addEventListener('click', function () { setWeek(WEEKS[WEEKS.indexOf(W.week) + 1]); });
  document.getElementById('wTrendCols').addEventListener('click', function (e) { var c = e.target.closest('[data-week]'); if (c) setWeek(c.getAttribute('data-week')); });
  document.getElementById('wLines').addEventListener('click', function (e) { var c = e.target.closest('[data-line]'); if (c) { W.line = c.getAttribute('data-line'); weekly.f = {}; weekly.render(); } });

  // ---------------------------------------------------------------- tab 3: CNQ
  // cost units: one per defect line of an NC FTO2 is liable for (its allocated cost), plus one per such NC with no defect line
  var NC = {}; D.ncs.forEach(function (n) { NC[n[0]] = n; });
  var AEC = D.ncs.filter(function (n) { return n[5] === 1; });
  var UNITS = (function () {
    var out = [], has = {};
    D.defects.forEach(function (r) { var n = NC[r[0]]; if (n && n[5] === 1) { has[r[0]] = 1; out.push({ d: r, n: n }); } });
    AEC.forEach(function (n) { if (!has[n[0]]) out.push({ d: null, n: n }); });
    return out;
  })();
  function uCost(u) { return u.d ? dAlloc(u.d) : (G.cls === 'L' ? u.n[12] : u.n[11]); }
  function uCat(u) { return u.d ? dCat(u.d) : '__none'; }
  function ncC3(n) { return G.cls === 'L' ? n[12] : n[11]; }
  function ncCable(n) { return G.cls === 'L' ? n[20] : n[19]; }
  var cnq = Board({
    grid: 'cg', chips: 'cc', search: 'cq', count: 'cn', thead: 'cth', tbody: 'ctb', more: 'cm', money: true,
    rows: function () { return UNITS; }, measure: uCost,
    dims: [
      { k: 'cat', t: 'cByCat', sub: 'cByCatSub', wide: true, pareto: true, get: uCat, show: function (v) { return v === '__none' ? S('noLine') : L(v); } },
      { k: 'cable', t: 'dCable', get: function (u) { return u.d && dCable(u.d) ? 'c' : 'n'; }, show: function (v) { return v === 'c' ? S('cable') : S('notCable'); }, order: function () { return ['c', 'n']; } },
      { k: 'where', t: 'dWhere', get: function (u) { return u.n[8]; }, show: whereName },
      { k: 'rule', t: 'dRule', get: function (u) { return u.n[7]; }, show: ruleName },
      { k: 'line', t: 'dLine', get: function (u) { return u.n[3]; }, show: function (v) { return v; }, order: lineOrder },
      { k: 'month', t: 'dMonth', cols: true, get: function (u) { return u.n[1].slice(0, 7); }, show: monthName, order: function (v) { return v.sort(); } }
    ],
    text: function (u) { return u.n[0] + ' ' + u.n[22] + ' ' + (u.d ? defectText(u.d) : ''); },
    tableRows: function (units) { var seen = {}, out = []; units.forEach(function (u) { if (!seen[u.n[0]]) { seen[u.n[0]] = 1; out.push(u.n); } }); out.sort(function (a, b2) { return ncC3(b2) - ncC3(a); }); return out; },
    head: function () { return [['kNc'], ['kDate'], ['kLine'], ['kWhere'], ['kRule'], ['kLines', 'r'], ['kCable'], ['kC3', 'r'], ['kC1', 'r'], ['kTitle']].map(function (p) { return '<th scope="col"' + (p[1] ? ' class="r"' : '') + '>' + esc(S(p[0])) + '</th>'; }).join(''); },
    row: function (n) {
      return '<tr><td class="nc">' + esc(n[0]) + '</td><td class="num">' + esc(shortDay(n[1])) + '</td><td>' + esc(n[3]) + '</td><td>' + esc(whereName(n[8])) + '</td><td>' + esc(ruleName(n[7])) + '</td><td class="num r">' + num(n[21]) + '</td><td>' + (ncCable(n) ? '<span class="tag">' + esc(S('yes')) + '</span>' : '') + '</td><td class="num r">' + eur(ncC3(n)) + '</td><td class="num r">' + eur(n[9]) + '</td><td class="txt">' + esc(n[22]) + '</td></tr>';
    },
    after: renderCnqExtras
  });
  function renderCnqExtras() {
    var t3 = 0, t1 = 0, t2 = 0; AEC.forEach(function (n) { t3 += ncC3(n); t1 += n[9]; t2 += n[10]; });
    var cabAlloc = 0, cabDirect = 0, cabWhole = 0, cabSet = {};
    UNITS.forEach(function (u) { if (u.d && dCable(u.d)) { cabAlloc += dAlloc(u.d); cabSet[u.n[0]] = 1; } });
    AEC.forEach(function (n) { if (cabSet[n[0]]) cabWhole += ncC3(n); });
    D.defects.forEach(function (r) { var n = NC[r[0]]; if (n && n[5] === 1 && dCable(r)) cabDirect += directCost(r, n); });
    document.getElementById('cf1').textContent = eur(t3);
    document.getElementById('cf2').textContent = num(AEC.length);
    document.getElementById('cf3').textContent = eur(t3 / AEC.length);
    document.getElementById('cf4').textContent = pct(cabAlloc / t3 * 100);
    document.getElementById('cf4s').textContent = S('cCableSub', { e: eur(cabAlloc), t: eur(t3) });
    var lv = [[S('lvl1'), t1, false], [S('lvl2'), t2, false], [S('lvl3'), t3, true]], mx = Math.max(t1, t2, t3);
    document.getElementById('cLevels').innerHTML = lv.map(function (l) { return '<div class="level' + (l[2] ? ' main' : '') + '"><span class="name">' + esc(l[0]) + '</span><span class="track"><span class="fill" style="width:' + (l[1] / mx * 100) + '%"></span></span><span class="val">' + eur(l[1]) + '</span></div>'; }).join('');
    document.getElementById('cCableBig').textContent = pct(cabAlloc / t3 * 100);
    document.getElementById('cCableTxt').textContent = S('cCableTxt');
    document.getElementById('cCableRange').innerHTML = [[S('rDirect'), cabDirect], [S('rAlloc'), cabAlloc], [S('rWhole'), cabWhole]].map(function (p) {
      return '<dt>' + esc(p[0]) + '</dt><dd>' + eur(p[1]) + ' · ' + pct(p[1] / t3 * 100) + '</dd>'; }).join('');
  }
  // direct cost of a defect line = its allocated cost minus its share of the NC fixed part; recomputed from the NC: share = (c3 - work hands-on - material) / lines is not stored, so use the stored split
  var DIRECT = D.direct || null;
  function directCost(r) { return DIRECT ? (G.cls === 'L' ? DIRECT[r[0] + '|' + r[1]][1] : DIRECT[r[0] + '|' + r[1]][0]) : 0; }

  // ---------------------------------------------------------------- global switches, tabs, text
  function applyText() {
    document.documentElement.lang = G.lang;
    document.title = S('title');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = S(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-ta]').forEach(function (el) { el.setAttribute('aria-label', S(el.getAttribute('data-ta'))); });
    var dates = { from: day(D.meta.from), to: day(D.meta.to) };
    document.getElementById('period').textContent = S('period', dates);
    document.getElementById('foot1').textContent = S('foot1', dates);
    ['pq', 'wq', 'cq'].forEach(function (id) { var q = document.getElementById(id); q.placeholder = S('search'); q.setAttribute('aria-label', S('search')); });
    document.getElementById('lFr').setAttribute('aria-pressed', String(G.lang === 'fr'));
    document.getElementById('lEn').setAttribute('aria-pressed', String(G.lang === 'en'));
    document.getElementById('clL').setAttribute('aria-pressed', String(G.cls === 'L'));
    document.getElementById('clP').setAttribute('aria-pressed', String(G.cls === 'P'));
    document.getElementById('miIn').setAttribute('aria-pressed', String(G.minor));
    document.getElementById('miOut').setAttribute('aria-pressed', String(!G.minor));
    document.getElementById('miOut').closest('.ctl').hidden = G.tab === 'cnq';
  }
  function showTab() {
    ['pareto', 'hebdo', 'cnq'].forEach(function (t) {
      document.getElementById('tab-' + t).setAttribute('aria-selected', String(G.tab === t));
      document.getElementById('tab-' + t).tabIndex = G.tab === t ? 0 : -1;
      document.getElementById('p-' + t).hidden = G.tab !== t;
    });
  }
  function renderAll() { applyText(); showTab(); pareto.render(); weekly.render(); cnq.render(); }
  document.getElementById('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]'); if (!t) return;
    G.tab = t.getAttribute('data-tab'); try { history.replaceState(null, '', '#' + G.tab); } catch (x) {}
    applyText(); showTab(); if (G.tab === 'hebdo') weekly.render();
  });
  document.getElementById('tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var order = ['pareto', 'hebdo', 'cnq'], i = order.indexOf(G.tab) + (e.key === 'ArrowRight' ? 1 : -1);
    G.tab = order[(i + 3) % 3]; applyText(); showTab(); document.getElementById('tab-' + G.tab).focus();
  });
  function setLang(l) { G.lang = l; try { localStorage.setItem('fto2-dash-lang', l); } catch (e) {} renderAll(); }
  document.getElementById('lFr').addEventListener('click', function () { setLang('fr'); });
  document.getElementById('lEn').addEventListener('click', function () { setLang('en'); });
  function resetFilters() { pareto.f = {}; weekly.f = {}; cnq.f = {}; }
  document.getElementById('clL').addEventListener('click', function () { G.cls = 'L'; resetFilters(); renderAll(); });
  document.getElementById('clP').addEventListener('click', function () { G.cls = 'P'; resetFilters(); renderAll(); });
  document.getElementById('miIn').addEventListener('click', function () { G.minor = true; renderAll(); });
  document.getElementById('miOut').addEventListener('click', function () { G.minor = false; resetFilters(); renderAll(); });
  renderAll();
})();
</script>
