<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pôle Élec Quality Hub</title>
<style>
/* Pôle Élec Quality Hub. Names, icons and links come from HUB_CONFIG at the top of the script.
   Light only, to sit inside a light Slate app whatever the Windows theme. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --hover:#f6f8fb; --line:#e4e9f0; --line-2:#d3dbe6;
  --text:#14213a; --muted:#5a687d; --faint:#8793a6;
  --navy-1:#0a1d38; --navy-2:#12345f; --on-navy:#ffffff; --on-navy-2:#b6c4d8;
  --accent:#1f5fbf; --focus:#2b6fd6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px -2px rgba(16,24,40,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.in{max-width:1240px;margin:0 auto;padding:0 32px}

/* header band */
.band{position:relative;overflow:hidden;color:var(--on-navy);background:linear-gradient(115deg,var(--navy-1) 0%,var(--navy-2) 100%);padding-bottom:92px}
.motif{position:absolute;top:0;right:0;width:58%;height:100%;color:#9cbcf0;opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.topbar{position:relative;border-bottom:1px solid rgba(255,255,255,.1)}
.topbar .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-name{display:flex;align-items:center;gap:12px}
.brand b{font-weight:600}
.brand i{width:1px;height:18px;background:rgba(255,255,255,.25)}
.brand-name span{color:var(--on-navy-2)}
.date{font-size:13px;color:var(--on-navy-2);white-space:nowrap}
.greet{position:relative;padding-top:34px}
.greet h1{margin:0;font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.greet p{margin:6px 0 0;font-size:15px;color:var(--on-navy-2)}

/* groups: 2 x 2 panels pulled up over the band */
.content{position:relative;margin-top:-60px}
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.p-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 20px 13px}
.p-hd h2{margin:0;font-size:16px;line-height:1.3;font-weight:600}
.p-hd span{font-size:12.5px;color:var(--faint);white-space:nowrap}
.list{list-style:none;margin:0;padding:0}

/* one row per tool; the whole row is the link */
.tool{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line);transition:background-color .15s}
.tool.live:hover{background:var(--hover)}
.tool.live:has(.stretch:focus-visible){box-shadow:inset 0 0 0 2px var(--focus)}
.ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff);border:1px solid color-mix(in srgb,var(--c) 16%,#fff)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.soon .ic{filter:grayscale(.7);opacity:.7}
.t-main{display:flex;flex-direction:column;min-width:0}
.t-name{font-size:15px;line-height:1.3;font-weight:600}
.t-desc{margin-top:1px;font-size:13px;line-height:1.35;color:var(--muted)}
.stretch{color:inherit;text-decoration:none;outline:none}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}
.t-end{display:flex;align-items:center;gap:10px}
.go{display:grid;color:var(--faint);transition:color .15s}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tool.live:hover .go{color:var(--c)}
.tool.live:hover .go svg{transform:translate(1px,-1px)}
.guide{position:relative;z-index:2;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;padding:4px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface)}
.guide:hover{background:#eef3fb}
.guide:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.pill{font-size:12px;line-height:1;font-weight:600;padding:6px 10px 5px;border-radius:999px;white-space:nowrap}
.pill.soon{background:#e8eefa;color:#234e9c}
.pill.todo{background:#fbf1e1;color:#8a5000}

.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 2px 22px;font-size:12.5px;color:var(--faint)}
.err{grid-column:1/-1;padding:18px 20px;border-radius:10px;border:1px solid #c62828;color:#c62828;background:var(--surface)}

@media (prefers-reduced-motion:reduce){.tool,.go,.go svg{transition:none}}
@media (max-width:1000px){.groups{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .in{padding:0 16px}
  .date{display:none}
  .greet{padding-top:26px}
  .greet h1{font-size:24px}
  .p-hd{padding:17px 16px 10px}
  .tool{padding:12px 16px;gap:12px}
}
</style>
</head>
<body>
<header class="band">
  <svg class="motif" id="motif" viewBox="0 0 640 260" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"></svg>
  <div class="topbar">
    <div class="in">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2.8L5.5 13.2h5.8l-.8 8 8-10.6h-5.9z"/></svg></span><span class="brand-name" id="brand"></span></div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <div class="in greet">
    <h1 id="hello"></h1>
    <p id="welcome"></p>
  </div>
</header>
<main class="in content">
  <div class="groups" id="groups"></div>
  <footer class="foot"><span id="foot-name"></span><span>Les outils s'ouvrent dans un nouvel onglet.</span></footer>
</main>
<script>
// =============================================================================
//  Pôle Élec Quality Hub: configuration
// =============================================================================
//  This block is the only part to edit. Save, then refresh the page.
//
//  For each group:
//    name        title of the panel
//    color       colour of the panel's top line and of its icons
//  Groups fill a 2 x 2 grid in the order below: 1st top left, 2nd top right,
//  3rd bottom left, 4th bottom right. The four groups split the current app's
//  three (Outils qualité, QCM, QA Management); the tools and links are the same.
//
//  For each tool (shown in the order below):
//    name        name of the tool
//    description small line under the name ("" shows nothing)
//    icon        one of: trend-up, trending-up, trend-down, table, ban, alert,
//                        bars, pen, folder, form, eye, doc, check, shield,
//                        link, people, gear
//    link        address the tool opens (in a new tab). While it still says
//                "A_COMPLETER", the row shows "Lien à compléter" and cannot
//                be clicked.
//    guide       optional second link, shown as "Guide utilisateur"
//    soon        true = shown as "Bientôt disponible" and not clickable;
//                delete the line when the tool goes live
//
//  Links taken from the current Slate app (A30 Quality Hub), 20 Oct 2026.
// =============================================================================

const HUB_CONFIG = {
  title: "Pôle Élec",
  subtitle: "Quality Hub",
  // first name in the greeting; in Slate it can come from {{user.firstName}}
  userName: "Mohammad",
  welcome: "Bienvenue sur le dashboard de la qualité Pôle Élec.",

  groups: [
    {
      name: "Production & suivi", color: "#b45309",
      tools: [
        { name: "PPS", description: "Practical Problem Solving", icon: "trend-up",
          link: "https://drive.google.com/drive/folders/1XOzZbgKoalRyJSpLXolOK-w0mou9FcQQ" },
        { name: "Serie Follow Up", description: "Suivi de la série", icon: "table",
          link: "https://docs.google.com/spreadsheets/d/1ZiR6qiyPivrTtRxDHg43n0SApw3LIw15SGXKZb51e4c/edit?gid=0#gid=0" },
        { name: "FOD", description: "Foreign Object Debris", icon: "ban",
          link: "https://drive.google.com/drive/folders/1Pc0LTYiEtla2-yroxx3rk49TaeUyyb8j" }
      ]
    },
    {
      name: "Assurance qualité", color: "#1d4ed8",
      tools: [
        // QCM
        { name: "NC Eradication", description: "Éradication des NC", icon: "trend-down",
          link: "https://core.skywise.com/workspace/module/view/latest/ri.workshop.main.module.fe9aa8c0-22d4-4533-a04e-527c485347d1/similarityexplorer",
          guide: "https://sites.google.com/airbus.com/faq-nc-eradication/accueil",
          soon: true },
        // QA Management. Form (DEMAT) removed on 21 Oct ("capri"); to bring it back, put this line above MyQA:
        // { name: "Form", description: "DEMAT", icon: "form", link: "https://demat.intra.corp/DEMAT/#/" },
        { name: "MyQA", description: "MyQA tool", icon: "shield",
          link: "https://sites.google.com/airbus.com/myqa-tool-fr/accueil" }
      ]
    },
    {
      name: "Non-conformités", color: "#be123c",
      tools: [
        { name: "NC Writing", description: "Rédaction des NC", icon: "pen",
          link: "https://core.skywise.com/workspace/code-workspaces/ri.foundry-container-service.main.container.fbafad4a-153e-476b-a137-69793a2112e3" },
        { name: "NC Dashboard", description: "Tableau de bord des NC", icon: "bars",
          link: "https://core.skywise.com/workspace/foundry-slate/app/ttttteqwffadsdasadsad/home" },
        { name: "Alert Quality", description: "Alertes qualité", icon: "alert",
          link: "https://drive.google.com/drive/folders/1jhbOjOa39LHXJM7v8tTE-_2Mv_f4RSuG" }
      ]
    },
    {
      name: "Surveillance & amélioration", color: "#047857",
      tools: [
        // new: link to fill in
        { name: "QSR", description: "", icon: "check",
          link: "A_COMPLETER" },
        // new: link to fill in
        { name: "Operational Surveillance", description: "Surveillance opérationnelle", icon: "eye",
          link: "A_COMPLETER" },
        { name: "CPB", description: "", icon: "folder",
          link: "https://drive.google.com/drive/folders/1L9W2W8j5fqVKlQuw7skTLHCQ2S9oHP0K" },
        { name: "Projets & Amélioration", description: "Projets et amélioration continue", icon: "trending-up",
          link: "https://drive.google.com/drive/folders/1N-L9s0Y1SpDH0I0hNf145ZOVnRkdxNrd" }
      ]
    }
  ]
};

const ICONS={
  "trend-up":'<path d="M3.5 3.5v17h17"/><path d="M7 15l4-4.5 3 2.5 5.5-6"/>',
  "table":'<rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/>',
  "ban":'<circle cx="12" cy="12" r="8.5"/><path d="M6 18L18 6"/>',
  "alert":'<path d="M10.3 4.2L2.6 17.6A2 2 0 0 0 4.3 20.6h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/><path d="M12 9.5v4.5"/><path d="M12 17.2v.3"/>',
  "bars":'<path d="M4 20.5h16"/><path d="M7.5 17v-6M12 17V6.5M16.5 17v-8.5"/>',
  "pen":'<path d="M4 20h4.2L19.4 8.8a2 2 0 0 0 0-2.8l-1.4-1.4a2 2 0 0 0-2.8 0L4 15.8z"/><path d="M13.6 6.2l4.2 4.2"/>',
  "trend-down":'<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',
  "doc":'<path d="M6 2.8h8l4.5 4.5v13.9H6z"/><path d="M14 2.8v4.5h4.5M9 12h6M9 15.5h6"/>',
  "check":'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M8.8 12.6l2.2 2.2 4.4-4.6"/>',
  "shield":'<path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M9 12l2 2 4-4"/>',
  "folder":'<path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  "link":'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>',
  "people":'<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M15.5 14.2c2.4-.2 4.4 1.3 5 4.3"/>',
  "gear":'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/>',
  "trending-up":'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  "form":'<rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4.5"/>',
  "eye":'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  "external":'<path d="M14 4.5h5.5V10"/><path d="M19.5 4.5L11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svgI=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||ICONS.link)+'</svg>';
const todo=u=>!u||/^A_COMPLETER/i.test(String(u).trim());

const C=HUB_CONFIG;
document.title=(C.title||"")+" "+(C.subtitle||"");
$("#brand").innerHTML='<b>'+esc(C.title)+'</b><i></i><span>'+esc(C.subtitle)+'</span>';
$("#foot-name").textContent=(C.title||"")+" · "+(C.subtitle||"");
$("#hello").textContent="Bonjour"+(C.userName?" "+C.userName:"");
$("#welcome").textContent=C.welcome||"";
const today=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("#date").textContent=today.charAt(0).toUpperCase()+today.slice(1);

// header motif: a bundle of wires fanning out, drawn faintly
(function(){
  const n=11; let d="";
  for(let i=0;i<n;i++){
    const y0=170+(i-(n-1)/2)*4.5, y1=24+i*212/(n-1);
    d+='<path d="M660,'+y0.toFixed(1)+' C540,'+y0.toFixed(1)+' 470,'+y1.toFixed(1)+' 330,'+y1.toFixed(1)+' H0"/>';
  }
  $("#motif").innerHTML='<g fill="none" stroke="currentColor" stroke-width="1.2">'+d+'</g>';
})();

if(!Array.isArray(C.groups)){
  $("#groups").innerHTML='<div class="err">La configuration HUB_CONFIG en haut du script contient une erreur.</div>';
} else {
  $("#groups").innerHTML=C.groups.map(g=>{
    const tools=g.tools||[];
    return '<section class="panel" style="--c:'+esc(g.color||"#1f5fbf")+'">'
      +'<header class="p-hd"><h2>'+esc(g.name)+'</h2><span>'+tools.length+' outil'+(tools.length>1?'s':'')+'</span></header>'
      +'<ul class="list">'+tools.map(t=>{
        const state=t.soon?"soon":todo(t.link)?"todo":"live";
        const name=state==="live"?'<a class="stretch" href="'+esc(t.link)+'" target="_blank" rel="noopener">'+esc(t.name)+'</a>':esc(t.name);
        const end=state==="live"
          ?(t.guide&&!todo(t.guide)?'<a class="guide" href="'+esc(t.guide)+'" target="_blank" rel="noopener">Guide utilisateur</a>':'')+'<span class="go">'+svgI("external")+'</span>'
          :state==="soon"?'<span class="pill soon">Bientôt disponible</span>':'<span class="pill todo">Lien à compléter</span>';
        return '<li class="tool '+state+'"><span class="ic">'+svgI(t.icon)+'</span>'
          +'<span class="t-main"><span class="t-name">'+name+'</span>'+(t.description?'<span class="t-desc">'+esc(t.description)+'</span>':'')+'</span>'
          +'<span class="t-end">'+end+'</span></li>';
      }).join("")+'</ul></section>';
  }).join("");
}
</script>
</body>
</html>
