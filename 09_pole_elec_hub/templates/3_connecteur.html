<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pôle Élec Hub · Connecteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Template 3 "Connecteur": the hub as the front face of a circular connector, one contact per tool. Deliberately dark only. */
:root{
  --bg:#0a0d11; --panel:#11161d; --panel-2:#151b23; --line:#212a35; --line-2:#2d3846;
  --text:#e9eef4; --muted:#909cac; --faint:#5f6b7b; --gold:#e2b44f; --gold-ink:#2a1d05;
  --lcd:#8af7aa; --lcd-dim:#2c5a3a; --lcd-bg:#07120b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1000px 700px at 22% 30%,#141b24 0%,transparent 65%) no-repeat;color:var(--text);
  font:15px/1.45 "Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding-block:22px 22px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px}
.eyebrow{font:500 12px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}
h1{margin:8px 0 0;font:700 44px/1 "Chakra Petch","Bahnschrift",sans-serif;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--gold);font-weight:600}
.plate{display:flex;align-items:stretch;border:1px solid var(--line-2);border-radius:4px;font:400 12.5px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.12em;color:var(--muted)}
.plate span{padding:9px 12px;display:flex;align-items:center}
.plate span+span{border-left:1px solid var(--line-2)}
.plate b{font-weight:400;color:var(--gold)}

.main{position:relative;display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:24px 56px;align-items:start;margin-top:20px}
.fig{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.conn{width:100%;max-width:540px;height:auto;aspect-ratio:1;display:block;overflow:visible}
.conn a{cursor:pointer}
.conn a:focus{outline:none}
.conn .pinlbl{font:600 16px "Chakra Petch",sans-serif;fill:#c5ced9;letter-spacing:.02em}
.conn .halo{fill:none;stroke:var(--c);stroke-width:2.5;opacity:0;transition:opacity .2s}
.conn .ring{fill:none;stroke:var(--c);stroke-width:2;opacity:0}
.conn a.on .halo,.conn a:focus-visible .halo{opacity:1}
.conn a.on .pinlbl{fill:#fff}
.conn a.on .ring{animation:ping 1.1s ease-out infinite}
@keyframes ping{0%{r:15;opacity:.9}100%{r:30;opacity:0}}
.conn .arc{fill:none;stroke-width:4;stroke-linecap:round;opacity:.5}

.tester{width:100%;max-width:440px;border-radius:8px;padding:12px 14px 14px;background:linear-gradient(180deg,#1a2028,#11161c);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.t-hd{display:flex;align-items:center;justify-content:space-between;font:600 11px/1 "Chakra Petch",sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.t-led{width:8px;height:8px;border-radius:50%;background:#20302a;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.tester.on .t-led{background:#52f08a;box-shadow:0 0 8px #52f08a}
.lcd{margin-top:10px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 12px;padding:10px 12px;border-radius:4px;background:var(--lcd-bg);
  box-shadow:inset 0 0 0 1px #0f2a19,inset 0 6px 16px rgba(0,0,0,.6);font:400 15px/1.2 "Share Tech Mono",Consolas,monospace;color:var(--lcd);text-shadow:0 0 6px rgba(138,247,170,.45)}
.lcd .k{color:var(--lcd-dim);text-shadow:none;font-size:12px;align-self:center;letter-spacing:.08em}
.lcd b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pinout{min-width:0}
.po-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.po-hd h2{margin:0;font:700 20px/1 "Chakra Petch",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.po-hd span{font:400 12px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.1em;color:var(--faint)}
.grp{padding-top:10px}
.g-hd{display:flex;align-items:center;gap:10px;padding:4px 0 6px;font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.g-hd i{width:18px;height:3px;border-radius:2px;background:var(--c)}
.g-hd em{margin-left:auto;font:400 11.5px/1 "Share Tech Mono",Consolas,monospace;font-style:normal;letter-spacing:.1em;color:var(--faint)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 22px;align-items:center;gap:14px;min-height:47px;padding:6px 10px 6px 6px;border-radius:6px;
  color:inherit;text-decoration:none;border:1px solid transparent;transition:background .15s,border-color .15s}
.row+.row{margin-top:2px}
.row:hover,.row:focus-visible,.row.on{outline:none;background:color-mix(in srgb,var(--c) 9%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 "Chakra Petch",sans-serif;color:var(--gold-ink);
  background:radial-gradient(circle at 35% 30%,#fff3c9 0%,#e8bd58 45%,#9a6f1d 100%);box-shadow:0 0 0 3px #0b0e12,0 0 0 4px var(--line-2)}
.row.on .pin,.row:hover .pin{box-shadow:0 0 0 3px #0b0e12,0 0 0 5px var(--c),0 0 14px var(--c)}
.txt{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.txt b{font:600 17px/1.2 "Chakra Petch",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.txt em{font-style:normal;color:var(--muted);font-size:14px}
.tg{font:600 10px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:3px;border:1px solid var(--line-2);color:var(--muted)}
.tg.new{border-color:color-mix(in srgb,var(--c) 60%,transparent);color:var(--c)}
.arr{width:18px;height:18px;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s,stroke .15s}
.row:hover .arr,.row:focus-visible .arr{stroke:var(--c);transform:translateX(3px)}

.probe{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.probe .lead-sh{fill:none;stroke:rgba(0,0,0,.6);stroke-width:5;stroke-linecap:round}
.probe .lead{fill:none;stroke:var(--c);stroke-width:2.6;stroke-linecap:round}
.probe .flow{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:2 14;stroke-linecap:round;animation:flow .7s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-16}}

.news{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:12px 18px;align-items:start;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.news h3{margin:2px 0 0;font:600 12px/1 "Chakra Petch",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.news article{display:flex;flex-direction:column;gap:4px;padding-left:14px;border-left:2px solid var(--line-2);font-size:14px;line-height:1.4}
.news time{font:400 12px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.08em;color:var(--gold)}
.foot{margin-top:18px;font:400 11.5px/1 "Share Tech Mono",Consolas,monospace;letter-spacing:.06em;color:var(--faint);text-align:right}

@media (prefers-reduced-motion:reduce){.conn a.on .ring,.probe .flow{animation:none}.probe .flow{display:none}}
@media (max-width:1099px){
  .main{grid-template-columns:minmax(0,1fr)}
  .conn{max-width:440px}
  .probe{display:none}
  .news{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  h1{font-size:34px}
  .lcd{grid-template-columns:auto 1fr}
  .row{grid-template-columns:34px minmax(0,1fr) 18px}
  .tg,.tg-x{display:none}
  .plate span{white-space:nowrap}
  .plate span:last-child{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="site"></div>
      <h1 id="title"></h1>
    </div>
    <div class="plate" aria-label="Repère de l'embase"><span>EMBASE <b>&nbsp;QH-10</b></span><span id="nb"></span><span>VUE FACE AVANT</span></div>
  </header>

  <div class="main" id="main">
    <div class="fig">
      <svg class="conn" id="conn" viewBox="0 0 600 600" role="img" aria-label="Face avant du connecteur, une broche par outil"></svg>
      <div class="tester" id="tester" aria-live="polite">
        <div class="t-hd"><span>Banc de test · continuité</span><i class="t-led"></i></div>
        <div class="lcd"><span class="k">BROCHE</span><b id="tPin">—</b><span class="k">R</span><b id="tOhm">--,-- Ω</b>
          <span class="k">OUTIL</span><b id="tTool">—</b><span class="k">ÉTAT</span><b id="tState">ATTENTE</b></div>
      </div>
    </div>
    <section class="pinout" aria-label="Brochage">
      <div class="po-hd"><h2>Brochage</h2><span>BROCHE · OUTIL · FONCTION</span></div>
      <div id="groups"></div>
    </section>
    <svg class="probe" id="probe" aria-hidden="true"></svg>
  </div>

  <section class="news" id="news"></section>
  <div class="foot">Maquette 3/5 « Connecteur » · liens à compléter</div>
</div>

<script>
const HUB=/*__HUB__*/null, ICONS=/*__ICONS__*/null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS="http://www.w3.org/2000/svg";

$("#site").textContent=HUB.site;
$("#title").innerHTML=esc(HUB.title)+' <span>'+esc(HUB.subtitle)+'</span>';

// contact letters skip I and O, as on circular connectors
const LET="ABCDEFGHJKLMNPRSTUVWXYZ".split("");
const items=[], secOf={};
HUB.sections.forEach(s=>s.items.forEach(it=>{items.push(it); secOf[it.id]=s;}));
items.forEach((it,i)=>it.pin=LET[i]);
$("#nb").textContent=items.length+" CONTACTS";

// insert layout: the outer ring takes every section but the last one, the last section sits in the centre
const last=HUB.sections[HUB.sections.length-1];
const outer=items.filter(it=>secOf[it.id]!==last), inner=items.filter(it=>secOf[it.id]===last);
const CX=300, CY=300, RO=126, RI=50, pos={};
outer.forEach((it,i)=>{const a=(-90+180/outer.length+i*360/outer.length)*Math.PI/180; pos[it.id]={x:CX+RO*Math.cos(a),y:CY+RO*Math.sin(a),a};});
inner.forEach((it,i)=>{const a=(180+i*360/inner.length)*Math.PI/180; pos[it.id]={x:CX+RI*Math.cos(a),y:CY+RI*Math.sin(a),a,inner:true};});

function draw(){
  let g='<defs>'
    +'<linearGradient id="flange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a323c"/><stop offset=".5" stop-color="#1b2128"/><stop offset="1" stop-color="#12161b"/></linearGradient>'
    +'<radialGradient id="screw" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#e5ebf0"/><stop offset=".55" stop-color="#8b96a1"/><stop offset="1" stop-color="#3b444d"/></radialGradient>'
    +'<linearGradient id="nut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4550"/><stop offset="1" stop-color="#171c22"/></linearGradient>'
    +'<linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5ced7"/><stop offset=".45" stop-color="#7d8995"/><stop offset="1" stop-color="#39424c"/></linearGradient>'
    +'<radialGradient id="insert" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#232a33"/><stop offset="1" stop-color="#11151a"/></radialGradient>'
    +'<radialGradient id="gold" cx=".36" cy=".3" r=".75"><stop offset="0" stop-color="#fff5cf"/><stop offset=".42" stop-color="#e9bf5a"/><stop offset="1" stop-color="#8a6116"/></radialGradient>'
    +'<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    +'</defs>';
  g+='<rect x="30" y="30" width="540" height="540" rx="46" fill="url(#flange)" stroke="#39434f" stroke-width="1.5"/>'
    +'<rect x="38" y="38" width="524" height="524" rx="40" fill="none" stroke="rgba(255,255,255,.05)"/>';
  [[92,92,18],[508,92,64],[92,508,-30],[508,508,8]].forEach(([x,y,r])=>{
    g+='<circle cx="'+x+'" cy="'+y+'" r="23" fill="#0b0e12"/><circle cx="'+x+'" cy="'+y+'" r="17" fill="url(#screw)" stroke="#20262d"/>'
      +'<g transform="rotate('+r+' '+x+' '+y+')" stroke="#3a434c" stroke-width="3" stroke-linecap="round"><path d="M'+(x-8)+' '+y+'H'+(x+8)+'M'+x+' '+(y-8)+'V'+(y+8)+'"/></g>';
  });
  g+='<circle cx="300" cy="300" r="246" fill="url(#nut)" stroke="#0b0e12" stroke-width="2"/>';
  for(let i=0;i<180;i++){const a=i*2*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    g+='<path d="M'+(300+236*c).toFixed(1)+' '+(300+236*s).toFixed(1)+'L'+(300+245*c).toFixed(1)+' '+(300+245*s).toFixed(1)+'" stroke="rgba(255,255,255,.09)" stroke-width="1.2"/>';}
  g+='<circle cx="300" cy="300" r="226" fill="#0d1014"/>'
    +'<circle cx="300" cy="300" r="214" fill="url(#shell)"/>'
    +'<circle cx="300" cy="300" r="196" fill="#0c0f13"/>';
  [[0,26],[105,14],[140,14],[215,14],[250,14]].forEach(([deg,w])=>{   // master key on top, then the minor keys
    g+='<rect x="'+(300-w/2)+'" y="'+(300-198)+'" width="'+w+'" height="16" rx="2" fill="#7d8995" transform="rotate('+deg+' 300 300)"/>';
  });
  g+='<circle cx="300" cy="300" r="184" fill="url(#insert)" stroke="rgba(255,255,255,.06)"/>';
  // section bands printed on the insert
  HUB.sections.forEach(s=>{
    if(s===last){g+='<circle cx="300" cy="300" r="84" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-dasharray="6 7" opacity=".45"/>';return;}
    const a=s.items.map(it=>pos[it.id].a), a0=Math.min(...a)-0.26, a1=Math.max(...a)+0.26, R=176;
    g+='<path class="arc" stroke="'+s.color+'" d="M'+(300+R*Math.cos(a0)).toFixed(1)+' '+(300+R*Math.sin(a0)).toFixed(1)
      +'A'+R+' '+R+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+(300+R*Math.cos(a1)).toFixed(1)+' '+(300+R*Math.sin(a1)).toFixed(1)+'"/>';
  });
  items.forEach(it=>{
    const p=pos[it.id], c=secOf[it.id].color;
    const lx=p.inner?p.x:CX+(RO+33)*Math.cos(p.a), ly=p.inner?p.y+36:CY+(RO+33)*Math.sin(p.a);
    g+='<a href="'+esc(it.url)+'" data-id="'+it.id+'" style="--c:'+c+'"><title>'+it.pin+' · '+esc(it.name)+' : '+esc(it.desc)+'</title>'
      +'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="22" fill="#090b0e" stroke="rgba(255,255,255,.06)"/>'
      +'<circle class="ring" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="15"/>'
      +'<circle class="halo" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="17" filter="url(#glow)"/>'
      +'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="11.5" fill="url(#gold)"/>'
      +'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.4" fill="#6b4c12" opacity=".7"/>'
      +'<text class="pinlbl" x="'+lx.toFixed(1)+'" y="'+(ly+5.5).toFixed(1)+'" text-anchor="middle">'+it.pin+'</text></a>';
  });
  $("#conn").innerHTML=g;
}
draw();

// pinout table
$("#groups").innerHTML=HUB.sections.map(s=>{
  const p=s.items.map(it=>it.pin);
  return '<div class="grp" style="--c:'+s.color+'"><div class="g-hd"><i></i>'+esc(s.name)+'<em>'+p[0]+(p.length>1?'–'+p[p.length-1]:'')+'</em></div>'
    +s.items.map(it=>'<a class="row" href="'+esc(it.url)+'" data-id="'+it.id+'"><span class="pin">'+it.pin+'</span>'
      +'<span class="txt"><b>'+esc(it.name)+'</b><em>'+esc(it.desc)+'</em></span>'
      +(it.new?'<span class="tg new">Nouveau</span>':it.tag?'<span class="tg">'+esc(it.tag)+'</span>':'<span class="tg-x"></span>')
      +'<svg class="arr" viewBox="0 0 24 24" aria-hidden="true">'+ICONS.arrow+'</svg></a>').join("")+'</div>';
}).join("");

$("#news").innerHTML='<h3>Nouveautés</h3>'+HUB.news.map(x=>'<article><time>'+esc(x.date)+'</time><span>'+esc(x.text)+'</span></article>').join("");

// probing a contact: highlight the pin and the row, draw the test lead, fill the tester
const main=$("#main"), probe=$("#probe"), conn=$("#conn");
let cur=null;
function ohm(id){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%997;return (0.01+h%5*0.01).toFixed(2).replace(".",",");}
function setProbe(id){
  if(cur===id) return; cur=id;
  document.querySelectorAll(".on").forEach(e=>e.classList.remove("on"));
  probe.innerHTML="";
  if(!id){ $("#tPin").textContent="—"; $("#tTool").textContent="—"; $("#tOhm").textContent="--,-- Ω"; $("#tState").textContent="ATTENTE"; return; }
  const it=items.find(x=>x.id===id), c=secOf[id].color;
  const pinEl=conn.querySelector('a[data-id="'+id+'"]'), row=document.querySelector('.row[data-id="'+id+'"]');
  pinEl.classList.add("on"); row.classList.add("on"); $("#tester").classList.add("on");
  $("#tPin").textContent=it.pin; $("#tTool").textContent=it.name.toUpperCase(); $("#tOhm").textContent=ohm(id)+" Ω"; $("#tState").textContent="CONTINUITÉ OK";
  if(matchMedia("(max-width:1099px)").matches) return;
  const m=main.getBoundingClientRect(), s=conn.getBoundingClientRect(), r=row.getBoundingClientRect(), k=s.width/600, p=pos[id];
  const x0=s.left-m.left+p.x*k, y0=s.top-m.top+p.y*k, x1=r.left-m.left-2, y1=r.top-m.top+r.height/2;
  const dx=Math.max(80,(x1-x0)*.55);
  const d="M"+x0+","+y0+" C"+(x0+dx)+","+y0+" "+(x1-dx)+","+y1+" "+x1+","+y1;
  probe.style.setProperty("--c",c);
  probe.innerHTML='<path class="lead-sh" d="'+d+'"/><path class="lead" d="'+d+'"/><path class="flow" d="'+d+'"/>'
    +'<circle cx="'+x0+'" cy="'+y0+'" r="5" fill="'+c+'"/><circle cx="'+x1+'" cy="'+y1+'" r="4" fill="'+c+'"/>';
}
function clearSoon(){ setProbe(null); $("#tester").classList.remove("on"); }
main.addEventListener("pointerover",e=>{const t=e.target.closest("[data-id]"); if(t) setProbe(t.dataset.id);});
main.addEventListener("pointerout",e=>{const t=e.target.closest("[data-id]"); if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget))) clearSoon();});
main.addEventListener("focusin",e=>{const t=e.target.closest("[data-id]"); if(t) setProbe(t.dataset.id);});
main.addEventListener("focusout",()=>clearSoon());
addEventListener("resize",()=>{const id=cur; cur=null; if(id) setProbe(id);});
</script>
</body>
</html>
