<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pôle Élec Hub · Planche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Template 1 "Planche": the hub drawn as a harness on its formboard. Deliberately dark only. */
:root{
  --board:#0c131b; --hole:#1a2633; --print:#2a3a4c; --print-text:#566b82;
  --panel:#111b26; --panel-2:#15212e; --edge:#223244; --edge-hi:#30465d;
  --text:#e8eef5; --muted:#97a8bc; --faint:#64778d;
  --sleeve:#efeadb; --sleeve-ink:#16181b; --new:#d6f36a; --new-ink:#18220a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--board);color:var(--text);
  font:15px/1.45 "Barlow","Bahnschrift","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 12px 12px,var(--hole) 1.5px,transparent 2.1px),
    radial-gradient(1100px 520px at 72% -8%,rgba(60,110,160,.16),transparent 70%),
    radial-gradient(900px 600px at 0% 100%,rgba(0,0,0,.35),transparent 70%);
  background-size:24px 24px,auto,auto;
}
.wrap{max-width:1680px;margin:0 auto;padding-block:22px 26px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));overflow-x:clip}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:8px}
.eyebrow{font:500 12px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{margin:8px 0 4px;font:700 46px/1 "Barlow Condensed","Bahnschrift Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;font-weight:500;color:var(--muted);margin-left:10px}
.lead{margin:0;color:var(--muted);max-width:60ch}
.idtag{position:relative;margin-right:40px;isolation:isolate}
.idtag::before{content:"";position:absolute;left:-90px;right:-64px;top:50%;height:9px;margin-top:-4.5px;border-radius:5px;z-index:-1;
  background:linear-gradient(180deg,#7fa3cc 0%,#3f6894 55%,#2a4a70 100%);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.idtag span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 18px;border-radius:6px;
  background:linear-gradient(180deg,#fdfaf2 0%,var(--sleeve) 42%,#cdc6b2 100%);color:var(--sleeve-ink);
  font:500 12px/1.2 "JetBrains Mono",Consolas,monospace;letter-spacing:.08em;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 8px 18px rgba(0,0,0,.5)}
.idtag b{font-weight:600;font-size:14px}

/* board: rail + four branches; the wires are drawn by script over this grid */
.board{position:relative;display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));
  grid-template-areas:"rail s1 s2 s3 s4" "rail s1 s2 nw nw";grid-template-rows:auto 1fr;column-gap:26px;row-gap:18px;padding:150px 0 8px}
.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rail{grid-area:rail}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:22px;height:5px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.5)}

.sec{padding-left:58px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec h2{display:flex;align-items:center;gap:9px;height:24px;margin:0;font:600 13px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec h2 b{font:600 11px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.06em;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:3px;padding:4px 5px}

.tile{position:relative;display:flex;flex-direction:column;gap:8px;min-height:122px;padding:14px 16px 12px;border-radius:8px;color:inherit;text-decoration:none;
  background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge);
  transition:border-color .2s,box-shadow .25s,background .25s}
.tile:hover,.tile:focus-visible,.tile.on{outline:none;border-color:color-mix(in srgb,var(--w) 75%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--w) 9%,var(--panel-2)),var(--panel));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--w) 35%,transparent),0 14px 34px -14px color-mix(in srgb,var(--w) 70%,transparent)}
.t-head{display:flex;align-items:center;gap:11px;min-width:0}
.ib{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:7px;color:var(--w);
  background:color-mix(in srgb,var(--w) 12%,transparent);border:1px solid color-mix(in srgb,var(--w) 35%,transparent)}
.ic{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t-name{font:600 19.5px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase;min-width:0}
.badge{position:absolute;top:-9px;right:14px;font:600 10px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;background:linear-gradient(180deg,#fdfaf2,var(--sleeve) 45%,#cdc6b2);color:var(--sleeve-ink);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.badge.new{background:linear-gradient(180deg,#eefcb0,var(--new) 45%,#a9c94a);color:var(--new-ink)}
.t-desc{color:var(--muted);font-size:14.5px;line-height:1.35}
.t-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 11px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.04em;color:var(--faint)}
.wid{display:flex;align-items:center;gap:7px}
.led{width:7px;height:7px;border-radius:50%;background:#26323e;box-shadow:inset 0 1px 1px rgba(0,0,0,.7);transition:background .2s,box-shadow .2s}
.tile:hover .led,.tile:focus-visible .led,.tile.on .led{background:var(--w);box-shadow:0 0 0 2px color-mix(in srgb,var(--w) 25%,transparent),0 0 10px var(--w)}
.go{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:"Barlow","Segoe UI",sans-serif;font-size:13px;letter-spacing:.02em;transition:color .2s}
.go .ic{width:15px;height:15px;transition:transform .2s}
.tile:hover .go,.tile:focus-visible .go{color:var(--w)}
.tile:hover .go .ic,.tile:focus-visible .go .ic{transform:translateX(3px)}

.news{grid-area:nw;align-self:start;margin-left:58px;padding:14px 18px 16px;border-radius:8px;border:1px dashed var(--edge-hi);background:rgba(10,16,23,.55)}
.news h3{margin:0 0 10px;font:600 13px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.news ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.news li{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:14px;line-height:1.35}
.news time{font:500 11.5px/1.6 "JetBrains Mono",Consolas,monospace;color:var(--faint)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;padding-top:12px;border-top:1px solid var(--edge);font:500 11.5px/1.4 "JetBrains Mono",Consolas,monospace;color:var(--faint);letter-spacing:.03em}

/* svg parts */
.wire path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire .sh{stroke:rgba(0,0,0,.62);stroke-width:6.8}
.wire .cu{stroke:var(--w);stroke-width:4.6;transition:stroke .2s}
.wire .tr{stroke:var(--s);stroke-width:1.4;stroke-dasharray:5 9;opacity:.85}
.wire .hl{stroke:rgba(255,255,255,.3);stroke-width:1}
.wire .flow{stroke:#fff;stroke-width:2.6;stroke-dasharray:1.5 15;opacity:0;filter:url(#glow)}
.wire .collar{fill:var(--w)}
.wires.live .wire:not(.on){opacity:.32}
.wire{transition:opacity .25s}
.wire.on .flow,.wires.boot .flow{opacity:1;animation:flow .65s linear infinite}
.wire.on .cu{stroke:color-mix(in srgb,var(--w) 78%,#fff)}
@keyframes flow{to{stroke-dashoffset:-16.5}}
.print{stroke:var(--print);fill:none;stroke-width:1}
.print-t{fill:var(--print-text);font:500 10px "JetBrains Mono",Consolas,monospace;letter-spacing:.05em}
.lbl-t{fill:var(--sleeve-ink);font:600 9.5px "JetBrains Mono",Consolas,monospace;letter-spacing:.08em}
.j1-t{fill:var(--text);font:600 13px "JetBrains Mono",Consolas,monospace;letter-spacing:.08em}
.j1-s{fill:var(--faint);font:500 10px "JetBrains Mono",Consolas,monospace;letter-spacing:.12em}

@media (prefers-reduced-motion:reduce){
  .wire.on .flow,.wires.boot .flow{animation:none;stroke-dasharray:none;opacity:.55}
  .wires.boot .flow{opacity:0}
}

/* narrow screens: no drawn trunk, each branch becomes a simple bus on the left */
@media (max-width:1199px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-areas:"s1" "s2" "s3" "s4" "nw";grid-template-rows:none;row-gap:28px;padding-top:18px}
  .rail,.wires{display:none}
  .sec{position:relative;padding-left:30px}
  .sec::before{content:"";position:absolute;left:8px;top:12px;bottom:58px;width:5px;border-radius:3px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .tile::before{content:"";position:absolute;left:-23px;top:30px;width:23px;height:5px;border-radius:0 3px 3px 0;background:var(--w);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .news{margin-left:0}
  h1{font-size:38px}
  .idtag{margin-right:0}
}
@media (max-width:520px){
  h1 em{display:block;margin:6px 0 0}
  .news li{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="site"></div>
      <h1 id="title"></h1>
      <p class="lead">Planche de câblage des outils qualité : chaque fil part du connecteur Skywise et arrive sur un outil.</p>
    </div>
    <div class="idtag" aria-label="Repère de la planche"><span><b id="dwg"></b><em id="rev" style="font-style:normal"></em></span></div>
  </header>

  <main class="board" id="board">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="rail" aria-hidden="true"></div>
  </main>

  <footer class="foot">
    <span class="legend" id="legend"></span>
    <span>Survolez un outil : son fil se met sous tension.</span>
    <span>Maquette 1/5 « Planche » · liens à compléter</span>
  </footer>
</div>

<script>
const HUB={"title":"Pôle Élec","subtitle":"Quality Hub","site":"FTO2 · OLME · Toulouse","drawing":"QH-FTO2-001","revision":"C","updated":"20/10/2026","sections":[{"id":"prod","code":"PROD","name":"Production & suivi","color":"#f2a33a","items":[{"id":"pps","name":"PPS","desc":"Practical Problem Solving","icon":"target","wire":"#f2a33a","url":"#"},{"id":"serie","name":"Serie Follow-up","desc":"Suivi de la série","icon":"follow","wire":"#f4d35e","stripe":"#1b1d20","url":"#"},{"id":"fod","name":"FOD","desc":"Foreign Object Debris","icon":"fod","wire":"#e8743b","stripe":"#ffffff","url":"#"}]},{"id":"nc","code":"NC","name":"Non-conformités","color":"#ef5350","items":[{"id":"ncw","name":"NC Writing","desc":"Rédiger une NC · standard DEFAUTS v1","icon":"pen","wire":"#ef5350","url":"#"},{"id":"ncd","name":"NC Dashboard","desc":"Pareto des défauts · 9 catégories","icon":"pareto","wire":"#ec5f9b","stripe":"#ffffff","tag":"v4.8","url":"#"},{"id":"alert","name":"Alert Quality","desc":"Alertes qualité","icon":"alert","wire":"#a77bf3","alert":true,"url":"#"}]},{"id":"cnq","code":"CNQ","name":"Coût de non-qualité","color":"#3ec27f","items":[{"id":"cnqd","name":"CNQ Dashboard","desc":"Coût des NC sur 3 niveaux","icon":"euro","wire":"#3ec27f","new":true,"url":"#"},{"id":"cnqc","name":"CNQ Checklist","desc":"Vérifications à mener","icon":"check","wire":"#9bd64b","stripe":"#1b1d20","new":true,"url":"#"}]},{"id":"qa","code":"QA","name":"Assurance qualité","color":"#4a90f7","items":[{"id":"qcm","name":"QCM","desc":"NC Eradication","icon":"quiz","wire":"#4a90f7","url":"#"},{"id":"qam","name":"QA Management","desc":"Gestion QA","icon":"stamp","wire":"#36c2d6","stripe":"#ffffff","url":"#"}]}],"news":[{"date":"20/10/2026","text":"Nouveau hub Pôle Élec : tous les outils qualité au même endroit."},{"date":"19/10/2026","text":"Coût de non-qualité : modèle mis à jour (cnq-2026.10.19) et checklist d'investigation."},{"date":"07/10/2026","text":"Pareto des défauts v4.8 : 9 catégories validées."}],"docs":[{"name":"Standard de rédaction DEFAUTS v1","url":"#"},{"name":"Taxonomie Pareto v4.8","url":"#"},{"name":"Modèle CNQ : changements du 19/10","url":"#"}]}, ICONS={"target":"<circle cx=\"12\" cy=\"12\" r=\"8.5\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><circle cx=\"12\" cy=\"12\" r=\"1\" fill=\"currentColor\"/>","follow":"<path d=\"M3.5 3.5v17h17\"/><path d=\"M7 15.5l4-4.5 3 2.5 5.5-6.5\"/><circle cx=\"19.5\" cy=\"7\" r=\"1.2\"/>","fod":"<path d=\"M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z\"/><circle cx=\"12\" cy=\"12\" r=\"3.3\"/>","pen":"<path d=\"M4 20h4.2L19.4 8.8a2 2 0 0 0 0-2.8l-1.4-1.4a2 2 0 0 0-2.8 0L4 15.8z\"/><path d=\"M13.6 6.2l4.2 4.2\"/>","pareto":"<path d=\"M4 20.5V9h3.6v11.5M10.2 20.5V13h3.6v7.5M16.4 20.5V16.5H20v4\"/><path d=\"M3.5 6.5C9 6 13.5 4.6 20.5 3.5\"/>","alert":"<path d=\"M10.3 4.2L2.6 17.6A2 2 0 0 0 4.3 20.6h15.4a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9.5v4.5\"/><path d=\"M12 17.2v.3\"/>","euro":"<path d=\"M17.5 6.6A7.2 7.2 0 1 0 17.5 17.4\"/><path d=\"M4 10.2h9.5M4 13.8h9.5\"/>","check":"<rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2.8h6V4\"/><path d=\"M8.8 12.6l2.2 2.2 4.4-4.6\"/>","quiz":"<rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"/><path d=\"M7.5 8.2l1.5 1.5 2.6-2.8M13.8 8.6h3M7.5 14.6l1.5 1.5 2.6-2.8M13.8 15h3\"/>","stamp":"<path d=\"M10 3.2h4a1.2 1.2 0 0 1 1.2 1.2v2.4c0 1.8-1.3 2.6-1.3 4.6h-3.8c0-2-1.3-2.8-1.3-4.6V4.4A1.2 1.2 0 0 1 10 3.2z\"/><path d=\"M4.5 12.8h15v4h-15z\"/><path d=\"M6.5 20.3h11\"/>","doc":"<path d=\"M6 2.8h8l4.5 4.5v13.9H6z\"/><path d=\"M14 2.8v4.5h4.5M9 12h6M9 15.5h6\"/>","search":"<circle cx=\"10.8\" cy=\"10.8\" r=\"6.3\"/><path d=\"M15.4 15.4l5 5\"/>","arrow":"<path d=\"M5 12h13M13 6.5l5.5 5.5-5.5 5.5\"/>"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon=k=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||"")+'</svg>';

$("#site").textContent=HUB.site;
$("#title").innerHTML=esc(HUB.title)+"<em>"+esc(HUB.subtitle)+"</em>";
$("#dwg").textContent=HUB.drawing;
$("#rev").textContent="RÉV "+HUB.revision+" · "+HUB.updated;

const board=$("#board"), svg=$("#wires");
let n=0;
HUB.sections.forEach((s,si)=>{
  const sec=document.createElement("section");
  sec.className="sec"; sec.style.gridArea="s"+(si+1); sec.style.setProperty("--c",s.color);
  sec.innerHTML='<h2><b>D'+(si+1)+'</b>'+esc(s.name)+'</h2>'+s.items.map(it=>{
    n++;
    const tag=it.new?'<span class="badge new">Nouveau</span>':it.tag?'<span class="badge">'+esc(it.tag)+'</span>':"";
    return '<a class="tile" href="'+esc(it.url)+'" data-id="'+it.id+'" style="--w:'+it.wire+'">'
      +'<span class="t-head"><span class="ib">'+icon(it.icon)+'</span><span class="t-name">'+esc(it.name)+'</span>'+tag+'</span>'
      +'<span class="t-desc">'+esc(it.desc)+'</span>'
      +'<span class="t-foot"><span class="wid"><i class="led"></i>W'+String(n).padStart(2,"0")+' · AWG '+(n%3?22:24)+'</span><span class="go">Ouvrir '+icon("arrow")+'</span></span></a>';
  }).join("");
  board.appendChild(sec);
});
const news=document.createElement("aside");
news.className="news";
news.innerHTML='<h3>Nouveautés</h3><ol>'+HUB.news.map(x=>'<li><time>'+esc(x.date)+'</time><span>'+esc(x.text)+'</span></li>').join("")+'</ol>';
board.appendChild(news);
$("#legend").innerHTML="Code couleur"+HUB.sections.map(s=>'<span style="--c:'+s.color+'"><i></i>'+esc(s.name)+'</span>').join("");

// ---- wiring ----------------------------------------------------------------
const GAP=6.4, R0=16, RT=10, TOP=58, X0=124;          // lane spacing, inner bend radius, tile bend, first lane y, wire start x
const items=HUB.sections.flatMap(s=>s.items);
const byId=Object.fromEntries(items.map(it=>[it.id,it]));

function route(){
  if(matchMedia("(max-width:1199px)").matches){svg.innerHTML="";return;}
  const b=board.getBoundingClientRect(), W=board.clientWidth, H=board.clientHeight;
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const N=items.length, laneY=L=>TOP+L*GAP, yc=laneY((N-1)/2);
  let lane=N-1, out=[], deco=[], breaks=[];
  const secs=[...board.querySelectorAll(".sec")];
  secs.forEach((sec,si)=>{
    const tiles=[...sec.querySelectorAll(".tile")], k=tiles.length;
    const sx=sec.getBoundingClientRect().left-b.left;
    const xs=sx+12, yS=laneY(lane), cx=xs-R0, cy=yS+R0;
    breaks.push({cx,cy,xs,k,yS,top:laneY(lane-k+1),bottom:yS,sec:HUB.sections[si]});
    tiles.forEach((t,ti)=>{
      const j=k-1-ti, r=t.getBoundingClientRect();
      const ty=r.top-b.top+33, tx=r.left-b.left;
      const y=yS-j*GAP, x=xs+j*GAP, rr=R0+j*GAP;
      const d="M"+X0+","+y+" H"+cx+" A"+rr+","+rr+" 0 0 1 "+x+","+cy+" V"+(ty-RT)+" A"+RT+","+RT+" 0 0 0 "+(x+RT)+","+ty+" H"+(tx-17);
      out.push({it:byId[t.dataset.id],d,tx,ty});
    });
    lane-=k;
  });
  const bottomAt=x=>{let L=-1;breaks.forEach(br=>{if(br.cx>x)L=Math.max(L,(br.bottom-TOP)/GAP);});return laneY(L);};

  // printed drawing: dimension chain above the trunk, ruler on the rail
  let p='<g class="print-g">';
  const dimY=TOP-30; let px=X0;
  p+='<path class="print" d="M'+X0+','+(dimY-6)+' V'+(dimY+6)+'"/>';
  breaks.forEach(br=>{
    p+='<path class="print" d="M'+px+','+dimY+' H'+br.cx+' M'+br.cx+','+(dimY-6)+' V'+(dimY+6)+'"/>';
    p+='<text class="print-t" x="'+((px+br.cx)/2)+'" y="'+(dimY-5)+'" text-anchor="middle">'+(Math.round((br.cx-px)*1.5/5)*5)+'</text>';
    px=br.cx;
  });
  const rx=26, ry0=166, ry1=H-14;
  p+='<path class="print" d="M'+rx+','+ry0+' V'+ry1+'"/>';
  for(let y=ry0,i=0;y<=ry1;y+=10,i++){
    const len=i%10===0?12:i%5===0?8:4;
    p+='<path class="print" d="M'+rx+','+y+' h'+len+'"/>';
    if(i%10===0&&i>0) p+='<text class="print-t" x="'+(rx+16)+'" y="'+(y+3.5)+'">'+(i*15)+'</text>';
  }
  p+='</g>';

  // wires
  let w="";
  out.forEach(o=>{
    const it=o.it;
    w+='<g class="wire" id="w-'+it.id+'" style="--w:'+it.wire+(it.stripe?';--s:'+it.stripe:'')+'">'
      +'<path class="sh" d="'+o.d+'"/><path class="cu" d="'+o.d+'"/>'
      +(it.stripe?'<path class="tr" d="'+o.d+'"/>':'')
      +'<path class="hl" d="'+o.d+'" transform="translate(-.9 -.9)"/>'
      +'<path class="flow" d="'+o.d+'"/>'
      +'<rect class="collar" x="'+(o.tx-19)+'" y="'+(o.ty-5)+'" width="7" height="10" rx="1.5"/>'
      +'<rect x="'+(o.tx-12.5)+'" y="'+(o.ty-3.2)+'" width="13" height="6.4" rx="1" fill="url(#metal)"/>'
      +'</g>';
  });

  // harness furniture: boot, sleeve, tie-wraps, pegs, branch labels
  const top=laneY(0)-5.5;
  breaks.forEach((br,i)=>{
    const rmax=R0+(br.k-1)*GAP;
    deco.push(tie(br.cx-14,top,bottomAt(br.cx-14)+5.5));
    const a=Math.PI/4, pgx=br.cx+(rmax+12)*Math.cos(-a), pgy=br.cy+(rmax+12)*Math.sin(-a);
    deco.push(peg(pgx,pgy));
    const lx0=br.xs-5.5, lx1=br.xs+(br.k-1)*GAP+5.5, ly=br.cy+30;
    deco.push('<rect x="'+lx0+'" y="'+ly+'" width="'+(lx1-lx0)+'" height="40" rx="3" fill="url(#sleeve)"/>'
      +'<text class="lbl-t" transform="translate('+((lx0+lx1)/2+3.4)+','+(ly+20)+') rotate(-90)" text-anchor="middle">D'+(i+1)+'</text>');
    if(i<breaks.length-1){
      const nx=breaks[i+1].cx, mid=(br.cx+rmax+nx)/2;
      if(i===0){
        const s0=br.cx+rmax+26, s1=nx-40, sb=bottomAt(s0)+5.5;
        deco.push('<rect x="'+s0+'" y="'+top+'" width="'+(s1-s0)+'" height="'+(sb-top)+'" rx="5" fill="url(#braid)" opacity=".94"/>'
          +'<rect x="'+(s0-4)+'" y="'+(top-1.5)+'" width="11" height="'+(sb-top+3)+'" rx="3" fill="url(#shrink)"/>'
          +'<rect x="'+(s1-7)+'" y="'+(top-1.5)+'" width="11" height="'+(sb-top+3)+'" rx="3" fill="url(#shrink)"/>');
      } else {
        deco.push(peg(mid,top-8), peg(mid,bottomAt(mid)+13.5), tie(mid+46,top,bottomAt(mid+46)+5.5));
      }
    }
  });

  // J1: coupling nut, body, backshell and boot (side view)
  const jx=X0;
  const j1='<g>'
    +'<rect x="'+(jx-98)+'" y="'+(yc-46)+'" width="34" height="92" rx="5" fill="url(#nut)" stroke="#0a0f14"/>'
    +Array.from({length:10},(_,i)=>'<path d="M'+(jx-94+i*3)+','+(yc-42)+' V'+(yc+42)+'" stroke="rgba(0,0,0,.35)" stroke-width="1"/>').join("")
    +'<rect x="'+(jx-64)+'" y="'+(yc-38)+'" width="30" height="76" rx="3" fill="url(#body)" stroke="#0a0f14"/>'
    +'<path d="M'+(jx-34)+','+(yc-36)+' L'+(jx-6)+','+(yc-34)+' V'+(yc+34)+' L'+(jx-34)+','+(yc+36)+' Z" fill="url(#body)" stroke="#0a0f14"/>'
    +'<rect x="'+(jx-10)+'" y="'+(yc-36)+'" width="34" height="72" rx="8" fill="url(#shrink)"/>'
    +'<text class="j1-t" x="'+(jx-49)+'" y="'+(yc+68)+'" text-anchor="middle">J1</text>'
    +'<text class="j1-s" x="'+(jx-49)+'" y="'+(yc+84)+'" text-anchor="middle">SKYWISE</text>'
    +'</g>';

  svg.innerHTML=DEFS+p+w+deco.join("")+j1;
}
function tie(x,y0,y1){
  return '<g><rect x="'+(x-3.5)+'" y="'+y0+'" width="7" height="'+(y1-y0)+'" rx="2" fill="url(#tie)"/>'
    +'<rect x="'+(x-5.5)+'" y="'+(y0-8)+'" width="11" height="9" rx="2" fill="#1b2026" stroke="#3b444e"/></g>';
}
function peg(x,y){
  return '<g><circle cx="'+x+'" cy="'+y+'" r="5.2" fill="url(#peg)" stroke="#0b1016"/><circle cx="'+x+'" cy="'+y+'" r="1.6" fill="#2a323b"/></g>';
}
const DEFS='<defs>'
  +'<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
  +'<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#a7b2bd"/><stop offset="1" stop-color="#5d6975"/></linearGradient>'
  +'<linearGradient id="nut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c8792"/><stop offset=".45" stop-color="#4b5560"/><stop offset="1" stop-color="#262d35"/></linearGradient>'
  +'<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa5b0"/><stop offset=".4" stop-color="#5f6a75"/><stop offset="1" stop-color="#2c333b"/></linearGradient>'
  +'<linearGradient id="shrink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4048"/><stop offset=".3" stop-color="#1c2025"/><stop offset="1" stop-color="#0c0e11"/></linearGradient>'
  +'<linearGradient id="tie" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14181c"/><stop offset=".5" stop-color="#3d4650"/><stop offset="1" stop-color="#14181c"/></linearGradient>'
  +'<linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc8b4"/><stop offset=".45" stop-color="#fbf8ef"/><stop offset="1" stop-color="#bdb59f"/></linearGradient>'
  +'<radialGradient id="peg" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#e3e8ed"/><stop offset=".6" stop-color="#7e8994"/><stop offset="1" stop-color="#3a434c"/></radialGradient>'
  +'<pattern id="braid" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#11161b"/>'
  +'<path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#46515d" stroke-width="2"/><path d="M0,0 L7,7 M-1,6 L1,8 M6,-1 L8,1" stroke="#2b333c" stroke-width="2"/></pattern>'
  +'</defs>';

// ---- interaction: hovering a tile powers its wire ----------------------------
function power(id,on){
  const g=document.getElementById("w-"+id); if(!g) return;
  g.classList.toggle("on",on); svg.classList.toggle("live",on);
}
board.addEventListener("pointerover",e=>{const t=e.target.closest(".tile"); if(t) power(t.dataset.id,true);});
board.addEventListener("pointerout",e=>{const t=e.target.closest(".tile"); if(t&&!t.contains(e.relatedTarget)) power(t.dataset.id,false);});
board.addEventListener("focusin",e=>{const t=e.target.closest(".tile"); if(t) power(t.dataset.id,true);});
board.addEventListener("focusout",e=>{const t=e.target.closest(".tile"); if(t) power(t.dataset.id,false);});

let tm; addEventListener("resize",()=>{clearTimeout(tm);tm=setTimeout(route,80);});
route();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  route();
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches){svg.classList.add("boot");setTimeout(()=>svg.classList.remove("boot"),1500);}
});
</script>
</body>
</html>
