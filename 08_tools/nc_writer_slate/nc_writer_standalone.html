<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC FTO2 · Saisie</title>
<style>
/* NC FTO2 · Saisie structurée: CSS tab of the Slate Code Sandbox widget.
   Laid out for a 1316 px wide widget: steps on the left, live SAP text on the right. */
html, body { margin: 0; background: #f3f5f9; }
.ncw {
  --canvas: #f3f5f9; --card: #ffffff; --ink: #14213d; --ink-2: #3b4a63; --muted: #6b7a90;
  --line: #e3e8ef; --line-2: #cfd7e3; --hover: #f6f8fb;
  --navy: #00205b; --navy-2: #0b2f73; --on-navy-muted: #a9b8d6;
  --accent: #0a5cd6; --accent-hover: #084bb0; --accent-soft: #e8f0fd; --accent-line: #b9d0f6;
  --maj: #b42318; --maj-bg: #fdecea; --maj-line: #f5c2bc;
  --min: #8a5300; --min-bg: #fff4e0; --min-line: #f3d29b;
  --cdve: #5b3cc4; --cdve-bg: #f0ebfd;
  --ok: #157347; --ok-bg: #e6f4ec; --warn-bg: #fff6d6; --warn-ink: #6b4e00;
  --code-bg: #0f1d33; --code-ink: #dce6f5;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .08);
  --mono: Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  box-sizing: border-box;
  width: 100%; max-width: 1316px; min-height: 100vh; margin: 0 auto; padding: 20px 24px 32px;
  background: var(--canvas); color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif;
  font-size: 14px; line-height: 1.5;
  font-variant-ligatures: none; /* "<->" stays three characters, as it will be in SAP */
}
.ncw *, .ncw *::before, .ncw *::after { box-sizing: inherit; }
.ncw h1, .ncw h2, .ncw h3, .ncw p, .ncw dl, .ncw dd, .ncw ol, .ncw ul { margin: 0; }
.ncw button { font: inherit; color: inherit; }
.ncw svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ncw .muted { color: var(--muted); }
.ncw .small { font-size: 12px; }

/* top bar */
.ncw .top {
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  background: var(--navy); color: #fff; border-radius: 12px; padding: 16px 22px; margin-bottom: 20px;
}
.ncw .brand { display: flex; align-items: center; gap: 14px; }
.ncw .logo {
  width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  background: rgba(255, 255, 255, .12); font-weight: 700; letter-spacing: .04em;
}
.ncw .top h1 { font-size: 18px; font-weight: 600; line-height: 1.3; }
.ncw .top p { color: var(--on-navy-muted); font-size: 13px; }
.ncw .ident { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ncw .id { background: rgba(255, 255, 255, .1); border-radius: 8px; padding: 5px 12px; line-height: 1.25; }
.ncw .id span { display: block; font-size: 11px; color: var(--on-navy-muted); text-transform: uppercase; letter-spacing: .06em; }
.ncw .id b { font-weight: 600; }

/* two columns */
.ncw .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.ncw .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ncw .side { position: sticky; top: 16px; }

/* cards */
.ncw .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; box-shadow: var(--shadow); }
.ncw .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.ncw .card-head h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ncw .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.ncw .card-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.ncw .head-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.ncw .opt { font-size: 11px; font-weight: 500; color: var(--muted); background: var(--canvas); border-radius: 999px; padding: 1px 8px; }
.ncw .count { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; }
.ncw .tag { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }

/* form */
.ncw .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ncw .field { display: block; margin-bottom: 16px; min-width: 0; }
.ncw .label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.ncw .counter { margin-left: auto; font-weight: 500; color: var(--muted); }
.ncw input[type="text"], .ncw input[type="search"], .ncw input[type="number"], .ncw select, .ncw textarea {
  display: block; width: 100%; font: inherit; font-variant-ligatures: none; color: var(--ink); background: var(--card);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 12px; min-height: 40px;
  transition: border-color .15s, box-shadow .15s;
}
.ncw textarea { resize: vertical; min-height: 64px; margin-top: 12px; }
.ncw .field textarea { margin-top: 0; }
.ncw .big { min-height: 44px; font-size: 15px; }
.ncw .under { margin-top: 8px; }
.ncw .narrow { max-width: 320px; }
.ncw .qty { max-width: 160px; }
.ncw input:hover, .ncw select:hover, .ncw textarea:hover { border-color: #b3bfd0; }
.ncw input:focus, .ncw select:focus, .ncw textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ncw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ncw ::placeholder { color: #9aa6b8; }

/* buttons */
.ncw .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
  font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
}
.ncw .btn.primary { background: var(--accent); color: #fff; }
.ncw .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.ncw .btn.secondary { background: var(--card); border-color: var(--line-2); color: var(--ink); }
.ncw .btn.secondary:hover:not(:disabled) { background: var(--hover); }
.ncw .btn.ghost { background: transparent; color: var(--accent); }
.ncw .btn.ghost:hover:not(:disabled) { background: var(--accent-soft); }
.ncw .btn.on-dark { background: rgba(255, 255, 255, .14); color: #fff; }
.ncw .btn.on-dark:hover { background: rgba(255, 255, 255, .24); }
.ncw .btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.ncw .btn.block { width: 100%; margin-top: 10px; }
.ncw .btn:disabled { opacity: .45; cursor: not-allowed; }
.ncw .icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; cursor: pointer;
  background: transparent; border: 1px solid transparent; color: var(--muted);
}
.ncw .icon-btn:hover { background: var(--hover); border-color: var(--line); color: var(--accent); }
.ncw .icon-btn.danger:hover { color: var(--maj); background: var(--maj-bg); border-color: var(--maj-line); }

/* chips: templates and detection */
.ncw .chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ncw .chip {
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; text-align: left; line-height: 1.35; transition: all .15s;
}
.ncw .chip:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.ncw .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* codes and badges */
.ncw .code {
  display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--navy);
  background: #e9eef8; border-radius: 6px; padding: 2px 8px; white-space: nowrap;
}
.ncw .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.ncw .badge.maj { background: var(--maj-bg); color: var(--maj); }
.ncw .badge.min { background: var(--min-bg); color: var(--min); }
.ncw .badge.cdve { background: var(--cdve-bg); color: var(--cdve); }

/* defect list */
.ncw .defects { display: flex; flex-direction: column; gap: 10px; }
.ncw .defect { display: flex; gap: 14px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 14px; transition: border-color .15s; }
.ncw .defect:hover { border-color: var(--line-2); }
.ncw .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.ncw .defect-body { flex: 1; min-width: 0; }
.ncw .defect-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ncw .defect-top strong { font-weight: 600; }
.ncw .defect-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
.ncw .meta { font-size: 13px; color: var(--muted); margin-left: 6px; }
.ncw .meta b { color: var(--ink); font-weight: 600; }
.ncw .defect-actions { display: flex; gap: 4px; }
.ncw pre.line {
  margin: 0; padding: 8px 12px; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px;
  font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
}
.ncw pre.line.big { font-size: 13px; padding: 12px 14px; background: var(--accent-soft); border-color: var(--accent-line); color: var(--navy); }
.ncw .empty {
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 28px 16px; color: var(--muted);
}
.ncw .empty svg { width: 28px; height: 28px; color: var(--line-2); margin-bottom: 4px; }
.ncw .empty b { color: var(--ink-2); }
.ncw .empty.small { padding: 20px 16px; }

/* wizard: steps */
.ncw .steps { display: flex; align-items: center; gap: 10px; list-style: none; padding: 0; }
.ncw .steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 13px; }
.ncw .steps li.sep { flex: 0 0 40px; height: 2px; background: var(--line-2); border-radius: 2px; }
.ncw .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--card); border: 1.5px solid var(--line-2); }
.ncw .dot svg { width: 13px; height: 13px; stroke-width: 3; }
.ncw .steps li.cur { color: var(--ink); }
.ncw .steps li.cur .dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.ncw .steps li.done { color: var(--ok); }
.ncw .steps li.done .dot { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }

/* wizard: nature, object, search */
.ncw .search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 14px; margin-bottom: 18px; background: var(--card); transition: border-color .15s, box-shadow .15s; }
.ncw .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ncw .search svg { color: var(--muted); width: 18px; height: 18px; }
.ncw .search input { border: 0; box-shadow: none !important; padding: 10px 0; min-height: 46px; font-size: 15px; }
.ncw .group { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 10px; }
.ncw .group:first-of-type { margin-top: 0; }
.ncw .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ncw .objects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.ncw .tile, .ncw .pick {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.ncw .tile:hover, .ncw .pick:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(10, 92, 214, .12); transform: translateY(-1px); }
.ncw .tile strong, .ncw .pick strong { font-weight: 600; }
.ncw .tile .muted, .ncw .pick .muted { font-size: 13px; line-height: 1.4; }
.ncw .tile-top, .ncw .pick-top { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 2px; }
.ncw .tile-top .small { margin-left: auto; }
.ncw .rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
.ncw .row {
  display: grid; grid-template-columns: 90px minmax(0, 1fr) auto 16px; align-items: center; gap: 14px; text-align: left;
  background: var(--card); border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; cursor: pointer;
}
.ncw .row:last-child { border-bottom: 0; }
.ncw .row:hover { background: var(--accent-soft); }
.ncw .row-main { display: flex; flex-direction: column; min-width: 0; }
.ncw .row-main .muted { font-size: 12.5px; }
.ncw .row > .muted { font-size: 12.5px; text-align: right; }
.ncw .row svg { color: var(--muted); }

/* wizard: detail */
.ncw .switch-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px; cursor: pointer;
  background: var(--cdve-bg); border-radius: 10px;
}
.ncw .switch-row b { display: block; color: var(--cdve); }
.ncw .switch-row small { color: var(--ink-2); font-size: 12.5px; }
.ncw .switch {
  appearance: none; -webkit-appearance: none; width: 40px; height: 22px; border-radius: 999px; background: #c9c2e6;
  position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s;
}
.ncw .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.ncw .switch:checked { background: var(--cdve); }
.ncw .switch:checked::after { transform: translateX(18px); }
.ncw .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 3px; gap: 3px; background: var(--canvas); }
.ncw .seg button { border: 0; background: transparent; border-radius: 6px; padding: 6px 18px; min-height: 32px; font-weight: 600; color: var(--muted); cursor: pointer; }
.ncw .seg button:hover { color: var(--ink); }
.ncw .seg button.min[aria-pressed="true"] { background: var(--card); color: var(--min); box-shadow: 0 0 0 1px var(--min-line), var(--shadow); }
.ncw .seg button.maj[aria-pressed="true"] { background: var(--card); color: var(--maj); box-shadow: 0 0 0 1px var(--maj-line), var(--shadow); }
.ncw .preview { margin-top: 4px; }
.ncw .errors { color: var(--maj); margin: 10px 0 0; padding-left: 20px; font-size: 13px; }
.ncw .errors:empty { display: none; }

/* review and done */
.ncw .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
.ncw .facts > div { background: var(--canvas); border-radius: 8px; padding: 10px 14px; }
.ncw .facts dt { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ncw .facts dd { margin-top: 2px; }
.ncw .recap { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ncw .recap th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.ncw .recap td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ncw .recap tr:last-child td { border-bottom: 0; }
.ncw .recap .r { text-align: right; }
.ncw .done-card { text-align: center; padding: 36px 28px; }
.ncw .done-card h2 { font-size: 20px; margin-bottom: 10px; }
.ncw .done-card .facts { text-align: left; margin: 20px 0 0; }
.ncw .done-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; background: var(--ok-bg); color: var(--ok); }
.ncw .done-icon svg { width: 28px; height: 28px; stroke-width: 2.5; }
.ncw .done-icon.warn-icon { background: var(--warn-bg); color: var(--warn-ink); }
.ncw .ok, .ncw .warn { display: inline-block; border-radius: 8px; padding: 8px 14px; }
.ncw .ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.ncw .warn { background: var(--warn-bg); color: var(--warn-ink); }
.ncw .error { color: var(--maj); background: var(--maj-bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }

/* right panel */
.ncw .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
.ncw .panel h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.ncw .panel h3 svg { color: var(--accent); }
.ncw .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.ncw .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.ncw .stats > div { background: var(--canvas); border-radius: 8px; padding: 8px 10px; }
.ncw .stats b { display: block; font-size: 20px; font-weight: 700; line-height: 1.2; }
.ncw .stats span { font-size: 12px; color: var(--muted); }
.ncw .stats .has-maj b { color: var(--maj); }
.ncw pre.sap {
  margin: 0; padding: 14px 16px; background: var(--code-bg); color: var(--code-ink); border-radius: 10px;
  font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  min-height: 160px; max-height: 460px; overflow: auto;
}
.ncw .note { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 10px; }
.ncw .how { list-style: none; padding: 0; margin-top: 14px; counter-reset: how; display: flex; flex-direction: column; gap: 14px; }
.ncw .how li { counter-increment: how; display: grid; grid-template-columns: 28px 1fr; column-gap: 12px; }
.ncw .how li::before {
  content: counter(how); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px;
}
.ncw .how span { color: var(--muted); font-size: 13px; }

.ncw .toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); background: var(--navy); color: #fff;
  padding: 10px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 500; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; box-shadow: 0 8px 24px rgba(0, 32, 91, .25); z-index: 10;
}
.ncw .toast.show { opacity: 1; transform: translate(-50%, 0); }

/* narrower widget */
@media (max-width: 1000px) {
  .ncw .layout { grid-template-columns: minmax(0, 1fr); }
  .ncw .side { position: static; }
}
@media (max-width: 640px) {
  .ncw { padding: 12px; }
  .ncw .grid2 { grid-template-columns: 1fr; gap: 0; }
  .ncw .card-head { flex-direction: column; }
  .ncw .row { grid-template-columns: 80px minmax(0, 1fr) 16px; }
  .ncw .row > .muted { display: none; }
}
</style>
</head>
<body>
<!-- NC FTO2 · Saisie structurée: HTML tab of the Slate Code Sandbox widget. nc_writer.js draws everything inside. -->
<div id="nc-writer" class="ncw"><p style="padding:16px;font-family:sans-serif">Chargement…</p></div>
<script>
// NC FTO2 · Saisie structurée: the Streamlit app (reference/app_streamlit.py) rebuilt for a Slate
// Code Sandbox widget. Paste this file in the widget's JavaScript tab, nc_writer.css in the CSS tab
// and nc_writer.html in the HTML tab. No library and no network call: the sandbox allows neither.
// Outside Slate (nc_writer_standalone.html) the same code runs and only shows / downloads the NC.
(function (root) {
"use strict";

// What Slate sees on "Soumettre": the widget state gets {submission: row}, then the event fires.
// The Slate event handler reads <widget>.state.submission.<column> and writes the row (README).
// Never type two opening curly braces in this file: Slate would read them as a Handlebars template.
var CONFIG = { stateKey: "submission", eventName: "submit" };

// --- TAXONOMY: the official code sheet, copied from app_streamlit.py (tests/check_parity.py checks it) ---
// <DATA>
var NATURES = [
  { code: "Q01", label: "Verrouillage", hint: "Contact non verrouillé / faux contact", isTest: false, objects: [
    { sub: "Q01-001", label: "Contact", detail: "Cuivre, aluminium, fibre optique", sev: 7, rpn: 245, cdve: "Q01-003" },
    { sub: "Q01-002", label: "Faux contact", detail: "Non verrouillé", sev: 3, rpn: 120, cdve: null }

// --- PURE HELPERS (same output as the Python app) ---

function genLine(seq, sub, qty, loc, objLabel, detail, comment) {
  var bits = [loc ? loc : "-", objLabel];
  if (detail) bits.push(detail);
  if (comment) bits.push(comment);
  var qtyStr = qty > 1 ? " - QTE " + qty : "";
  return "DEF " + seq + " - " + sub + qtyStr + " : " + bits.join(" — ");
}

function defectLine(d, i) {
  return genLine(i + 1, d.sub, d.qty, d.loc, d.objLabel, d.detail, d.comment);
}

function totalQty(defects) {
  return defects.reduce(function (s, d) { return s + d.qty; }, 0);
}

function buildSapText(header, ctxCombo, ctxText, defects, actCombo, actText) {
  var t = "### DEFAUTS v1 | PRODUIT: " + header.produit + " | DETECTION: " + header.detection.toUpperCase() + "\n\n";
  var ctx = (ctxCombo + " " + ctxText).trim();
  if (ctx) t += ctx + "\n\n";
  defects.forEach(function (d, i) { t += defectLine(d, i) + "\n"; });
  var act = (actCombo + " " + actText).trim();
  if (act) t += "\n" + act + "\n";
  return t + "\n### TOTAL: " + totalQty(defects);
}

function autoSeverity(sevNum) { return sevNum >= 8 ? "MAJEURE" : "MINEURE"; }

function findNature(code) {
  for (var i = 0; i < NATURES.length; i++) if (NATURES[i].code === code) return NATURES[i];
  return null;
}

function findObject(nature, sub) {
  for (var i = 0; i < nature.objects.length; i++) if (nature.objects[i].sub === sub) return nature.objects[i];
  return null;
}

// test natures first when the NC was found at test, as in the Python app (stable sort)
function sortedNatures(isTest) {
  return NATURES.map(function (n, i) { return { n: n, i: i }; })
    .sort(function (a, b) { return ((a.n.isTest === isTest ? 0 : 1) - (b.n.isTest === isTest ? 0 : 1)) || a.i - b.i; })
    .map(function (x) { return x.n; });
}

function fold(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

// accents ignored, so "element" finds "Élément"
function searchObjects(query) {
  var q = fold(query.trim());
  if (q.length < 2) return null;
  var hits = [];
  NATURES.forEach(function (n) {
    n.objects.forEach(function (o) {
      if (fold(n.code + " " + n.label + " " + o.label + " " + o.detail + " " + o.sub).indexOf(q) !== -1) hits.push({ n: n, o: o });
    });
  });
  return hits;
}

function suggestedFins(code) {
  var list = (FIN_MAPPING[code] || FIN_GLOBAL_SUGGEST).slice();
  if (list.indexOf("Autre") === -1) list.push("Autre");
  return list;
}

function pad(n) { return (n < 10 ? "0" : "") + n; }

function formatTimestamp(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function newId(d) {
  var stamp = formatTimestamp(d).replace(/\D/g, "");
  return "NCW-" + stamp + "-" + Math.random().toString(36).slice(2, 8).toUpperCase();
}

// one row per NC: the six columns of nc_writer_dataset, plus an id and the defects as JSON
function buildRow(header, ctxCombo, ctxText, defects, actCombo, actText, now) {
  return {
    submission_id: newId(now),
    timestamp: formatTimestamp(now),
    msn: header.msn,
    produit: header.produit,
    detection: header.detection,
    total_defauts: totalQty(defects),
    texte_sap: buildSapText(header, ctxCombo, ctxText, defects, actCombo, actText),
    defauts_json: JSON.stringify(defects.map(function (d, i) {
      return { seq: i + 1, code: d.code, sub: d.sub, cdve: d.cdve, loc: d.loc, objet: d.objLabel, precision: d.detail,
        qte: d.qty, severite: d.sev, sev_num: d.sevNum, complement: d.comment, ligne: defectLine(d, i) };
    }))
  };
}

function csvCell(v) {
  var s = String(v);
  return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function rowToCsv(row) {
  var keys = Object.keys(row);
  return "﻿" + keys.join(";") + "\r\n" + keys.map(function (k) { return csvCell(row[k]); }).join(";") + "\r\n";
}

// --- SLATE BRIDGE: the only place that talks to Slate ---

function slateApi() {
  if (root.SlateFunctions) return root.SlateFunctions;
  /* global SlateFunctions */
  return typeof SlateFunctions !== "undefined" ? SlateFunctions : null;
}

function sendToSlate(row) {
  var sf = slateApi();
  if (!sf) return "standalone";
  if (typeof sf.setState !== "function" || typeof sf.triggerEvent !== "function")
    throw new Error("SlateFunctions.setState / triggerEvent introuvables dans ce widget.");
  var state = {};
  state[CONFIG.stateKey] = row;
  sf.setState(state);
  sf.triggerEvent(CONFIG.eventName);
  return "slate";
}

function go(screen) {
  S.screen = screen;

    var h = S.header;
    S.hd = {
      msn: h.msn,
      produitSel: PRODUITS.indexOf(h.produit) !== -1 ? h.produit : "Autre",

function headerValues() {

    msn: d.msn.trim(),

    detection: (d.detectionSel === "Autre" ? d.detectionCustom : d.detectionSel).trim()

}

function stepper(cur) {
  return '<ol class="steps">' + ["Nature", "Objet", "Détails"].map(function (s, i) {

      "</ol></div></aside>";

    n: n, o: o, sevNum: sevNum, loc: loc, qty: qty, errors: errors,
    sub: f.cdve ? o.cdve : o.sub,
    line: genLine(seq, f.cdve ? o.cdve : o.sub, qty >= 1 ? qty : 1, loc, o.label, f.detail.trim(), f.comment.trim())

    "</div>" +
    '<label class="field"><span class="label">Complément libre <span class="opt">optionnel</span><span class="counter" id="ncw-count">' + f.comment.length + " / " + COMMENT_MAX + "</span></span>" +
    '<textarea rows="2" maxlength="' + COMMENT_MAX + '" data-field="fd.comment">' + esc(f.comment) + "</textarea></label>" +
    '<div class="preview"><span class="label">Ligne générée</span><pre class="line big" id="ncw-preview">' + esc(c.line) + "</pre></div>" +
    '<ul class="errors" id="ncw-errors">' + errorsHtml(c.errors) + "</ul>" +
    '<div class="card-foot">' + btn("cancel-detail", "Annuler", "ghost") + btn("save-defect", ICON.check + "Enregistrer le défaut", "primary", c.errors.length ? " disabled" : "") + "</div></section>";
  return h;
}

function renderReview() {
  var ctx = (S.ctxCombo + " " + S.ctxText).trim(), act = (S.actCombo + " " + S.actText).trim();
  return '<section class="card"><div class="card-head"><div><h2>Vérification</h2>' +
    '<p class="sub">Relisez avant de soumettre. Le texte de droite est exactement celui qui sera envoyé.</p></div></div>' +
    '<dl class="facts"><div><dt>Contexte</dt><dd>' + (ctx ? esc(ctx) : '<span class="muted">—</span>') + "</dd></div>" +
    "<div><dt>Action demandée</dt><dd>" + (act ? esc(act) : '<span class="muted">—</span>') + "</dd></div></dl>" +
    '<table class="recap"><thead><tr><th>#</th><th>Code</th><th>Objet</th><th>FIN / zone</th><th class="r">Qté</th><th>Sévérité</th></tr></thead><tbody>' +
    S.defects.map(function (d, i) {
      return "<tr><td>" + (i + 1) + '</td><td><span class="code">' + esc(d.sub) + "</span></td><td>" + esc(d.objLabel) +
        (d.detail ? '<span class="muted"> · ' + esc(d.detail) + "</span>" : "") + "</td><td>" + esc(d.loc || "—") + '</td><td class="r">' + d.qty +
        "</td><td>" + sevBadge(d.sev) + (d.cdve ? " " + cdveBadge() : "") + "</td></tr>";
    }).join("") + "</tbody></table></section>";
}

function renderDone() {
  var r = S.done.row, slate = S.done.mode === "slate";
  return '<section class="card done-card"><div class="done-icon' + (slate ? "" : " warn-icon") + '">' + (slate ? ICON.check : ICON.doc) + "</div>" +
    (slate ? "<h2>NC soumise</h2><p class=\"ok\">NC transmise à Slate (" + esc(r.submission_id) + ").</p>"
           : "<h2>NC prête</h2><p class=\"warn\">Hors Slate : rien n'a été enregistré. Copiez le texte ou téléchargez la ligne.</p>") +
    '<dl class="facts"><div><dt>MSN</dt><dd>' + esc(r.msn) + "</dd></div><div><dt>Produit</dt><dd>" + esc(r.produit) + "</dd></div>" +
    "<div><dt>Détection</dt><dd>" + esc(r.detection) + "</dd></div><div><dt>Quantité totale</dt><dd>" + r.total_defauts + "</dd></div></dl></section>";
}

function render() {
  var s = S.screen, body;
  if (s === "header") body = renderHeader();
  else if (s === "list") body = renderList();
  else if (s === "nature") body = renderNature();
  else if (s === "object") body = renderObject();
  else if (s === "detail") body = renderDetail();
  else if (s === "review") body = renderReview();
  else body = renderDone();
  app.innerHTML = renderTop() + '<div class="layout"><main class="main">' + body + "</main>" + renderPanel() + "</div>" +
    '<div class="toast" id="ncw-toast" role="status"></div>';
  var first = app.querySelector("[data-field='query'], [data-field='hd.msn']");
  if (first && !first.value) try { first.focus(); } catch (e) { /* focus can be refused in an iframe */ }
}

// partial refreshes, so typing never loses the cursor
function refreshHeaderButton() {
  var b = app.querySelector("[data-act='header-continue']");
  if (b) b.disabled = !headerComplete();
}

function refreshPanel() {
  var pre = app.querySelector("#ncw-sap"), st = app.querySelector("#ncw-stats");
  if (pre && S.screen !== "done") pre.textContent = sapText();
  if (st) st.innerHTML = statsHtml();
}

function refreshDetail() {
  var c = detailContext();
  app.querySelector("#ncw-preview").textContent = c.line;
  app.querySelector("#ncw-count").textContent = S.fd.comment.length + " / " + COMMENT_MAX;
  app.querySelector("#ncw-errors").innerHTML = errorsHtml(c.errors);
  app.querySelector("[data-act='save-defect']").disabled = c.errors.length > 0;
}

function toast(msg) {
  var t = app.querySelector("#ncw-toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "toast show";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { t.className = "toast"; }, 2200);
}

// --- ACTIONS ---

function saveDefect() {
  var c = detailContext(), f = S.fd;
  if (c.errors.length) return;
  var entry = {
    code: c.n.code, natureLabel: c.n.label, sub: c.sub, baseSub: c.o.sub, objLabel: c.o.label,
    detail: f.detail.trim(), loc: c.loc, qty: c.qty, sev: f.sev, comment: f.comment.trim(),
    sevNum: c.sevNum, cdve: f.cdve
  };
  var saved = S.editIdx !== null ? S.editIdx + 1 : S.defects.length + 1;
  if (S.editIdx !== null) S.defects[S.editIdx] = entry; else S.defects.push(entry);
  S.editIdx = null;
  S.dupFrom = null;
  go("list");
  toast("Défaut " + saved + " enregistré");
}

function openDetail(code, sub, editIdx, dupFrom) {
  S.natCode = code;
  S.objSub = sub;
  S.editIdx = editIdx;
  S.dupFrom = dupFrom;
  initDetailForm();
  go("detail");
}

function copyText(text) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) { toast("Texte copié"); return; }
    var pre = app.querySelector("#ncw-sap"), range = document.createRange();
    range.selectNodeContents(pre);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast("Texte sélectionné : Ctrl+C pour copier");
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Texte copié"); }, fallback);
      return;
    }
  } catch (e) { /* blocked in some sandboxes */ }
  fallback();
}

function download(row) {
  try {
    var blob = new Blob([rowToCsv(row)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "nc_" + row.submission_id + ".csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 0);
  } catch (e) {
    toast("Téléchargement impossible ici");
  }
}

function submit() {
  if (S.sending || !S.defects.length) return;
  var row = buildRow(S.header, S.ctxCombo, S.ctxText, S.defects, S.actCombo, S.actText, new Date());
  S.sending = true;
  S.error = "";
  try {
    var mode = sendToSlate(row);
    S.done = { row: row, mode: mode };
    S.sending = false;
    S.screen = "done";
  } catch (e) {
    S.sending = false;
    S.error = "Envoi impossible : " + (e && e.message ? e.message : e) + " La NC n'est pas perdue : copiez le texte ou réessayez.";
  }
  render();
}

function onClick(e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled || !app.contains(el)) return;
  var act = el.getAttribute("data-act"), i = parseInt(el.getAttribute("data-i"), 10), v = el.getAttribute("data-v");
  if (act === "header-continue") {
    if (!headerComplete()) return;
    S.header = headerValues();
    go("list");
  } else if (act === "pick-detection") { S.hd.detectionSel = v; render(); }
  else if (act === "pick-ctx") { S.ctxCombo = S.ctxCombo === v ? "" : v; render(); }
  else if (act === "pick-act") { S.actCombo = S.actCombo === v ? "" : v; render(); }
  else if (act === "back") go(el.getAttribute("data-to"));
  else if (act === "edit-header") go("header");
  else if (act === "add-defect") { S.editIdx = null; S.dupFrom = null; go("nature"); }
  else if (act === "duplicate-last") {
    var last = S.defects[S.defects.length - 1];
    openDetail(last.code, last.baseSub, null, S.defects.length - 1);
  } else if (act === "edit-defect") openDetail(S.defects[i].code, S.defects[i].baseSub, i, null);
  else if (act === "delete-defect") { S.defects.splice(i, 1); render(); toast("Défaut " + (i + 1) + " supprimé"); }
  else if (act === "finish") go("review");
  else if (act === "pick-nature") { S.natCode = el.getAttribute("data-code"); go("object"); }
  else if (act === "pick-object") openDetail(el.getAttribute("data-code"), el.getAttribute("data-sub"), null, null);
  else if (act === "set-sev") { S.fd.sev = v; S.fd.sevTouched = true; render(); }
  else if (act === "cancel-detail") {
    var back = S.editIdx !== null || S.dupFrom !== null ? "list" : "object";
    S.editIdx = null;
    S.dupFrom = null;
    go(back);
  } else if (act === "save-defect") saveDefect();
  else if (act === "copy") copyText(S.screen === "done" ? S.done.row.texte_sap : sapText());
  else if (act === "submit") submit();
  else if (act === "download") download(S.done.row);
  else if (act === "new-nc") { resetState(); go("header"); }
}

function onInput(e) {
  var el = e.target, field = el.getAttribute && el.getAttribute("data-field");
  if (!field) return;
  var val = el.type === "checkbox" ? el.checked : el.value;
  var parts = field.split(".");
  if (parts.length === 2) S[parts[0]][parts[1]] = val; else S[field] = val;
  if (parts[0] === "hd") {
    if (field === "hd.produitSel") render(); else refreshHeaderButton();
  } else if (parts[0] === "fd") {
    if (field === "fd.cdve") {
      var o = findObject(findNature(S.natCode), S.objSub);
      if (!S.fd.sevTouched) S.fd.sev = autoSeverity(S.fd.cdve ? 10 : o.sev);
      render();
    } else refreshDetail();
  } else if (field === "query") {
    app.querySelector("#ncw-results").innerHTML = renderNatureResults();
  } else if (field === "ctxText" || field === "actText") {
    refreshPanel();
  }
}

function isChoice(el) { return el.tagName === "SELECT" || el.type === "checkbox"; }

function init() {
  app = document.getElementById("nc-writer");
  if (!app) {
    app = document.createElement("div");
    app.id = "nc-writer";
    document.body.appendChild(app);
  }
  app.className = "ncw";
  resetState();
  app.addEventListener("click", onClick);
  // text fields on "input", selects and checkboxes on "change" (some browsers fire both for a select)
  app.addEventListener("input", function (e) { if (!isChoice(e.target)) onInput(e); });
  app.addEventListener("change", function (e) { if (isChoice(e.target)) onInput(e); });
  go("header");
}

if (typeof module === "object" && module.exports) {
  module.exports = { NATURES: NATURES, PRODUITS: PRODUITS, DETECTIONS: DETECTIONS, FIN_MAPPING: FIN_MAPPING, FIN_GLOBAL_SUGGEST: FIN_GLOBAL_SUGGEST,
    CTX_OPTIONS: CTX_OPTIONS, ACT_OPTIONS: ACT_OPTIONS, CONFIG: CONFIG, genLine: genLine, buildSapText: buildSapText, buildRow: buildRow,
    searchObjects: searchObjects, sortedNatures: sortedNatures, suggestedFins: suggestedFins, rowToCsv: rowToCsv, formatTimestamp: formatTimestamp };
} else if (typeof document !== "undefined") {
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
}
})(typeof window !== "undefined" ? window : this);
</script>
</body>
</html>
