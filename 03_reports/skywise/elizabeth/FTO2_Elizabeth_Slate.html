        g += '<rect x="' + x.toFixed(1) + '" y="' + Y(v).toFixed(1) + '" width="' + (bw * 0.68).toFixed(1) + '" height="' + Math.max(v ? 1 : 0, Y(0) - Y(v)).toFixed(1) + '" rx="1.5" fill="' + (hot ? 'var(--up)' : row[2]) + '" fill-opacity="' + (cur ? (dim ? .45 : 1) : .3) + '"' +
          tipA(row[1] + ' · ' + wkLong(i), [num(cnt[i]) + ' NC' + (k !== 'nc' ? ' · ' + pctTx(share(SER, k, i)) + ' % des ' + num(SER.nc[i]) + ' NC de la semaine' : ''), hot ? 'au-dessus du seuil (' + thrTx() + ')' : '']) + '/>';
        if (hot && cur && bw > 18) g += '<text x="' + (x + bw * 0.34).toFixed(1) + '" y="' + (Y(v) - 3).toFixed(1) + '" text-anchor="middle" class="ink b" style="font-size:10.5px">' + (pc ? pctTx(v) + '%' : v) + '</text>';
        if (j % (bw < 22 ? 4 : 2) === 0 || i === S.week) g += '<text x="' + (x + bw * 0.34).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" style="font-size:10.5px"' + (i === S.week ? ' class="ink b"' : '') + '>' + wkShort(i) + '</text>'; });
      if (line) g += '<line x1="0" x2="' + cw + '" y1="' + Y(S.thr).toFixed(1) + '" y2="' + Y(S.thr).toFixed(1) + '" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4"/>';
      var tp = sumOver(SER.nc, ws);
      return '<div class="wrow"><div class="wl"><b>' + esc(row[1]) + '</b><small>' + num(sumOver(cnt, ws)) + ' NC sur la période' + (k !== 'nc' && tp ? ' · ' + num(sumOver(cnt, ws) / tp * 100) + ' %' : '') + '</small>' +
        (line ? '<small class="' + (over.length ? 'hot' : '') + '">' + (over.length ? 'au-dessus : ' + over.map(wkShort).join(', ') : 'jamais au-dessus') + '</small>' : '') + '</div>' +
        '<svg width="' + cw + '" height="' + H + '" viewBox="0 0 ' + cw + ' ' + H + '" role="img" aria-label="' + esc(row[1]) + ' par semaine">' + g + '</svg></div>';
    }).join('');
  }
  // the NCs of the period that have one of the families (the family pressed only, when one is)
  function renderTable(ws) {
    var set = {}; ws.forEach(function (i) { set[i] = 1; });
    var rows = []; NCS.forEach(function (n, i) { if (set[NCW[i]] && inScope(i) && (S.fam ? n[S.fam] : n.br || n.dv || n.cb)) rows.push(i); });
    rows.sort(function (a, b) { return NCS[b].d < NCS[a].d ? -1 : NCS[b].d > NCS[a].d ? 1 : 0; });
    $('tblT').textContent = S.fam ? 'Les NC · ' + FK[S.fam].name : 'Les NC de ces trois familles';
    $('tblN').textContent = num(rows.length) + ' NC';
    var mk = function (on, col) { return on ? '<span style="color:' + col + '">●</span>' : ''; };
    $('tblB').innerHTML = rows.length ? rows.slice(0, S.lim).map(function (i) { var n = NCS[i], d = BYNC[i].filter(function (x) { return S.fam ? FK[S.fam].has(x) : FAM.some(function (f) { return f.has(x); }); })[0];
      return '<tr><td class="n">' + esc(dayFr(n.d)) + '</td><td class="n">' + esc(n.id) + '</td><td class="n">' + esc(n.msn) + '</td><td>' + esc(n.st) + '</td><td class="mk">' + mk(n.br, FK.br.col) + '</td><td class="mk">' + mk(n.dv, FK.dv.col) + '</td><td class="mk">' + mk(n.cb, FK.cb.col) + '</td>' +
        '<td class="txt">' + esc(d ? (d.rca ? d.rca + ' · ' : '') + d.t : n.t) + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="mu">Aucune NC.</td></tr>';
    $('tblMore').hidden = rows.length <= S.lim;
  }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return; var a = t.getAttribute.bind(t);
    if (a('data-line') != null) { S.line = a('data-line'); S.lim = 50; remember(); render(); return; }
    if (a('data-ph') != null) { S.ph = a('data-ph'); remember(); render(); return; }
    if (a('data-per') != null) { S.per = +a('data-per'); remember(); render(); return; }
    if (a('data-tm')) { S.tm = a('data-tm'); remember(); render(); return; }
    if (a('data-fam')) { S.fam = S.fam === a('data-fam') ? null : a('data-fam'); S.lim = 50; render(); return; }
    if (t.id === 'famX') { S.fam = null; render(); return; }
    if (t.id === 'tblMore') { S.lim += 100; render(); return; }
  });
  $('wk').addEventListener('change', function (e) { S.week = +e.target.value; render(); });
  $('thr').addEventListener('change', function (e) { var v = Math.round(+e.target.value); if (v > 0) { S.thr = v; remember(); } render(); });
  var tip = $('tip');
  document.addEventListener('pointermove', function (e) { var t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    var ps = t.getAttribute('data-tip').split('|').filter(Boolean); tip.innerHTML = '<b>' + esc(ps[0]) + '</b>' + ps.slice(1).map(esc).join('<br>'); tip.hidden = false;
    var x = e.clientX + 14, y = e.clientY + 14, r = tip.getBoundingClientRect(); if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14; if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
  render();
}

// ---------------------------------------------------------------- start: the page's own copy of the tables, or Slate's two queries
(function () {
  var MSG = {
    wait: 'Chargement des données Slate… / Loading the Slate data…',
    empty: 'La requête q_fto2_nc n’a renvoyé aucune ligne : vérifiez la requête et son jeu de données.',
    noapi: 'État Slate introuvable : ce JavaScript doit tourner dans un code sandbox Slate dont l’état contient les deux requêtes (voir state.json).',
    slow: 'Toujours en attente de {q} : vérifiez que la requête existe, porte ce nom et s’exécute sans erreur.'
  };
  function showError(msg) {
    var e = document.getElementById('fto2-err'); if (e) { e.hidden = false; e.textContent = 'Le tableau n\'a pas pu s\'afficher : ' + msg; }
    var w = document.getElementById('fto2-wait'); if (w) w.hidden = true;
    if (window.console) console.error('[FTO2 Elizabeth]', msg);
  }
  function status(msg, warn) { var e = document.getElementById('fto2-wait'); if (!e) return; e.hidden = !msg; e.textContent = msg || ''; e.className = 'fto2-wait' + (warn ? ' warn' : ''); }
  window.addEventListener('error', function (ev) { showError((ev && ev.message) || 'erreur inconnue'); });
  function parse(v) { if (typeof v !== 'string') return v; var s = v.trim(); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } }
  function count(t) { if (!t) return 0; if (Array.isArray(t)) return t.length; var k = Object.keys(t); for (var i = 0; i < k.length; i++) if (t[k[i]] && t[k[i]].length) return t[k[i]].length; return 0; }
  function loaded(t) { return !!t && (Array.isArray(t) || Object.keys(t).length > 0); }
  var started = false, got = {};
  function start(nc, def) {
    started = true;
    try {
      var D = elzFromTables(nc, def);
      if (!D.ncs.length) { var c = Array.isArray(nc) ? Object.keys(nc[0] || {}) : Object.keys(nc || {}); showError('aucune NC FTO2 de 2026 lisible dans q_fto2_nc (colonnes reçues : ' + c.join(', ') + ')'); return; }
      status(''); elzMain(D, window.ELZ_REF || {});
    } catch (e) { showError((e && e.message) || String(e)); }
  }
  function tryStart() {
    if (started) return;
    var nc = parse(got.nc), def = parse(got.def);
    if (loaded(nc) && !count(nc)) { status(MSG.empty, true); return; }
    if (!count(nc) || !loaded(def)) { status(MSG.wait); return; }
    start(nc, def);
  }
  function boot() {
    if (window.ELZ_TABLES) { start(window.ELZ_TABLES.nc, window.ELZ_TABLES.def); return; }
    var api = window.SlateFunctions;
    if (!api || !api.watch) { showError(MSG.noapi); return; }
    status(MSG.wait);
    ['nc', 'def'].forEach(function (k) { api.watch(k, function (v) { got[k] = v; tryStart(); }); });
    setTimeout(function () { if (started) return; var miss = []; if (!count(parse(got.nc))) miss.push('q_fto2_nc'); if (!loaded(parse(got.def))) miss.push('q_fto2_def');
      if (miss.length) status(MSG.slow.replace('{q}', miss.join(', ')), true); }, 20000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
/* ===== JS END ===== */
