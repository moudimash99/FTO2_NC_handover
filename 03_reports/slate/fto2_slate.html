<!-- FTO2 NC dashboard for a Slate code box. Data: NCs created 2026-01-01 to 2026-09-28. Generated by build/build_all.py; do not edit by hand. -->
<div class="fto2">
<div id="fto2-err" class="fto2-err" hidden></div>
<div class="wrap">
  <header>
    <div class="topbar">
      <div class="unit">FTO2 · <span data-t="unit"></span></div>
      <div class="right"><span class="asof" id="asof"></span>
      <div class="seg lang" role="group" aria-label="Langue / Language">
        <button type="button" id="lFr" aria-pressed="true">FR</button>
        <button type="button" id="lEn" aria-pressed="false">EN</button>
      </div></div>
    </div>
    <div class="titles">
      <h1 data-t="title"></h1>
      <p class="period" id="period"></p>
    </div>
    <section class="fbar" aria-labelledby="fbLab">
      <h2 class="fb-title" id="fbLab" data-t="fbTitle"></h2>
      <div class="fb-row">
        <div class="fb"><label for="gSrc" data-t="fSrc"></label><select id="gSrc"></select></div>
        <div class="fb" id="gPlantBox"><span id="gPlantLab" data-t="fPlant"></span><button type="button" role="switch" class="switch" id="gPlant" aria-labelledby="gPlantLab"><i aria-hidden="true"></i><b id="gPlantTxt"></b></button><small class="fb-note" id="gPlantNote" hidden></small></div>
        <div class="fb"><span id="gPhLab" data-t="fPhase"></span><div class="seg" role="radiogroup" aria-labelledby="gPhLab" id="gPhase"></div></div>
        <div class="fb"><label for="gLine" data-t="fLine"></label><select id="gLine"></select></div>
        <div class="fb" id="gDateBox"><label for="gPreset" data-t="fPeriod"></label>
          <div class="fb-dates"><select id="gPreset"></select><input type="date" id="gFrom" data-ta="fFrom"><span class="mu" aria-hidden="true">→</span><input type="date" id="gTo" data-ta="fTo"></div></div>
        <div class="fb" id="minorCtl"><span id="miLab" data-t="minorLabel"></span>
          <div class="seg" role="group" aria-labelledby="miLab"><button type="button" id="miIn" data-t="minorIn"></button><button type="button" id="miOut" data-t="minorOut"></button></div></div>
        <button type="button" class="fb-reset" id="gReset" data-t="fReset" hidden></button>
      </div>
      <p class="fb-sum" id="fbSum" aria-live="polite"></p>
    </section>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" id="tab-ov" aria-controls="p-ov" data-tab="ov" data-t="tabOv"></button>
    <button type="button" role="tab" id="tab-pareto" aria-controls="p-pareto" data-tab="pareto" data-t="tabPareto"></button>
    <button type="button" role="tab" id="tab-ana" aria-controls="p-ana" data-tab="ana" data-t="tabAna"></button>
    <button type="button" role="tab" id="tab-cnq" aria-controls="p-cnq" data-tab="cnq" data-t="tabCnq"></button>
    <span class="gap" aria-hidden="true"></span>
    <button type="button" role="tab" id="tab-client" aria-controls="p-client" data-tab="client" data-t="tabClient"></button>
    <span class="gap" aria-hidden="true"></span>
    <button type="button" role="tab" id="tab-rca" aria-controls="p-rca" data-tab="rca" data-t="tabRca"></button>
    <span class="gap" aria-hidden="true" data-gal="1"></span>
    <button type="button" role="tab" id="tab-gal" aria-controls="p-gal" data-tab="gal" data-t="tabGal"></button>
    <button type="button" role="tab" id="tab-prod" aria-controls="p-prod" data-tab="prod" data-t="tabProd"></button>
    <button type="button" role="tab" id="tab-hebdo" aria-controls="p-hebdo" data-tab="hebdo" data-t="tabWeek"></button>
    <button type="button" role="tab" id="tab-mft" aria-controls="p-mft" data-tab="mft" data-t="tabMft"></button>
    <button type="button" role="tab" id="tab-rev" aria-controls="p-rev" data-tab="rev" data-t="tabRev"></button>
  </div>

  <!-- 1. Overview: headline figures and every chart counted in NCs -->
  <div class="panel" role="tabpanel" id="p-ov" aria-labelledby="tab-ov" hidden>
    <div class="lead"><h2 data-t="ncTitle"></h2><p class="sub" data-t="ncSub"></p></div>
    <div class="figs">
      <div class="fig"><b id="nf1"></b><span data-t="nK1"></span></div>
      <div class="fig"><b id="nfD"></b><span data-t="nKD"></span></div>
      <div class="fig"><b id="nfDP"></b><span data-t="nKDP"></span><small data-t="nKDPs"></small></div>
      <div class="fig"><b id="nfC"></b><span data-t="nKC"></span></div>
      <div class="fig"><b id="nf2"></b><span data-t="nK2"></span></div>
      <div class="fig"><b id="nf3"></b><span data-t="nK3"></span><small data-t="nK3s"></small></div>
      <div class="fig"><b id="nf4"></b><span data-t="nK4"></span><small data-t="nK4s"></small></div>
    </div>
    <div class="chips" id="ncChips"></div>
    <div class="grid" id="ng"></div>
    <details class="detail"><summary><span data-t="tblNcs"></span><span class="count" id="nn"></span></summary>
      <div class="inner">
        <input type="search" id="nq" autocomplete="off">
        <div class="table-wrap"><table><thead><tr id="nth"></tr></thead><tbody id="ntb"></tbody></table></div>
        <button type="button" class="more" id="nm" hidden></button>
      </div></details>
  </div>

  <!-- 2. Pareto: volume (defects) or cost, same breakdowns -->
  <div class="panel" role="tabpanel" id="p-pareto" aria-labelledby="tab-pareto" hidden>
    <div class="lead"><h2 data-t="paretoTitle"></h2><p class="sub" data-t="serieSub"></p></div>
    <div class="controls">
      <div class="ctl"><span class="label" id="pmLab" data-t="measureLabel"></span>
        <div class="seg" role="group" aria-labelledby="pmLab" id="pMode"></div></div>
    </div>
    <section class="psec" id="pVol">
      <div class="figs">
        <div class="fig"><b id="pf1"></b><span data-t="figDefects"></span></div>
        <div class="fig"><b id="pf2" class="word"></b><span data-t="figTopCat"></span><small id="pf2s"></small></div>
        <div class="fig"><b id="pf3"></b><span data-t="figCableShare"></span><small id="pf3s"></small></div>
      </div>
      <p class="sub" data-t="ncShareNote"></p>
      <div class="chips" id="pc"></div>
      <div class="grid" id="pg"></div>
      <details class="detail" id="pd"><summary><span data-t="tblDefects"></span><span class="count" id="pn"></span></summary>
        <div class="inner">
          <input type="search" id="pq" autocomplete="off">
          <div class="table-wrap"><table><thead><tr id="pth"></tr></thead><tbody id="ptb"></tbody></table></div>
          <button type="button" class="more" id="pm" hidden></button>
        </div></details>
    </section>
    <section class="psec" id="pCost" hidden>
      <div class="figs">
        <div class="fig"><b id="kf1"></b><span data-t="kTotal"></span></div>
        <div class="fig"><b id="kf2" class="word"></b><span data-t="kTopCat"></span><small id="kf2s"></small></div>
        <div class="fig"><b id="kf3"></b><span data-t="kCableShare"></span><small id="kf3s"></small></div>
      </div>
      <p class="sub" data-t="costSub"></p>
      <div class="chips" id="kc"></div>
      <div class="grid" id="kg"></div>
      <details class="detail"><summary><span data-t="tblCost"></span><span class="count" id="kn"></span></summary>
        <div class="inner">
          <input type="search" id="kq" autocomplete="off">
          <div class="table-wrap"><table><thead><tr id="kth"></tr></thead><tbody id="ktb"></tbody></table></div>
          <button type="button" class="more" id="km" hidden></button>
        </div></details>
    </section>
  </div>

  <!-- 2. Weekly Pareto (series) -->
  <div class="panel" role="tabpanel" id="p-hebdo" aria-labelledby="tab-hebdo" hidden>
    <div class="lead"><h2 data-t="weekTitle"></h2><p class="sub" data-t="serieSub"></p></div>
    <div class="controls">
      <div class="weekbar">
        <button type="button" id="wPrev" data-ta="prevWeek">←</button>
        <select id="wSel" data-ta="weekLabel"></select>
        <button type="button" id="wNext" data-ta="nextWeek">→</button>
      </div>
      <div class="ctl"><span class="label" id="wwLab" data-t="winLabel"></span>
        <div class="seg" role="group" aria-labelledby="wwLab" id="wWin"></div></div>
    </div>
    <p class="sub" id="wRange"></p>
    <div class="figs">
      <div class="fig"><b id="wf1"></b><span data-t="wDefects"></span></div>
      <div class="fig"><b id="wf2"></b><span data-t="wNcs"></span></div>
      <div class="fig"><b id="wf3"></b><span id="wf3l"></span></div>
      <div class="fig"><b id="wf4" class="word"></b><span data-t="wTopRca"></span><small id="wf4s"></small></div>
    </div>
    <div class="card wide">
      <div class="card-head"><h3 data-t="wMatrix"></h3>
        <div class="seg" role="group" data-ta="wLevel" id="wLvl"></div></div>
      <p class="sub" data-t="wMatrixSub"></p>
      <div class="table-wrap"><table class="matrix" id="wMatrix"></table></div>
    </div>
    <div class="card wide">
      <div class="card-head"><h3 id="wTrendTitle"></h3><button type="button" class="clear-one" id="wProbClear" hidden></button></div>
      <p class="sub" data-t="wTrendSub"></p>
      <div class="cols-wrap"><div class="cols" id="wTrendCols"></div></div>
    </div>
    <div class="chips" id="wc"></div>
    <div class="grid" id="wg"></div>
    <details class="detail"><summary><span data-t="tblWeek"></span><span class="count" id="wn"></span></summary>
      <div class="inner">
        <input type="search" id="wq" autocomplete="off">
        <div class="table-wrap"><table><thead><tr id="wth"></tr></thead><tbody id="wtb"></tbody></table></div>
        <button type="button" class="more" id="wm" hidden></button>
      </div></details>
  </div>

  <!-- 3. Cost of non-quality (series) -->
  <div class="panel" role="tabpanel" id="p-cnq" aria-labelledby="tab-cnq" hidden>
    <div class="lead"><h2 data-t="cnqTitle"></h2><p class="sub" data-t="cnqSub"></p></div>
    <div class="strip" id="cStrip"></div>
    <div class="figs">
      <div class="fig"><b id="cf1"></b><span data-t="cTotal"></span></div>
      <div class="fig"><b id="cf2"></b><span data-t="cNcs"></span></div>
      <div class="fig"><b id="cf3"></b><span data-t="cPerNc"></span></div>
      <div class="fig"><b id="cf4"></b><span data-t="cCable"></span><small id="cf4s"></small></div>
    </div>
    <div class="card">
      <div class="card-head"><h3 data-t="cLevels"></h3></div>
      <div class="levels" id="cLevels"></div>
      <p class="sub" data-t="cLevelsSub"></p>
    </div>
    <details class="explain" id="cx">
      <summary data-t="cxSum"></summary>
      <div class="cx-in">
        <section class="cx-sec">
          <h3 data-t="cxStepsT"></h3>
          <p class="sub" data-t="cxStepsSub"></p>
          <ol class="cxchain" id="cxChain"></ol>
          <div class="cxplus" id="cxPlus"></div>
          <p class="cxformula" id="cxFormula"></p>
          <p class="sub" id="cxExample"></p>
          <details class="vdata"><summary data-t="cxRulesSum"></summary><div class="table-wrap" id="cxRules"></div></details>
        </section>
        <section class="cx-sec cx-nc">
          <h3 data-t="cxNcT"></h3>
          <div class="cx-pick">
            <label for="cxNum" data-t="cxNum"></label>
            <input type="text" id="cxNum" list="cxList" inputmode="numeric" autocomplete="off">
            <datalist id="cxList"></datalist>
            <button type="button" class="cxb go" id="cxGo" data-t="cxShow"></button>
          </div>
          <div class="cx-pick" id="cxEx" role="group"></div>
          <div id="cxOut" aria-live="polite"></div>
        </section>
      </div>
    </details>
    <div class="chips" id="cc"></div>
    <div class="grid" id="cg"></div>
    <details class="detail"><summary><span data-t="tblNc"></span><span class="count" id="cn"></span></summary>
      <div class="inner">
        <input type="search" id="cq" autocomplete="off">
        <div class="table-wrap"><table><thead><tr id="cth"></tr></thead><tbody id="ctb"></tbody></table></div>
        <button type="button" class="more" id="cm" hidden></button>
      </div></details>
  </div>

  <!-- 3b. Insights (series) -->
  <div class="panel" role="tabpanel" id="p-ana" aria-labelledby="tab-ana" hidden>
    <section class="hero"><h2 data-t="anaTitle"></h2><p class="sub" data-t="anaSub"></p></section>
    <div class="vgrid" id="ag"></div>
  </div>

  <!-- Follow-up page: MFT actions -->
  <div class="panel" role="tabpanel" id="p-mft" aria-labelledby="tab-mft" hidden>
    <div class="lead"><h2 data-t="mftTitle"></h2><p class="sub" data-t="mftSub"></p></div>
    <div id="mftg"></div>
  </div>

  <!-- 4. Customer returns -->
  <div class="panel" role="tabpanel" id="p-client" aria-labelledby="tab-client" hidden>
    <div class="lead"><h2 data-t="clientTitle"></h2><p class="sub" data-t="clientSub"></p></div>
    <div class="figs">
      <div class="fig"><b id="rf1"></b><span data-t="rNcs"></span></div>
      <div class="fig"><b id="rf2"></b><span data-t="rDamaged"></span></div>
      <div class="fig"><b id="rf3"></b><span data-t="rPhys"></span></div>
      <div class="fig"><b id="rf4"></b><span data-t="rCost"></span></div>
    </div>
    <div class="chips" id="rc"></div>
    <div class="grid" id="rg"></div>
    <details class="detail"><summary><span data-t="tblClient"></span><span class="count" id="rn"></span></summary>
      <div class="inner">
        <p class="sub" data-t="tblClientSub"></p>
        <input type="search" id="rq" autocomplete="off">
        <div class="table-wrap"><table><thead><tr id="rth2"></tr></thead><tbody id="rtb2"></tbody></table></div>
        <button type="button" class="more" id="rm" hidden></button>
      </div></details>
  </div>

  <!-- 5. Root causes -->
  <div class="panel" role="tabpanel" id="p-rca" aria-labelledby="tab-rca" hidden>
    <div class="lead"><h2 data-t="rcaTitle"></h2><p class="sub" data-t="rcaSub"></p></div>
    <div class="card">
      <h3 data-t="rcaHowTitle"></h3>
      <div class="chain" id="rcaChain"></div>
      <p class="sub" data-t="rcaHow1"></p>
      <p class="sub" data-t="rcaHow2"></p>
    </div>
    <div class="table-wrap"><table class="rcatab"><thead><tr id="rth"></tr></thead><tbody id="rtb"></tbody></table></div>
    <div id="rcaCards" class="panel"></div>
  </div>

  <!-- 6. Gallery: chart ideas on fictitious data (local page only) -->
  <div class="panel" role="tabpanel" id="p-gal" aria-labelledby="tab-gal" hidden>
    <section class="hero"><span class="fict" data-t="galBadge"></span><h2 data-t="galTitle"></h2><p class="sub" data-t="galSub"></p></section>
    <div class="gal-bar"><div class="seg" role="group" data-ta="galFilter" id="gFeas"></div><p class="gal-keep" id="gKeep"></p></div>
    <div class="ggrid" id="gg"></div>
  </div>

  <!-- 7. NC rates: NCs, defects and cost per unit of volume built (local page only) -->
  <div class="panel" role="tabpanel" id="p-prod" aria-labelledby="tab-prod" hidden>
    <section class="hero"><span class="fict" id="pBadge"></span><h2 data-t="prodTitle"></h2><p class="sub" data-t="prodSub"></p><p class="sub" id="pCover"></p></section>
    <div class="gal-bar"><div class="controls"><div class="seg" role="group" data-ta="prodData" id="pSrcSeg"></div><div class="seg" role="group" data-ta="prodVer" id="pVerSeg"></div></div><p class="gal-keep" id="pKeep"></p></div>
    <div class="ggrid" id="pg2"></div>
  </div>

  <!-- Review page: the proposed final layout, each chart with the choices to make (local review page only) -->
  <div class="panel" role="tabpanel" id="p-rev" aria-labelledby="tab-rev" hidden>
    <section class="hero"><h2 data-t="revTitle"></h2><p class="sub" data-t="revSub"></p><p class="sub" data-t="revHow"></p></section>
    <div class="gal-bar rv-bar">
      <div class="controls"><div class="seg" role="group" data-ta="rvShowLab" id="rvShow"></div><button type="button" class="cxb" id="rvCopy" data-t="rvCopy"></button></div>
      <p class="gal-keep" id="rvSum" aria-live="polite"></p>
      <p class="rv-save" id="rvSave" aria-live="polite"></p>
    </div>
    <textarea class="rv-copybox" id="rvCopyBox" readonly hidden></textarea>
    <div id="rvBody"></div>
  </div>

  <div id="tip" role="tooltip" hidden></div>
  <footer><p id="foot1"></p><p data-t="foot2"></p><p id="foot3"></p><p data-t="foot4"></p><p data-t="foot5"></p></footer>
</div>
</div>
